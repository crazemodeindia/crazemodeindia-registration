<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craze Mode - Premium Registration Engine</title>
  <style>
    /* Google Fonts: Oxanium (Gaming Brand) & Space Mono (High-End Monospace) */
    @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Oxanium', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 1. INTRO SPLASH SCREEN */
    .splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Unified Brand Typography */
    .brand-logo-unified {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 5px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .splash-logo {
      margin-bottom: 8px;
    }

    .splash-sub {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      color: #444444;
      text-transform: uppercase;
    }

    /* Mobile-Friendly Proportional Viewport */
    .viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh; /* Responsive height fit for mobile screens */
      max-height: 820px; /* Locked maximum scale for desktops */
      background-color: #0A0A0A;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .header-left .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #7A7A7A; /* Higher contrast gray label */
    }

    .header-right {
      text-align: right;
    }

    .logo-brand {
      font-size: 16px;
    }

    .logo-sub {
      font-size: 7px;
      letter-spacing: 0.5px;
      color: #444444;
      margin-top: 3px;
    }

    /* Thin Horizontal Divider under Header */
    .header-divider {
      width: 100%;
      height: 1px;
      background-color: #161616;
      margin-bottom: 20px;
    }

    /* STATUS TRACKER BAR - Now permanently anchored on top below headerdivider */
    .status-section {
      width: 100%;
      margin-bottom: 24px;
    }

    .status-label {
      font-size: 11px; /* Scaled up for mobile readability */
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #7A7A7A;
      margin-bottom: 6px;
    }

    .status-bar {
      width: 100%;
      height: 2px;
      background-color: #161616;
      position: relative;
    }

    /* Animated progress fill */
    .status-bar-fill {
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, #ffffff 0%, #777777 50%, #ffffff 100%);
      background-size: 200% auto;
      animation: status-glow 2.5s linear infinite;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
      transition: width 0.3s ease;
    }

    /* High-end mild gradient completed gaming status bar */
    .status-bar-fill.completed {
      background: linear-gradient(90deg, #00F2FE 0%, #4FACFE 50%, #00F2FE 100%) !important;
      background-size: 200% auto !important;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.6) !important;
      animation: status-glow 2s linear infinite !important;
    }

    @keyframes status-glow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* CARDS CONTAINER */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px; /* Sized up from 330px to prevent mobile drop-down cutoffs */
      overflow-y: auto;
      scrollbar-width: none;
    }
    .cards-container::-webkit-scrollbar {
      display: none;
    }

    .card {
      width: 100%;
      height: 48px;
      background-color: #000000;
      border: 1px solid #161616;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0 !important; /* Strict lock preventing card compression on multi-stacks */
      transition: all 0.2s ease;
    }

    /* Card Glow shine animation */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 80px;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .card.shine-sweep::before {
      animation: sweep 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sweep {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    /* Active verification border glow */
    .card.mild-shine {
      animation: border-glow-pulsing 2s infinite alternate;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.04);
    }

    @keyframes border-glow-pulsing {
      0% { border-color: #161616; }
      50% { border-color: #444444; }
      100% { border-color: #777777; }
    }

    /* Card States */
    .card.success-gmail {
      border-color: #61A843 !important;
    }

    .card.success-telegram {
      border-color: #0088cc !important;
    }

    .card.success-profile {
      border-color: #FFFFFF !important;
    }

    /* High-frequency micro-vibration error */
    .card.error-state {
      border-color: #ff3d00 !important;
      animation: micro-vibrate 0.15s linear infinite;
    }

    @keyframes micro-vibrate {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-0.5px, 0.5px); }
      20% { transform: translate(0.5px, -0.5px); }
      30% { transform: translate(-0.5px, -0.5px); }
      40% { transform: translate(0.5px, 0.5px); }
      50% { transform: translate(-0.5px, 0.5px); }
      60% { transform: translate(0.5px, -0.5px); }
      70% { transform: translate(-0.5px, -0.5px); }
      80% { transform: translate(0.5px, 0.5px); }
      90% { transform: translate(-0.5px, -0.5px); }
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    .card-label {
      font-size: 11px; /* Scaled up for mobile readability */
      font-weight: 600;
      color: #7A7A7A; 
      letter-spacing: 1px;
      margin-bottom: 1px;
      text-transform: uppercase;
    }

    .card-value {
      font-size: 15px; /* Scaled up for mobile readability */
      font-weight: 500;
      color: #EAEAEA; 
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card.success-gmail .card-value,
    .card.success-telegram .card-value,
    .card.success-profile .card-value {
      color: #FFFFFF;
    }

    /* Checkbox representation */
    .checkbox-icon {
      width: 14px;
      height: 14px;
      border: 1px solid #161616;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card.success-gmail .checkbox-icon {
      border-color: #61A843;
      background-color: #61A843;
    }

    .card.success-telegram .checkbox-icon {
      border-color: #0088cc;
      background-color: #0088cc;
    }

    .card.success-profile .checkbox-icon {
      border-color: #FFFFFF;
      background-color: #FFFFFF;
    }

    .checkmark {
      width: 6px;
      height: 4px;
      border-left: 2px solid #000000;
      border-bottom: 2px solid #000000;
      transform: rotate(-45deg);
      display: none;
      margin-top: -1px;
    }

    .card.success-gmail .checkmark,
    .card.success-telegram .checkmark,
    .card.success-profile .checkmark {
      display: block;
    }

    /* Verification Status Spinner */
    .verify-animation-box {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
    }

    .card.verifying .verify-animation-box {
      display: block;
    }
    
    .card.verifying .checkbox-icon {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* CODE OTP DISPLAY BOXES */
    .code-boxes {
      display: flex;
      gap: 6px;
    }

    .code-box-display {
      width: 12px;
      height: 16px;
      border: 1px solid #161616;
      color: #FFFFFF;
      text-align: center;
      font-size: 11px;
      line-height: 16px;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      position: relative;
    }

    .code-box-display.active {
      border-color: #FFFFFF;
    }

    /* Falling numbers cascading error effect */
    .code-box-display span {
      display: inline-block;
      width: 100%;
      height: 100%;
      transition: none;
    }

    .code-box-display.falling span {
      animation: fall-off 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes fall-off {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(50px) rotate(45deg); opacity: 0; }
    }

    /* Staggered cascading delay */
    .code-box-display.falling:nth-child(1) span { animation-delay: 0.0s; }
    .code-box-display.falling:nth-child(2) span { animation-delay: 0.08s; }
    .code-box-display.falling:nth-child(3) span { animation-delay: 0.16s; }
    .code-box-display.falling:nth-child(4) span { animation-delay: 0.24s; }
    .code-box-display.falling:nth-child(5) span { animation-delay: 0.32s; }
    .code-box-display.falling:nth-child(6) span { animation-delay: 0.40s; }

    /* INLINE CARD DROPDOWN */
    .card.dropdown-active {
      height: auto;
      min-height: 140px;
      align-items: flex-start;
      flex-direction: column;
    }

    .dropdown-list-inline {
      width: 100%;
      margin-top: 8px;
      border-top: 1px dashed #161616;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px; /* Balanced spacing */
    }

    .dropdown-option-inline {
      font-size: 13px; /* Enlarged for complete legibility */
      color: #666666;
      cursor: pointer;
      transition: color 0.15s;
    }

    .dropdown-option-inline:hover {
      color: #FFFFFF;
    }

    .dropdown-option-inline.selected {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* STATIONARY BOTTOM ZONE (Optimized height for zero text merging & perfect spacing) */
    .bottom-container {
      position: absolute;
      bottom: 105px; /* Moderately lowered to free up upper card space while remaining easy to use */
      left: 32px;
      right: 32px;
      height: 196px; 
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
      gap: 16px;
      z-index: 50;
    }

    /* Fixed Height Typing Container */
    .interactive-panel {
      width: 100%;
      height: 110px; /* Locked panel height */
      background-color: #000000;
      border: 1px solid #161616;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Bracket Text Display with Thin Blinking Cursor */
    .bracket-display {
      font-family: 'Space Mono', monospace;
      font-size: 16px; /* Scaled up for high legibility */
      letter-spacing: 1.5px;
      color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .bracket-display.active {
      color: #FFFFFF;
    }

    /* Native embedded text field to allow full-line cursor editing */
    .real-embedded-input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      letter-spacing: 1.5px;
      text-align: center;
      width: 280px;
      caret-color: #FFFFFF; 
    }

    .real-embedded-input::placeholder {
      color: #333333;
    }

    /* NEXT / VERIFY ACTION BUTTON */
    .action-button {
      width: 100%;
      height: 52px;
      background-color: #FFFFFF;
      border: 1px solid #FFFFFF;
      color: #000000;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .action-button:hover {
      background-color: #000000;
      color: #FFFFFF;
    }

    .action-button:active {
      background-color: #111111;
      color: #FFFFFF;
    }

    .telegram-icon {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Vector Clipboard Copy Icon styling */
    .copy-icon {
      width: 13px;
      height: 13px;
      fill: #666666;
      cursor: pointer;
      margin-left: 8px;
      display: inline-block;
      vertical-align: middle;
      transition: fill 0.15s;
    }

    .copy-icon:hover {
      fill: #FFFFFF;
    }

    /* Back Link */
    .back-link {
      align-self: flex-start;
      background: none;
      border: none;
      color: #444444;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 4px;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #FFFFFF;
    }

    /* Game ID Display */
    .id-display {
      font-size: 18px;
      letter-spacing: 4px;
      color: #FFFFFF;
      font-weight: bold;
      font-family: 'Space Mono', monospace;
    }

    /* ==========================================================================
       9. GAMER PASS CONFIRMATION CARD (Highly Unique, Pure Solid Black Card)
       ========================================================================== */
    .confirmation-card {
      width: 100%;
      background-color: #000000;
      border: 1px solid #1E1E1E; /* Pure B&W minimalist solid border */
      /* Subtly textured coordinate dot-grid background for raw gaming schematic feel */
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 8px 8px;
      padding: 24px; /* More spacing for true premium feel */
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Floating dashed inner blueprint line offset by exactly 6px */
    .confirmation-card::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 2;
    }

    /* Slow vertical cyber scanning bar */
    .confirmation-card-scanner {
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.04), transparent);
      pointer-events: none;
      z-index: 3;
      animation: vertical-scan 5s linear infinite;
    }

    @keyframes vertical-scan {
      0% { top: -40px; }
      100% { top: 100%; }
    }

    /* Premium but highly minimal card glow sweep */
    .confirmation-card-sweep-layer {
      position: absolute;
      top: 0;
      left: -150%;
      width: 120px;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.08), /* Extremely subtle gloss */
        transparent
      );
      transform: skewX(-20deg);
      pointer-events: none;
      z-index: 5;
    }

    .confirmation-card-sweep-layer.run-sweep {
      animation: sweep 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .confirmation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #161616;
      padding-bottom: 8px;
    }

    .confirmation-title {
      font-size: 12px;
      color: #FFFFFF;
    }

    .confirmation-badge {
      font-size: 8px;
      border: 1px solid #FFFFFF;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .confirmation-badge svg {
      width: 8px;
      height: 8px;
      fill: #FFFFFF;
    }

    .confirmation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
      z-index: 4; /* Keeps content layered perfectly above blueprint details */
    }

    .confirmation-item label {
      font-size: 10px; /* Enhanced legibility */
      color: #7A7A7A;
      display: block;
      margin-bottom: 2px;
    }

    .confirmation-item span {
      font-size: 13px; /* Enhanced legibility */
      color: #FFFFFF;
      font-family: 'Space Mono', monospace;
    }

    /* Stacked ID representation format */
    .confirmation-id-row {
      grid-column: span 2;
      border-top: 1px dashed #161616;
      padding-top: 10px;
      text-align: left;
    }

    .confirmation-id-row label {
      font-size: 10px;
      color: #7A7A7A;
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .confirmation-id-row span {
      font-size: 17px; /* Enhanced legibility */
      font-weight: 700;
      letter-spacing: 4px;
      color: #FFFFFF;
      font-family: 'Space Mono', monospace;
      display: block;
    }

    /* Typing effect container styling */
    .typing-text-message {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #888888;
      letter-spacing: 0.5px;
      text-align: left;
      line-height: 1.6;
      margin-top: 15px;
      padding: 0 4px;
    }

    /* Premium Cybernetic Motto Layout Footer */
    .motto-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .motto-container.visible {
      opacity: 1;
    }

    .motto-line {
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #161616, transparent);
    }

    .motto-text-final {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--text-active);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Toast Warn Box */
    .toast-system {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--text-active);
      border: 1px solid var(--text-active);
      color: var(--bg-dark);
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 1.5px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast-system.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN INTRO MODULE -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo brand-logo-unified">CRAZE_MODE</div>
    <div class="splash-sub">INITIALIZING SECURE SESSION...</div>
  </div>

  <div class="toast-system" id="toast">INVALID DATA</div>

  <div class="viewport">
    
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div id="stepHeader" class="title">NEW USER ACCOUNT</div>
      </div>
      <div class="header-right">
        <!-- Unified brand logo style applied -->
        <div class="logo-brand brand-logo-unified" style="font-size: 16px; letter-spacing: 3px;">CRAZE_MODE</div>
        <div class="logo-sub">SKILL-BASED_MOBILE_TOURNAMENTS</div>
      </div>
    </div>

    <!-- Thin Divider -->
    <div class="header-divider"></div>

    <!-- STATUS TRACKER - Now permanently anchored on top below headerdivider -->
    <div class="status-section">
      <div class="status-label">STATUS</div>
      <div class="status-bar">
        <div class="status-bar-fill" id="statusBarFill"></div>
      </div>
    </div>

    <!-- UPPER CARDS STACK DISPLAY -->
    <div id="topCardsContainer" class="cards-container">
      <!-- Populated dynamically -->
    </div>

    <!-- STATIONARY INTERACTIVE PANEL & ACTION BUTTON (Elevated Upwards) -->
    <div class="bottom-container">
      <div class="interactive-panel" id="interactivePanel">
        <!-- Rendered inputs dynamically with ZERO vertical layout shifts -->
      </div>
      
      <button class="action-button" id="actionButton">GET CODE</button>
      <button class="back-link" id="backButton">[ Back ]</button>
    </div>
  </div>

  <script>
    // Deployed Google Apps Script Web App URL integrated
    const API_URL = "https://script.google.com/macros/s/AKfycbwT1LJSii25JN0e_SIfnj717mjOQC4_yAlgmgp4_M2afpLfM6zHGIZ8cGaH2HldaGImBg/exec"; 
    
    let currentStep = 0;
    let audioCtx = null; // Globally managed audio state
    let activeSessionToken = ""; // Dynamic Telegram OTP session validation tracking

    const state = {
      email: "",
      emailVerified: false,
      username: "",
      ffNickname: "",
      ffUid: "",
      experienceLevel: "",
      telegramUser: "",
      telegramVerified: false,
      gameId: "CM-GEN-PENDING" // This will be overwritten with the unique ID generated by Google Sheets
    };

    // Sequential steps
    const steps = [
      {
        id: "EMAIL_INPUT",
        title: "NEW USER ACCOUNT",
        progress: 15,
        cards: [{ id: "email", label: "PLAYER_EMAIL", valKey: "email", placeholder: "XXXXXXXXXXXXXXXXXXXX" }],
        placeholder: "ENTER_EMAIL_ADDRESS",
        btnText: "GET CODE"
      },
      {
        id: "EMAIL_VERIFY",
        title: "NEW USER ACCOUNT",
        progress: 30,
        cards: [

          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("Network connection error. Server returned code " + response.status);
        }
        return response.text(); // Get raw text first to prevent JSON parse crashes on HTML error pages
      })
      .then(text => {
        try {
          return JSON.parse(text);
        } catch (err) {
          // If it's not JSON, it means Apps Script returned an HTML error/auth page
          console.error("Non-JSON raw server response:", text);
          throw new Error("Your backend Spreadsheet ID or Permissions are not configured correctly. Please check your console (F12) for details.");

      });

    // Custom Web Audio API Synthesizer (Generates structural mechanical alarm buzz)
    function playErrorBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.22);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.22);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.22);
        osc2.stop(audioCtx.currentTime + 0.22);
      } catch (err) {
        console.log("AudioContext blocked or unsupported.");
      }
    }

          i++;
          setTimeout(type, speed);

        actionButton.textContent = "VERIFYING...";

        callBackend({ action: "verifyEmailOTP", email: state.email, code: inputVal })
        .then(res => {
          card.classList.remove("verifying");
          actionButton.disabled = false;
          actionButton.textContent = "VERIFY";

          if (res.success) {
            state.emailVerified = true;
            triggerCardShineSweep("email");
            currentStep++;
            renderStep();
            triggerToast("GMAIL VERIFIED", true);
          } else {
            card.classList.add("error-state");
            playErrorBeep();
            triggerToast(res.message || "INVALID CODE. MUST BE 6 DIGITS");
            
            const boxes = document.querySelectorAll(".code-box-display");
            boxes.forEach(box => box.classList.add("falling"));
            
            setTimeout(() => {
              card.classList.remove("error-state");
              boxes.forEach(box => {
                box.classList.remove("falling", "active");
                box.querySelector("span").textContent = "";
              });
              document.getElementById("panelInput").value = "";
              document.getElementById("bracketDisplay").classList.remove("active");
            }, 1200);
          }
        })
        .catch(err => {
          card.classList.remove("verifying");
          actionButton.disabled = false;
          actionButton.textContent = "VERIFY";
          triggerToast(err.message || "CONNECTION ERROR");
        });

      } else if (step.id === "NAME_INPUT") {
        if (!state.username.trim()) {
          triggerToast("USER NAME CANNOT BE EMPTY");
          return;
        }
        updateTopCard("name", state.username);
        triggerCardShineSweep("name");
        currentStep++;
        renderStep();

      } else if (step.id === "FF_NICK_INPUT") {
        if (!state.ffNickname.trim()) {
          triggerToast("NICKNAME CANNOT BE EMPTY");
          return;
        }
        updateTopCard("ff_nick", state.ffNickname);
        triggerCardShineSweep("ff_nick");
        currentStep++;
        renderStep();

      } else if (step.id === "FF_UID_INPUT") {
        if (!state.ffUid.trim()) {
          triggerToast("UID CANNOT BE EMPTY");
          return;
        }
        updateTopCard("ff_uid", state.ffUid);
        triggerCardShineSweep("ff_uid");
        currentStep++;
        renderStep();

      } else if (step.id === "TELEGRAM_INPUT") {
        const tgPattern = /^@[a-zA-Z0-9_]{5,32}$/;
        if (!tgPattern.test(state.telegramUser)) {
          triggerToast("INVALID TG USERNAME");
          return;
        }

        actionButton.disabled = true;
        actionButton.textContent = "GENERATING...";

        // Web App Telegram OTP Session initiation call
        callBackend({ action: "requestTelegramOTP", telegramUser: state.telegramUser })
        .then(res => {
          actionButton.disabled = false;
          actionButton.textContent = "GET CODE";

          if (res.success) {
            activeSessionToken = res.sessionToken;
            triggerCardShineSweep("tg");
            currentStep++;
            renderStep();
            
            // Redirect the user to deep-linked Telegram bot to retrieve secure code
            triggerToast("REDIRECTING TO BOT...", true);
            setTimeout(() => {
              window.open(res.botLink, "_blank");
            }, 800);
          } else {
            triggerToast(res.message || "TELEGRAM INITIATION FAILED");
          }
        })
        .catch(err => {
          actionButton.disabled = false;
          actionButton.textContent = "GET CODE";
          triggerToast("CONNECTION ERROR");
        });

      } else if (step.id === "TELEGRAM_VERIFY") {
        const inputVal = document.getElementById("panelInput").value;
        const card = document.getElementById("card-tg_code");
        
        if (!inputVal.trim() || inputVal.length !== 6) {
          card.classList.add("error-state");
          playErrorBeep();
          triggerToast("INVALID CODE. MUST BE 6 DIGITS");
          
          const boxes = document.querySelectorAll(".code-box-display");
          boxes.forEach(box => box.classList.add("falling"));
          
          setTimeout(() => {
            card.classList.remove("error-state");
            boxes.forEach(box => {
              box.classList.remove("falling", "active");
              box.querySelector("span").textContent = "";
            });
            document.getElementById("panelInput").value = "";
            document.getElementById("bracketDisplay").classList.remove("active");
          }, 1200);
          return;
        }

        card.classList.add("verifying");
        actionButton.disabled = true;
        actionButton.textContent = "VERIFYING...";

        // Real Telegram code validation fetch
        callBackend({ action: "verifyTelegramOTP", sessionToken: activeSessionToken, code: inputVal })
        .then(res => {
          card.classList.remove("verifying");
          actionButton.disabled = false;
          actionButton.textContent = "VERIFY";

          if (res.success) {
            state.telegramVerified = true;
            triggerCardShineSweep("tg");
            currentStep++;
            renderStep();
            triggerToast("TELEGRAM VERIFIED", true);
          } else {
            card.classList.add("error-state");
            playErrorBeep();
            triggerToast(res.message || "INVALID CODE. MUST BE 6 DIGITS");
            
            const boxes = document.querySelectorAll(".code-box-display");
            boxes.forEach(box => box.classList.add("falling"));
            
            setTimeout(() => {
              card.classList.remove("error-state");
              boxes.forEach(box => {
                box.classList.remove("falling", "active");
                box.querySelector("span").textContent = "";
              });
              document.getElementById("panelInput").value = "";
              document.getElementById("bracketDisplay").classList.remove("active");
            }, 1200);
          }
        })
        .catch(err => {
          card.classList.remove("verifying");
          actionButton.disabled = false;
          actionButton.textContent = "VERIFY";
          triggerToast("CONNECTION ERROR");
        });

      } else if (step.id === "UNLOCK_PROMPT") {
        actionButton.disabled = true;
        actionButton.textContent = "REGISTERING...";

        // Finalize Sheet Database Registration
        callBackend({
          action: "finalizeRegistration",
          email: state.email,
          username: state.username,
          ffNickname: state.ffNickname,
          ffUid: state.ffUid,
          experienceLevel: state.experienceLevel,
          telegramUser: state.telegramUser
        })
        .then(res => {
          actionButton.disabled = false;
          actionButton.textContent = "ACTIVATE ID";

          if (res.success) {
            state.gameId = res.gameId; // Record the server-generated highly unique ID
            currentStep++;
            renderStep();
            
            const display = document.getElementById("idRevealDisplay");
            scrambleReveal(display, state.gameId);
          } else {
            triggerToast(res.message || "REGISTRATION PROCESS FAILED");
          }
        })
        .catch(err => {
          actionButton.disabled = false;
          actionButton.textContent = "ACTIVATE ID";
          triggerToast("CONNECTION ERROR");
        });

      } else if (step.id === "FINAL_PASS") {
        // Trigger haptic vibration feedback as requested
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]); // Short double-pulse haptic feedback [3]
        }

        actionButton.disabled = true;
        actionButton.textContent = "CONNECTING...";

        // Record participant interest emoji "☑" inside target "FINAL REVIEW" column on sheet
        callBackend({ action: "finalizeReview", gameId: state.gameId })
        .then(res => {
          actionButton.disabled = false;
          actionButton.textContent = "ENTER ARENA";
          
          triggerToast("REDIRECTING...", true);
          setTimeout(() => {
            // Opens secure invitation link to Private Telegram Channel to Request Join
            window.location.href = "https://t.me/+Ah8ZbN2eKKAzZWJl"; // Direct redirect to prevent browser popup block [3]
          }, 600);
        })
        .catch(err => {
          actionButton.disabled = false;
          actionButton.textContent = "ENTER ARENA";
          // Redirect anyway to prevent bottleneck, write update asynchronously
          window.location.href = "https://t.me/+Ah8ZbN2eKKAzZWJl"; // Direct redirect [3]
        });
      }
    };

    backButton.onclick = () => {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    };

    // Minimal Monochrome Scramble Transition settling on bold format: CM-123-ABC on top card
    function scrambleReveal(element, targetString) {
      const bank = "0123456789";
      const charBank = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let frame = 0;
      const totalFrames = 20;

      const interval = setInterval(() => {
        let displayStr = "";
        for (let i = 0; i < targetString.length; i++) {
          if (targetString[i] === '-') {
            displayStr += '-';
          } else if (frame > i * 2.5) {
            displayStr += targetString[i];
          } else {
            // Numbers for 123 section, characters for ABC section
            if (i >= 3 && i <= 5) {
              displayStr += bank[Math.floor(Math.random() * bank.length)];
            } else {
              displayStr += charBank[Math.floor(Math.random() * charBank.length)];
            }
          }
        }
        element.style.fontWeight = "700";
        element.style.letterSpacing = "6px"; // Mild more letter spacing applied
        element.textContent = displayStr;
        frame++;

        if (frame > totalFrames) {
          clearInterval(interval);
          element.textContent = targetString;
          
          // Render beautiful typing congrats message inside viewport below card stack
          setTimeout(() => {
            // Create target message div inside topCardsContainer directly below resolved ID card
            const msgDiv = document.createElement("div");
            msgDiv.className = "typing-text-message";
            msgDiv.id = "congratsText";
            topCardsContainer.appendChild(msgDiv);

            const congratsMsg = "Congratulations! Your Craze Mode ID is active.";
            
            runTypewriterMessage(msgDiv, congratsMsg, 40, () => {
              // Once typing concludes, display "VIEW PASS" button cleanly at bottom
              actionButton.style.visibility = "visible";
              actionButton.textContent = "VIEW PASS";
              
              actionButton.onclick = () => {
                currentStep = 10; // Transitions to final Pass screen
                renderStep();
              };
            });
          }, 800);
        }
      }, 55);
    }

    // Orchestrates the beautiful typewriter pass text reveal sequencially
    function triggerSequentialPassReveal() {
      const passCard = document.getElementById("finalPassCard");
      const brand = document.getElementById("finalPassBrand");
      const badge = document.getElementById("finalPassBadge");
      
      const lblGamer = document.getElementById("lblPassGamer");
      const valGamer = document.getElementById("passGamerName");
      
      const lblNick = document.getElementById("lblPassNick");
      const valNick = document.getElementById("passFFNick");
      
      const lblId = document.getElementById("lblPassId");
      const valId = document.getElementById("passCrazeId");

      const motto = document.getElementById("mottoText");
      const sweepLayer = document.getElementById("finalPassSweep");

      // Keep card empty and run mild shine sweep
      lblGamer.style.visibility = "hidden";
      lblNick.style.visibility = "hidden";
      lblId.style.visibility = "hidden";
      
      passCard.className = "confirmation-card";
      
      setTimeout(() => {
        // Step 1: Type out brand name CRAZE_MODE
        runTypewriterMessage(brand, "CRAZE_MODE", 35, () => {
          
          // Step 2: Smoothly fade in top right Shield badge
          badge.style.visibility = "visible";
          badge.style.opacity = "0";
          badge.style.transition = "opacity 0.4s ease";
          void badge.offsetWidth;
          badge.style.opacity = "1";
          
          setTimeout(() => {
            // Step 3: Type out labels and Gamer name
            lblGamer.style.visibility = "visible";
            runTypewriterMessage(valGamer, state.username, 35, () => {
              
              setTimeout(() => {
                // Step 4: Type out labels and Nickname
                lblNick.style.visibility = "visible";
                runTypewriterMessage(valNick, state.ffNickname, 35, () => {
                  
                  setTimeout(() => {
                    // Step 5: Type out labels and bold white ID
                    lblId.style.visibility = "visible";
                    // Appends minimal custom copy-clip vector icon right next to the ID block
                    valId.innerHTML = `${state.gameId} ${copySVG}`;
                    runTypewriterMessage(valId, state.gameId, 35, () => {
                      valId.innerHTML = `${state.gameId} ${copySVG}`;
                      
                      // Final Step: Trigger mild diagonal shine sweep ONCE at the end!
                      sweepLayer.classList.add("run-sweep");
                      
                      setTimeout(() => {
                        // Softly fade in the High-Impact Closing Motto
                        motto.classList.add("visible");

                        actionButton.style.visibility = "visible";
                        actionButton.textContent = "ENTER ARENA";
                      }, 400);
                    });
                  }, 250);
                });
              }, 250);
            });
          }, 350);
        });
      }, 600);
    }
