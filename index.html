<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Tournament Entry</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.8);
            --accent: #00ff88; /* Neon Green */
            --accent-glow: rgba(0, 255, 136, 0.3);
            --text-main: #ffffff;
            --text-dim: #888888;
            --error: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling during flow */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Animated Particles */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .dot {
            width: 30px; height: 3px;
            background: #222;
            transition: 0.5s;
        }

        .dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* Form Steps */
        .step {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .step.active { display: flex; }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 15px;
            color: white;
            font-size: 1rem;
            outline: none;
            border-radius: 4px;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        .checkbox-container input { accent-color: var(--accent); }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            background: var(--accent);
            color: black;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        button.secondary {
            background: transparent;
            border: 1px solid #333;
            color: white;
        }

        /* Success/Dialog Overlay */
        #dialog-overlay {
            position: fixed;
            top:0; left:0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        .dialog-card {
            background: #111;
            padding: 40px;
            border: 1px solid var(--accent);
            border-radius: 10px;
            max-width: 400px;
            position: relative;
        }

        .game-icon-anim {
            width: 80px; height: 80px;
            margin: 0 auto 20px;
            border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .game-id-text {
            font-family: 'Orbitron';
            font-size: 1.5rem;
            color: var(--accent);
            margin: 10px 0;
        }

        .telegram-btn {
            display: inline-block;
            margin-top: 20px;
            background: #24A1DE;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="header">
        <h1>CRAZE MODE</h1>
        <p style="color: var(--accent); font-size: 0.7rem; letter-spacing: 2px;">SKILL BASED COMMUNITY</p>
        <div class="step-indicator">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <form id="registrationForm">
        <!-- STEP 1: CONTACT -->
        <div class="step active" id="step1">
            <div class="input-group">
                <label>Gmail / Email</label>
                <input type="email" name="email" placeholder="player@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile" placeholder="+91 00000 00000" required>
            </div>
            <div class="btn-row">
                <button type="button" onclick="nextStep(2)">Next Level</button>
            </div>
        </div>

        <!-- STEP 2: IDENTITY -->
        <div class="step" id="step2">
            <div class="input-group">
                <label>Actual Name</label>
                <input type="text" name="name" placeholder="John Doe" required>
            </div>
            <div class="input-group">
                <label>In-Game Name *</label>
                <input type="text" name="ign" placeholder="Slayer_77" required>
            </div>
            <div class="input-group">
                <label>Player UID *</label>
                <input type="text" name="uid" placeholder="8 digit UID" required>
            </div>
            <div class="btn-row">
                <button type="button" class="secondary" onclick="prevStep(1)">Back</button>
                <button type="button" onclick="nextStep(3)">Continue</button>
            </div>
        </div>

        <!-- STEP 3: EXPERIENCE -->
        <div class="step" id="step3">
            <div class="input-group">
                <label>Experience (Years/Level)</label>
                <input type="text" name="experience" placeholder="e.g. 3 Years Pro">
            </div>
            <div class="input-group">
                <label>Telegram Username</label>
                <input type="text" name="telegram" placeholder="@username" required>
            </div>
            <div class="input-group">
                <label>Discord Username (Optional)</label>
                <input type="text" name="discord" placeholder="user#0000">
            </div>
            <div class="btn-row">
                <button type="button" class="secondary" onclick="prevStep(2)">Back</button>
                <button type="button" onclick="nextStep(4)">Almost There</button>
            </div>
        </div>

        <!-- STEP 4: LEGAL & SUBMIT -->
        <div class="step" id="step4">
            <label class="checkbox-container">
                <input type="checkbox" required> I accept the Terms & Conditions
            </label>
            <label class="checkbox-container">
                <input type="checkbox" required> I confirm I am 18+ years old
            </label>
            <div class="btn-row">
                <button type="button" class="secondary" onclick="prevStep(3)">Back</button>
                <button type="submit" id="submitBtn">Generate Game ID</button>
            </div>
        </div>
    </form>
</div>

<!-- INTERACTIVE DIALOGUE BOX -->
<div id="dialog-overlay">
    <div class="dialog-card">
        <div class="game-icon-anim">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2">
                <path d="M6 12L10 16L18 8"></path>
            </svg>
        </div>
        <h2 style="font-family: 'Orbitron'; margin-bottom: 10px;">IDENTITY VERIFIED</h2>
        <p style="color: #888; font-size: 0.9rem;">Your data has been synchronized with Google Cloud.</p>
        
        <div class="game-id-text" id="generatedID">CM-774291</div>
        
        <p style="font-size: 0.8rem; margin-top: 15px;">Final step: Join the official war room to finalize registration.</p>
        
        <a href="https://t.me/+3xRCpmBV3yA4NGM1" class="telegram-btn" target="_blank">
            REQUEST TO JOIN GROUP
        </a>
    </div>
</div>

<script>
    // 1. ANIMATED BACKGROUND SCRIPT
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function init() {
        for (let i = 0; i < 100; i++) particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    init(); animate();

    // 2. FORM NAVIGATION LOGIC
    let currentStep = 1;
    const dots = document.querySelectorAll('.dot');

    function nextStep(step) {
        // Validation check for current step
        const currentFields = document.querySelectorAll(`#step${currentStep} input[required]`);
        let valid = true;
        currentFields.forEach(f => { if(!f.value || !f.checkValidity()) { valid = false; f.style.borderColor = 'red'; } else { f.style.borderColor = '#222'; } });
        
        if(!valid) return;

        gsap.to(`#step${currentStep}`, { opacity: 0, x: -20, duration: 0.3, onComplete: () => {
            document.querySelector(`#step${currentStep}`).classList.remove('active');
            currentStep = step;
            document.querySelector(`#step${currentStep}`).classList.add('active');
            gsap.fromTo(`#step${currentStep}`, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 });
            updateDots();
        }});
    }

    function prevStep(step) {
        gsap.to(`#step${currentStep}`, { opacity: 0, x: 20, duration: 0.3, onComplete: () => {
            document.querySelector(`#step${currentStep}`).classList.remove('active');
            currentStep = step;
            document.querySelector(`#step${currentStep}`).classList.add('active');
            gsap.fromTo(`#step${currentStep}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 });
            updateDots();
        }});
    }

    function updateDots() {
        dots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx < currentStep);
        });
    }

    // 3. GOOGLE SHEETS SUBMISSION
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw8PShIc7M9dc1eahMGCuOn4WU68hbPWGCznJCmKIZrfkUbrXoNjA7vemLaHpSkouUW/exec';
    const form = document.getElementById('registrationForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.innerHTML = "SYNCING...";
        submitBtn.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                showSuccess();
            })
            .catch(error => {
                alert('Submission Error. Please try again.');
                submitBtn.innerHTML = "Generate Game ID";
                submitBtn.disabled = false;
            });
    });

    function showSuccess() {
        // Generate a random Game ID for effect
        const randomID = "CM-" + Math.floor(100000 + Math.random() * 900000);
        document.getElementById('generatedID').innerText = randomID;

        const overlay = document.getElementById('dialog-overlay');
        overlay.style.display = 'flex';
        gsap.from('.dialog-card', { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(1.7)" });
    }
</script>

</body>
</html>
