<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Sovereign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --raj: 'Rajdhani', sans-serif; }
        body { background: #000; color: #fff; font-family: var(--raj); margin: 0; overflow: hidden; height: 100vh; }

        /* LAMINAR FLOW BACKGROUND */
        .flow-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }
        .line { position: absolute; background: linear-gradient(90deg, transparent, #fff, transparent); height: 1px; width: 100%; animation: flow 8s linear infinite; }

        @keyframes flow {
            0% { transform: translateY(-100vh) scaleX(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh) scaleX(1); opacity: 0; }
        }

        /* BRAND INTRO */
        #intro { position: fixed; inset: 0; background: #000; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1); }
        .brand-name { 
            font-size: 3rem; font-weight: 700; letter-spacing: 1.5rem; text-transform: uppercase;
            background: linear-gradient(120deg, #333 30%, #fff 50%, #333 70%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: specular 4s linear infinite; transition: letter-spacing 2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes specular { to { background-position: 200% center; } }
        .brand-sub { font-weight: 300; letter-spacing: 0.3rem; color: #666; margin-top: 10px; opacity: 0; transform: translateY(10px); }
        .enter-btn { margin-top: 40px; border: 1px solid #333; padding: 12px 40px; border-radius: 2px; font-size: 0.8rem; letter-spacing: 0.2rem; opacity: 0; cursor: pointer; transition: 0.4s; }
        .enter-btn:hover { background: #fff; color: #000; }

        /* FORM STYLING */
        .form-section { display: none; opacity: 0; transform: scale(0.98); transition: 0.8s cubic-bezier(0.2, 1, 0.2, 1); max-width: 350px; width: 90%; margin: 150px auto; }
        .form-section.active { display: block; opacity: 1; transform: scale(1); }
        input { background: transparent; border: none; border-bottom: 1px solid #222; width: 100%; padding: 15px 0; color: #fff; outline: none; font-size: 1.1rem; margin-bottom: 30px; transition: 0.4s; }
        input:focus { border-bottom-color: #fff; }
        .btn-main { background: #fff; color: #000; width: 100%; padding: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; }
        
        /* TERMINAL ID BOX */
        .terminal-box { background: #080808; border: 1px solid #1a1a1a; padding: 25px; border-radius: 4px; position: relative; cursor: pointer; }
        .terminal-text { font-family: monospace; font-size: 1.5rem; letter-spacing: 2px; color: #fff; }
        .tiny-tag { font-size: 9px; color: #444; text-transform: uppercase; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="flow-bg" id="flow"></div>

    <!-- INTRO -->
    <div id="intro">
        <h1 class="brand-name" id="bName">CRAZE MODE</h1>
        <p class="brand-sub" id="bSub">Where Skill Takes the Spotlight</p>
        <button class="enter-btn" id="eBtn" onclick="startApp()">ENTER ARENA</button>
    </div>

    <!-- MAIN FORM -->
    <div id="app" class="flex flex-col items-center">
        <!-- Step 1: Gmail -->
        <div id="step1" class="form-section active">
            <h2 class="text-xs uppercase tracking-[0.5rem] mb-10 text-gray-500">Authentication</h2>
            <input type="email" id="email" placeholder="GMAIL ADDRESS">
            <button onclick="sendGmailOTP()" id="gBtn" class="btn-main">Verify</button>
            <div id="gmailVerifyBox" class="hidden mt-8">
                <input type="number" id="emailOtp" placeholder="6-DIGIT OTP">
                <button onclick="confirmGmailOTP()" class="btn-main">Continue</button>
            </div>
            <p class="text-[10px] text-gray-700 mt-10 tracking-widest">NEW USER? VERIFICATION IS MANDATORY.</p>
        </div>

        <!-- Step 2: Info -->
        <div id="step2" class="form-section">
            <h2 class="text-xs uppercase tracking-[0.5rem] mb-10 text-gray-500">Identity</h2>
            <input type="text" id="name" placeholder="ACTUAL NAME">
            <input type="text" id="ffNick" placeholder="FF NICKNAME">
            <input type="text" id="ffUid" placeholder="FF UID">
            <button onclick="move(3)" class="btn-main">Next</button>
        </div>

        <!-- Step 3: Telegram -->
        <div id="step3" class="form-section">
            <h2 class="text-xs uppercase tracking-[0.5rem] mb-10 text-gray-500">Security</h2>
            <input type="text" id="tgUser" placeholder="TELEGRAM USERNAME">
            <a href="https://t.me/CMAccessBot" target="_blank" class="btn-main block text-center mb-6">Get Code</a>
            <input type="number" id="tgCode" placeholder="ENTER CODE">
            <button onclick="verifyTg()" id="tBtn" class="btn-main">Verify Account</button>
        </div>

        <!-- Step 4: Game ID -->
        <div id="step4" class="form-section text-center">
            <p class="text-gray-500 text-[11px] mb-10 leading-relaxed uppercase tracking-widest">Decrypting Personal Game Identifier...</p>
            <div class="terminal-box" id="idBox" onclick="copyId()">
                <div class="terminal-text" id="decryption">********</div>
                <span class="tiny-tag">Click to copy • Keep it safe</span>
            </div>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="btn-main block mt-10" style="background:#229ED9; color:#fff;">Join Private Arena</a>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzMHjL1PicDlmO5Eo0mg4tGAdouQvHUSk_zTCfm-kvvTjozYFbWjjUPL6ucyqrRD6Lx/exec";

        // Background Laminar Flow
        const flow = document.getElementById('flow');
        for(let i=0; i<15; i++){
            let line = document.createElement('div');
            line.className = 'line';
            line.style.left = Math.random() * 100 + '%';
            line.style.animationDelay = Math.random() * 5 + 's';
            flow.appendChild(line);
        }

        // Intro Sequence
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('bName').style.letterSpacing = "0.5rem";
                setTimeout(() => {
                    document.getElementById('bSub').style.opacity = "1";
                    document.getElementById('bSub').style.transform = "translateY(0)";
                    setTimeout(() => {
                        document.getElementById('eBtn').style.opacity = "1";
                    }, 1000);
                }, 1000);
            }, 500);
        };

        function startApp() {
            document.getElementById('intro').style.transform = "translateY(-100vh)";
        }

        function move(s) {
            document.querySelectorAll('.form-section').forEach(x => x.classList.remove('active'));
            document.getElementById('step'+s).classList.add('active');
            if(s === 4) startDecryption();
        }

        async function sendGmailOTP() {
            const e = document.getElementById('email').value;
            document.getElementById('gBtn').innerText = "SENDING...";
            await fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:e})});
            document.getElementById('gBtn').style.display='none';
            document.getElementById('gmailVerifyBox').classList.remove('hidden');
        }

        async function confirmGmailOTP() {
            const e = document.getElementById('email').value;
            const otp = document.getElementById('emailOtp').value;
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:e, otp:otp})});
            let res = await r.json();
            if(res.success) move(2); else alert("Invalid OTP");
        }

        async function verifyTg() {
            const u = document.getElementById('tgUser').value;
            const c = document.getElementById('tgCode').value;
            document.getElementById('tBtn').innerText = "AUTHENTICATING...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:u, code:c})});
            let res = await r.json();
            if(res.success) move(4); else alert("Code expired or invalid");
        }

        let finalGameId = "";
        function startDecryption() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const el = document.getElementById('decryption');
            finalGameId = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            
            let iteration = 0;
            let interval = setInterval(() => {
                el.innerText = finalGameId.split("").map((letter, index) => {
                    if(index < iteration) return finalGameId[index];
                    return chars[Math.floor(Math.random() * 36)];
                }).join("");
                
                if(iteration >= finalGameId.length) clearInterval(interval);
                iteration += 1/3;
            }, 50);
        }

        function copyId() {
            navigator.clipboard.writeText(finalGameId);
            alert("GAME ID COPIED");
        }

        function finalSubmit() {
            const f = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                ffNick: document.getElementById('ffNick').value,
                ffUid: document.getElementById('ffUid').value,
                tgUser: document.getElementById('tgUser').value,
                gameId: finalGameId
            };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
