<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | The Skill Standard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --card: #0A0A0A;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #FFFFFF;
            --text-sec: #888888;
            --tg-blue: #0088cc;
            --copy-success: #34C759;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Smooth Scroll reveal animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Logo Area */
        .brand-header {
            text-align: center;
            margin-bottom: 60px;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            z-index: 100;
        }
        .brand-logo {
            height: 45px; /* Adjust height based on your PNG */
            width: auto;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 11px;
            letter-spacing: 5px;
            color: var(--text-sec);
            text-transform: uppercase;
        }

        /* Form Styling */
        .section-header {
            font-size: 12px;
            color: var(--text-sec);
            margin-bottom: 24px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .input-group { margin-bottom: 24px; position: relative; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #E5E5E5; }

        input, select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 15px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            border-radius: 10px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            border-color: rgba(255,255,255,0.3);
            background: #111;
            outline: none;
        }

        /* Mobile Prefix */
        .mobile-wrap { display: flex; }
        .prefix {
            background: #111;
            padding: 15px;
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: var(--text-sec);
        }
        .mobile-input { border-radius: 0 10px 10px 0; }

        /* Telegram Icon Button */
        .tg-link {
            position: absolute;
            right: 12px;
            top: 38px;
            color: var(--tg-blue);
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        /* Checkbox fix */
        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 15px;
            cursor: pointer;
            padding: 5px 0;
        }
        .check-item input { width: 20px; height: 20px; margin: 0; accent-color: white; cursor: pointer; }
        .check-item span { font-size: 14px; color: var(--text-sec); line-height: 1.4; }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { background: #333; color: #666; }

        /* SUCCESS MODAL */
        #modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            width: 90%;
            max-width: 360px;
            text-align: center;
            padding: 30px;
        }

        .summary-box { text-align: left; margin: 20px 0; font-size: 14px; }
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #111; }
        .summary-row span { color: var(--text-sec); }

        /* ID Styles */
        .copy-id-btn {
            background: #111;
            border: 1px solid #222;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin: 20px 0 5px 0;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .copy-id-btn:hover { background: #161616; border-color: #444; }
        .warning-text { font-size: 11px; color: #FF3B30; margin-bottom: 30px; display: block; }
        
        .join-btn {
            display: block;
            background: var(--tg-blue);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
        }

        /* Scroll Progress Bar */
        #scroll-bar {
            position: fixed;
            top: 0; left: 0; width: 0%;
            height: 3px; background: white;
            z-index: 1001; transition: width 0.1s;
        }

    </style>
</head>
<body>

    <div id="scroll-bar"></div>

    <div class="brand-header">
        <!-- REPLACE 'logo.png' WITH YOUR ACTUAL FILENAME -->
        <img src="https://raw.githubusercontent.com/crazemodeindia/registration/main/logo.png" class="brand-logo" alt="CRAZE MODE">
        <div class="tagline">ELITE COMPETITION</div>
    </div>

    <div class="container">
        <form id="crazeForm">
            
            <div class="reveal">
                <div class="section-header">01 DATA LINK</div>
                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" name="email" id="email" required placeholder="operator@craze.com">
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <div class="mobile-wrap">
                        <div class="prefix">+91</div>
                        <input type="text" name="phone" id="phone" class="mobile-input" maxlength="10" required placeholder="00000 00000">
                    </div>
                </div>
            </div>

            <div class="reveal">
                <div class="section-header">02 IDENTITY</div>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="name" id="name" required placeholder="Legal Identity">
                </div>
                <div class="input-group">
                    <label>In-Game Name</label>
                    <input type="text" name="ign" id="ign" required placeholder="Gaming ID">
                </div>
                <div class="input-group">
                    <label>Game UID</label>
                    <input type="text" name="uid" id="uid" required placeholder="Unique Player Code">
                </div>
                <div class="input-group">
                    <label>Skill Tier</label>
                    <select name="exp" id="exp" required>
                        <option value="" disabled selected>Select Tier</option>
                        <option value="Recruit">Recruit (Beginner)</option>
                        <option value="Elite">Elite (Intermediate)</option>
                        <option value="Heroic">Heroic (Expert)</option>
                        <option value="Legend">Legend (Pro)</option>
                        <option value="Immortal">Immortal (Top Tier)</option>
                    </select>
                </div>
            </div>

            <div class="reveal">
                <div class="section-header">03 CONNECT</div>
                <div class="input-group">
                    <label>Telegram Username</label>
                    <input type="text" name="telegram" id="telegram" required placeholder="@username">
                    <div class="tg-link" onclick="window.open('https://t.me/settings', '_blank')">🔗</div>
                </div>
                <div class="input-group">
                    <label>Discord (Optional)</label>
                    <input type="text" name="discord" id="discord" placeholder="user#0000">
                </div>
            </div>

            <div class="reveal">
                <label class="check-item">
                    <input type="checkbox" required>
                    <span>I confirm my data is accurate and agree to tournament protocols.</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" required>
                    <span>I verify that I am over 18 years of age.</span>
                </label>

                <button type="submit" class="btn-main" id="submitBtn">SYNCHRONIZE ACCOUNT</button>
            </div>

        </form>
    </div>

    <!-- MODAL -->
    <div id="modal">
        <div class="modal-content">
            <h1 style="font-size: 24px; margin-bottom: 10px;">AUTHORIZED</h1>
            <p style="color: var(--text-sec); font-size: 14px;">Your combat ID has been generated.</p>
            
            <div class="summary-box" id="summary"></div>

            <button class="copy-id-btn" id="copyID" title="Click to copy">GENERATING...</button>
            <span class="warning-text">⚠️ DO NOT SHARE THIS ID WITH ANYONE</span>

            <a href="https://t.me/+ulWO6jBK3uRiNjE1" class="join-btn">REQUEST GROUP ACCESS</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('crazeForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwp0FzRgCLaPMKZIyAwb2Cby_5b7GotW95wXyUBnhmG7hIkh14kP7X5bX7Cinwiep7g/exec';

        // 1. Scroll Reveal Logic
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(r => {
                let windowHeight = window.innerHeight;
                let revealTop = r.getBoundingClientRect().top;
                if(revealTop < windowHeight - 100) r.classList.add('active');
            });
            // Top progress bar
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("scroll-bar").style.width = scrolled + "%";
        });
        window.dispatchEvent(new Event('scroll')); // Initial trigger

        // 2. Mobile validation
        document.getElementById('phone').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // 3. Branded ID: CM-XXXX-0000
        function generateID() {
            const pool = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let p1 = "";
            for(let i=0; i<4; i++) p1 += pool[Math.floor(Math.random()*pool.length)];
            let p2 = Math.floor(1000 + Math.random() * 9000);
            return `CM-${p1}-${p2}`;
        }

        // 4. Form Submit
        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            if(document.getElementById('phone').value.length !== 10) return alert("Enter 10 digits.");

            btn.disabled = true;
            btn.innerText = "AUTHENTICATING...";

            const id = generateID();
            const fd = new FormData(form);
            fd.append('Generated_ID', id);

            fetch(scriptURL, { method: 'POST', body: fd})
            .then(res => res.text())
            .then(msg => {
                if(msg === "SUCCESS") {
                    showFinal(id);
                } else {
                    alert(msg);
                    btn.disabled = false; btn.innerText = "SYNCHRONIZE ACCOUNT";
                }
            });
        });

        function showFinal(id) {
            document.getElementById('modal').style.display = 'flex';
            const btnID = document.getElementById('copyID');
            btnID.innerText = id;

            // Copy to clipboard logic
            btnID.onclick = () => {
                navigator.clipboard.writeText(id);
                btnID.style.color = 'var(--copy-success)';
                btnID.innerText = "COPIED!";
                setTimeout(() => {
                    btnID.innerText = id;
                    btnID.style.color = 'white';
                }, 2000);
            };

            const data = `
                <div class="summary-row"><span>ID Name</span> <b>${document.getElementById('name').value}</b></div>
                <div class="summary-row"><span>IGN</span> <b>${document.getElementById('ign').value}</b></div>
                <div class="summary-row"><span>UID</span> <b>${document.getElementById('uid').value}</b></div>
            `;
            document.getElementById('summary').innerHTML = data;
        }
    </script>
</body>
</html>
