<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Professional Entry</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --white: #ffffff;
            --tg-blue: #24A1DE;
            --success: #00ff88;
            --error: #ff4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. INTRO */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: 20px;
            text-transform: uppercase;
            opacity: 0;
        }

        /* 2. LAYOUT */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: none;
            opacity: 0;
        }

        .step { display: none; }
        .step.active { display: block; }

        h2 { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; }

        .input-group { margin-bottom: 35px; }
        label { display: block; font-size: 10px; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;}

        .input-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: white; }

        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 18px;
            outline: none;
        }

        /* FIX: Dropdown visibility */
        select {
            width: 100%;
            background: #0a0a0a; /* Dark background */
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            color: white; /* White text */
            font-size: 16px;
            outline: none;
            cursor: pointer;
            appearance: none;
        }
        select option {
            background: #111;
            color: white;
            padding: 10px;
        }

        /* 3. BUTTONS */
        .nav-btn {
            width: 100%;
            padding: 20px;
            background: white;
            color: black;
            border: none;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:disabled { background: #111; color: #333; cursor: not-allowed; }

        .tg-verify-btn {
            background: var(--tg-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* 4. SHUFFLER */
        #shuffler-screen { display: none; text-align: center; width: 100%; }
        .shuffle-text {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .tg-link {
            display: inline-block;
            margin-top: 30px;
            background: var(--tg-blue);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            opacity: 0;
            transform: translateY(20px);
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="brand-text">CRAZE MODE</div>
    </div>

    <div class="app-container">
        <form id="crazeForm">
            <!-- Hidden inputs to ensure data matches your script -->
            <input type="hidden" name="GameID" id="hidden_id">

            <!-- STEP 1: EMAIL -->
            <div class="step active" id="s1">
                <h2>01 Authenticate</h2>
                <div class="input-group">
                    <label>Google / Email</label>
                    <div class="input-wrapper">
                        <input type="email" name="Email" placeholder="your@gmail.com" required>
                    </div>
                </div>
                <button type="button" class="nav-btn" onclick="go(1, 2)">Next Step</button>
            </div>

            <!-- STEP 2: MOBILE (Numeric Fix) -->
            <div class="step" id="s2">
                <h2>02 Contact</h2>
                <div class="input-group">
                    <label>Mobile Number (10 Digits)</label>
                    <div class="input-wrapper">
                        <span style="color:#444; padding-right:10px;">+91</span>
                        <input type="number" name="Mobile" id="phoneInp" placeholder="Enter 10 digits" oninput="validatePhone(this)">
                    </div>
                </div>
                <button type="button" class="nav-btn" id="btn2" disabled onclick="go(2, 3)">Continue</button>
            </div>

            <!-- STEP 3: GAME PROFILE -->
            <div class="step" id="s3">
                <h2>03 Identity</h2>
                <div class="input-group">
                    <label>In-Game Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="IGN" placeholder="Enter in-game username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Player UID</label>
                    <div class="input-wrapper">
                        <input type="text" name="UID" placeholder="Enter UID" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Skill Level</label>
                    <select name="Experience">
                        <option value="" disabled selected>Select Experience</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                        <option value="Elite">Elite / Pro</option>
                    </select>
                </div>
                <button type="button" class="nav-btn" onclick="go(3, 4)">Continue</button>
            </div>

            <!-- STEP 4: REAL TELEGRAM VERIFICATION -->
            <div class="step" id="s4">
                <h2>04 Verification</h2>
                <p style="font-size: 12px; color: #666; margin-bottom: 20px;">To prevent fake entries, you must verify ownership via our bot.</p>
                
                <a href="https://t.me/crazemodeverifybot" target="_blank" class="tg-verify-btn">1. OPEN VERIFICATION BOT</a>
                
                <div class="input-group">
                    <label>Enter Telegram Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="Telegram" id="tgUser" placeholder="@username">
                    </div>
                </div>

                <div class="input-group">
                    <label>Enter 6-Digit Verification Code from Bot</label>
                    <div class="input-wrapper">
                        <input type="text" id="tgCode" placeholder="000 000" maxlength="6">
                    </div>
                </div>

                <button type="submit" class="nav-btn" id="submitBtn" disabled>Generate Game ID</button>
            </div>
        </form>

        <!-- STEP 5: SHUFFLER -->
        <div id="shuffler-screen">
            <div class="shuffle-text" id="idResult"></div>
            <p style="color: #444; font-size: 11px; margin-top: 40px; cursor: pointer;">DON'T SHARE THIS WITH ANYONE</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" class="tg-link" id="joinBtn">REQUEST TO JOIN GROUP</a>
        </div>
    </div>

    <script>
        // 1. INTRO
        window.onload = () => {
            gsap.timeline()
                .to(".brand-text", { opacity: 1, duration: 1, letterSpacing: "10px", ease: "power2.out" })
                .to(".brand-text", { y: -50, opacity: 0, duration: 0.6, ease: "power2.in", delay: 0.4 })
                .set("#intro-screen", { display: "none" })
                .to(".app-container", { display: "block", opacity: 1, duration: 0.5 });
        };

        // 2. NAVIGATION & PHONE VALIDATION
        function go(f, t) {
            gsap.to(`#s${f}`, { opacity: 0, x: -20, duration: 0.2, onComplete: () => {
                document.getElementById(`s${f}`).classList.remove('active');
                document.getElementById(`s${t}`).classList.add('active');
                gsap.fromTo(`#s${t}`, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 });
            }});
        }

        function validatePhone(el) {
            // Remove any non-numeric characters just in case
            el.value = el.value.replace(/[^0-9]/g, '');
            if(el.value.length > 10) el.value = el.value.slice(0, 10);
            document.getElementById('btn2').disabled = (el.value.length !== 10);
        }

        // 3. TELEGRAM VERIFICATION LOGIC
        // Note: For real verification, the user enters a code given by the bot
        document.getElementById('tgCode').addEventListener('input', function() {
            const username = document.getElementById('tgUser').value;
            // Requirement: Username must exist and code must be 6 digits
            document.getElementById('submitBtn').disabled = !(username.startsWith('@') && this.value.length === 6);
        });

        // 4. DATA COLLECTION & SHUFFLER
        const G_SHEET_URL = 'https://script.google.com/macros/s/AKfycbw8PShIc7M9dc1eahMGCuOn4WU68hbPWGCznJCmKIZrfkUbrXoNjA7vemLaHpSkouUW/exec';

        document.getElementById('crazeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const finalID = generateID();
            document.getElementById('hidden_id').value = finalID;

            // Submit Data - USING A MORE ROBUST METHOD
            const formData = new FormData(this);
            fetch(G_SHEET_URL, { 
                method: 'POST', 
                body: formData,
                mode: 'no-cors' // Critical for Google Scripts
            }).then(() => console.log("Data Sent"));

            // Start UI Transition
            gsap.to("#crazeForm", { opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('crazeForm').style.display = 'none';
                document.getElementById('shuffler-screen').style.display = 'block';
                runShuffler(finalID);
            }});
        });

        function generateID() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
            const part = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            return `CM-${part()}-${part()}`;
        }

        function runShuffler(target) {
            const el = document.getElementById('idResult');
            const chars = "ABCDEFGHIJKL1234567890";
            let count = 0;
            
            const timer = setInterval(() => {
                el.innerText = target.split('').map((char, i) => {
                    if(char === '-') return '-';
                    if(count > i * 8) return target[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');

                if(count++ >= 60) {
                    clearInterval(timer);
                    el.innerText = target;
                    gsap.to("#joinBtn", { opacity: 1, y: 0, duration: 0.5, delay: 0.3 });
                }
            }, 100);
        }
    </script>
</body>
</html>
