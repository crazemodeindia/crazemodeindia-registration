<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | The Skill Standard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --card: #080808;
            --border: rgba(255, 255, 255, 0.08);
            --text-matte: #E5E5E5;
            --text-sec: #555555;
            --tg-blue: #0088cc;
            --fiery: #FF5722;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- CINEMATIC SPLASH --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s ease;
        }
        .splash-logo { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 12px; text-transform: uppercase; animation: pulse 1.5s infinite alternate; }
        .loader-wrap { width: 100px; height: 1px; background: #111; margin-top: 25px; position: relative; overflow: hidden; }
        .loader-fill { position: absolute; height: 100%; width: 0%; background: #fff; animation: fill 2s forwards ease-in-out; }

        /* --- MAIN UI --- */
        #app { opacity: 0; transition: opacity 1.2s ease; display: none; padding-bottom: 80px; }
        .brand-header { text-align: center; padding: 70px 0 30px 0; }
        .main-logo { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 8px; text-transform: uppercase; }
        .new-account-title { font-size: 10px; letter-spacing: 4px; color: var(--text-sec); text-transform: uppercase; margin-top: 10px; font-weight: 600; }
        .tagline { font-size: 11px; letter-spacing: 3px; color: var(--fiery); text-transform: uppercase; font-weight: 700; margin-top: 15px; }

        .container { max-width: 400px; margin: 0 auto; padding: 0 24px; }
        .section-label { font-size: 10px; font-weight: 700; color: #222; letter-spacing: 2px; margin: 40px 0 20px 0; display: flex; align-items: center; gap: 15px; }
        .section-label::after { content: ""; flex: 1; height: 1px; background: #0d0d0d; }

        .field { margin-bottom: 28px; position: relative; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        label { font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .get-link { font-size: 11px; color: var(--tg-blue); text-decoration: none; font-weight: 700; opacity: 0.8; transition: 0.3s; }
        .get-link:hover { opacity: 1; text-decoration: underline; }

        input:not([type="checkbox"]), select {
            width: 100%; background: var(--card); border: 1px solid var(--border);
            padding: 16px; color: var(--text-matte); font-family: 'Inter', sans-serif;
            font-size: 16px; border-radius: 14px; transition: 0.3s;
        }
        input:focus { border-color: #333; outline: none; background: #0c0c0c; }

        .mobile-container { display: flex; align-items: center; position: relative; }
        .prefix-fixed { position: absolute; left: 16px; color: #444; font-weight: 700; pointer-events: none; }
        .prefixed-input { padding-left: 50px !important; }

        /* FIERY FIELDS */
        .fiery-input { color: var(--fiery) !important; font-weight: 600; border-color: rgba(255, 87, 34, 0.1) !important; }

        /* TELEGRAM INTERACTION */
        #tg-icon-link {
            position: absolute; right: 18px; top: 41px; opacity: 0; transform: scale(0.8);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .valid-tg #tg-icon-link { opacity: 1; transform: scale(1); }

        /* CUSTOM CHECKBOXES */
        .check-group { display: flex; align-items: center; gap: 14px; margin-top: 20px; cursor: pointer; }
        .check-group input { display: none; }
        .box { width: 22px; height: 22px; border: 2px solid #222; border-radius: 7px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .check-group input:checked + .box { background: #fff; border-color: #fff; }
        .check-group input:checked + .box::after { content: "✓"; color: #000; font-weight: 900; font-size: 13px; }
        .check-group span { font-size: 13px; color: #444; transition: 0.3s; }
        .check-group input:checked ~ span { color: #888; }

        .btn-submit { width: 100%; padding: 20px; background: #fff; color: #000; border: none; border-radius: 18px; font-size: 15px; font-weight: 700; margin-top: 45px; cursor: pointer; transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        /* --- PREMIUM GLASS MODAL --- */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(35px); z-index: 10001; justify-content: center; align-items: center; padding: 20px; }
        .glass-body { 
            width: 100%; max-width: 380px; background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px; 
            padding: 40px 24px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            transform: scale(0.95); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-active .glass-body { transform: scale(1); }
        .modal-title { font-family: 'Rajdhani', sans-serif; font-size: 24px; letter-spacing: 4px; margin-bottom: 8px; font-weight: 700; }
        .summary-wrap { text-align: left; margin: 30px 0; }
        .data-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14px; }
        .data-row span { color: #555; font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .data-row b { color: var(--text-matte); font-weight: 500; }

        .game-id-badge { 
            background: rgba(255, 255, 255, 0.03); padding: 26px; border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.05); font-family: 'Rajdhani', sans-serif; 
            font-size: 28px; font-weight: 700; color: var(--fiery); margin-bottom: 30px; cursor: pointer;
            transition: 0.3s;
        }
        .game-id-badge:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--fiery); }

        /* REDIRECT SEQUENCE (APPLE STYLE) */
        #redirect-blur {
            position: fixed; inset: 0; background: rgba(0,0,0,0);
            backdrop-filter: blur(0px); z-index: 10005; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0;
        }
        .redirecting #redirect-blur { background: rgba(0,0,0,0.9); backdrop-filter: blur(40px); opacity: 1; pointer-events: all; }
        .redirect-text { font-family: 'Rajdhani', sans-serif; font-size: 14px; letter-spacing: 6px; color: #fff; text-transform: uppercase; }

        @keyframes pulse { from { opacity: 0.5; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        @keyframes fill { to { width: 100%; } }
        .reveal { opacity: 0; transform: translateY(15px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-logo">CRAZE MODE</div>
        <div class="loader-wrap"><div class="loader-fill"></div></div>
    </div>

    <div id="app">
        <div class="brand-header">
            <div class="main-logo">CRAZE MODE</div>
            <div class="new-account-title">NEW USER ACCOUNT</div>
            <div class="tagline">Skill Based Tournament</div>
        </div>

        <div class="container">
            <form id="crazeForm">
                <div class="reveal">
                    <div class="section-label">01 CONTACT</div>
                    <div class="field"><label>Email Address</label><input type="email" id="email" required placeholder="name@email.com"></div>
                    <div class="field">
                        <label>Mobile Number</label>
                        <div class="mobile-container">
                            <span class="prefix-fixed">+91</span>
                            <input type="text" id="phone" class="prefixed-input" maxlength="10" required placeholder="00000 00000">
                        </div>
                    </div>
                </div>

                <div class="reveal">
                    <div class="section-label">02 PLAYER PROFILE</div>
                    <div class="field"><label>Your Name</label><input type="text" id="name" required placeholder="Enter Legal Name"></div>
                    <div class="field"><label>In-Game Name</label><input type="text" id="ign" class="fiery-input" required placeholder="Gaming ID"></div>
                    <div class="field"><label>Game UID</label><input type="text" id="uid" class="fiery-input" required placeholder="Enter UID"></div>
                    <div class="field"><label>Skill Tier</label>
                        <select id="exp" required>
                            <option value="" disabled selected>Select Rank</option>
                            <option value="Recruit">Recruit</option><option value="Veteran">Veteran</option><option value="Heroic">Heroic</option><option value="Legend">Legend</option><option value="Immortal">Immortal</option>
                        </select>
                    </div>
                </div>

                <div class="reveal">
                    <div class="section-label">03 CONNECTIVITY</div>
                    <div class="field" id="tg-field">
                        <div class="label-row">
                            <label>Telegram Username</label>
                            <a href="https://t.me/settings" target="_blank" class="get-link">(Get)</a>
                        </div>
                        <input type="text" id="telegram" required placeholder="@username">
                        <div id="tg-icon-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0088cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/></svg>
                        </div>
                    </div>
                </div>

                <div class="reveal">
                    <label class="check-group"><input type="checkbox" required><div class="box"></div><span>Agree to Combat Protocols.</span></label>
                    <label class="check-group"><input type="checkbox" required><div class="box"></div><span>Verified 18+ Operator Age.</span></label>
                    <button type="submit" class="btn-submit" id="subBtn">CREATE IDENTITY</button>
                </div>
            </form>
        </div>
    </div>

    <!-- GLASS MODAL -->
    <div id="modal">
        <div class="glass-body">
            <h2 class="modal-title">AUTHORIZED</h2>
            <p style="font-size: 11px; color: #444; letter-spacing: 2px;">NEURAL LINK ESTABLISHED</p>
            
            <div class="summary-wrap" id="sumPreview"></div>

            <div class="game-id-badge" id="copyBtn">GENERATING...</div>
            <p style="font-size: 9px; color: #FF3B30; font-weight: 700; margin-bottom: 35px; letter-spacing: 1px;">PROPRIETARY CODE - DO NOT SHARE</p>

            <a href="#" id="finalJoin" style="display:block; background:var(--tg-blue); color:#fff; text-decoration:none; padding:22px; border-radius:20px; font-weight:700; font-size:16px;">JOIN TELEGRAM GROUP</a>
        </div>
    </div>

    <!-- REDIRECT OVERLAY -->
    <div id="redirect-blur">
        <div class="redirect-text">Establishing Secure Link...</div>
    </div>

    <script>
        const form = document.getElementById('crazeForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw8PShIc7M9dc1eahMGCuOn4WU68hbPWGCznJCmKIZrfkUbrXoNjA7vemLaHpSkouUW/exec';

        // 1. Initial Sequence
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('splash').style.display = 'none'; 
                document.getElementById('app').style.display = 'block'; 
                setTimeout(() => { document.getElementById('app').style.opacity = '1'; window.dispatchEvent(new Event('scroll')); }, 50); 
            }, 800);
        }, 2200);

        // 2. Telegram Interaction
        document.getElementById('telegram').addEventListener('input', e => {
            const field = document.getElementById('tg-field');
            if(e.target.value.startsWith('@') && e.target.value.length > 3) field.classList.add('valid-tg');
            else field.classList.remove('valid-tg');
        });

        // 3. Reveal Logic
        window.addEventListener('scroll', () => {
            document.querySelectorAll('.reveal').forEach(r => { if(r.getBoundingClientRect().top < window.innerHeight - 80) r.classList.add('active'); });
        });

        document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

        // 4. Submit logic
        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.disabled = true; btn.innerText = "AUTHENTICATING...";
            
            const pool = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let p1 = ""; for(let i=0; i<4; i++) p1 += pool.charAt(Math.floor(Math.random()*pool.length));
            const id = `CM-${p1}-${Math.floor(1000 + Math.random()*9000)}`;

            const fd = new FormData();
            fd.append('email', document.getElementById('email').value);
            fd.append('phone', document.getElementById('phone').value);
            fd.append('name', document.getElementById('name').value);
            fd.append('ign', document.getElementById('ign').value);
            fd.append('uid', document.getElementById('uid').value);
            fd.append('exp', document.getElementById('exp').value);
            fd.append('telegram', document.getElementById('telegram').value);
            fd.append('Generated_ID', id);

            // Fetch safety bypass
            const safety = setTimeout(() => showSuccess(id), 3000);
            fetch(scriptURL, { method: 'POST', body: fd, mode: 'no-cors' })
            .then(() => { clearTimeout(safety); showSuccess(id); })
            .catch(() => { clearTimeout(safety); showSuccess(id); });
        });

        function showSuccess(id) {
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('modal-active'), 10);
            
            const copy = document.getElementById('copyBtn');
            copy.innerText = id;
            copy.onclick = () => {
                navigator.clipboard.writeText(id); copy.style.color = '#34C759'; copy.innerText = "COPIED";
                setTimeout(() => { copy.innerText = id; copy.style.color = 'var(--fiery)'; }, 2000);
            };

            document.getElementById('sumPreview').innerHTML = `
                <div class="data-row"><span>Operator</span> <b>${document.getElementById('name').value}</b></div>
                <div class="data-row"><span>IGN Handle</span> <b>${document.getElementById('ign').value}</b></div>
                <div class="data-row"><span>Game UID</span> <b>${document.getElementById('uid').value}</b></div>
                <div class="data-row"><span>Contact</span> <b>+91 ${document.getElementById('phone').value}</b></div>
            `;
        }

        // 5. Final Premium Redirect
        document.getElementById('finalJoin').onclick = (e) => {
            e.preventDefault();
            document.body.classList.add('redirecting');
            setTimeout(() => {
                window.location.href = "https://t.me/+3xRCpmBV3yA4NGM1";
            }, 1800);
        }
    </script>
</body>
</html>
