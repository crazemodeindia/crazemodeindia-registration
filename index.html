<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRAZE MODE | Sovereign System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --brand: 'Rajdhani', sans-serif; --system: 'Inter', sans-serif; }
        body { background: #000; color: #fff; font-family: var(--system); margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* CINEMATIC INTRO */
        #intro { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .welcome-label { font-size: 0.7rem; letter-spacing: 0.6rem; color: #444; text-transform: uppercase; margin-bottom: 1rem; width: 0; overflow: hidden; white-space: nowrap; border-right: 1px solid #fff; animation: typing 1.5s steps(15) forwards; }
        @keyframes typing { from { width: 0; } to { width: 110px; } }
        
        .brand-text { font-family: var(--brand); font-size: clamp(2.2rem, 10vw, 4rem); letter-spacing: 2.5rem; opacity: 0; transition: 2.5s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
        .brand-text.active { opacity: 1; letter-spacing: 0.5rem; }
        .brand-sub { font-family: var(--brand); font-size: 0.8rem; letter-spacing: 0.3rem; color: #222; opacity: 0; transition: 1.5s; margin-top: 0.5rem; }
        
        .btn-arena { margin-top: 5rem; padding: 1rem 3.5rem; border: 1px solid #1a1a1a; background: transparent; color: #fff; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.3rem; text-transform: uppercase; opacity: 0; transition: 0.5s; cursor: pointer; border-radius: 4px; }
        .btn-arena:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,0.1); }

        /* SYSTEM HEADER */
        .system-header { position: fixed; top: 8vh; width: 100%; text-align: center; z-index: 500; opacity: 0; transition: 1s; }
        .s-title { font-family: var(--brand); font-size: 1.5rem; letter-spacing: 0.6rem; font-weight: 700; color: #fff; }
        .s-status { font-size: 9px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

        /* PROGRESS TRACKER */
        .progress-container { position: fixed; top: 18vh; width: 100%; display: flex; justify-content: center; z-index: 500; opacity: 0; transition: 1s; }
        .progress-track { width: 60%; max-width: 300px; height: 2px; background: #0a0a0a; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 25%; background: #fff; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px #fff; }

        /* CONTENT ARCHITECTURE */
        #main-view { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .system-card { width: 92%; max-width: 400px; padding: 4rem 3rem; background: #050505; border: 1px solid #0f0f0f; border-radius: 8px; display: none; opacity: 0; transform: translateY(20px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .system-card.active { display: block; opacity: 1; transform: translateY(0); }

        /* TYPOGRAPHY & INPUTS */
        .label { font-size: 10px; font-weight: 600; color: #333; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 3.5rem; text-align: center; }
        .input-box { margin-bottom: 3rem; position: relative; }
        input, select { background: transparent; border: none; border-bottom: 1px solid #111; width: 100%; padding: 0.8rem 0; color: #fff; font-size: 1.15rem; font-weight: 400; outline: none; transition: 0.3s; border-radius: 0; }
        input:focus { border-bottom-color: #fff; }
        
        .primary-btn { background: #fff; color: #000; width: 100%; padding: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 4px; font-size: 0.85rem; transition: 0.2s; }
        .primary-btn:active { transform: scale(0.98); background: #ccc; }
        
        .tg-btn { background: #229ED9; color: #fff; }
        .error-hint { color: #ff3333; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; display: none; }

        /* SLASH EFFECT */
        #slash { position: fixed; inset: 0; background: #fff; z-index: 1500; mix-blend-mode: difference; display: none; }
    </style>
</head>
<body>

    <div id="slash"></div>

    <!-- 1. INTRO SCREEN -->
    <div id="intro">
        <p class="welcome-label">Welcome to</p>
        <h1 class="brand-text" id="rTitle">CRAZE MODE</h1>
        <p class="brand-sub" id="rSub">Where Skill Takes the Spotlight</p>
        <button class="btn-arena" id="eBtn" onclick="initArena()">Enter Arena</button>
    </div>

    <!-- 2. STICKY SYSTEM UI -->
    <div class="system-header" id="sHeader">
        <h1 class="s-title">CRAZE MODE</h1>
        <p class="s-status">System Authorization Active</p>
    </div>
    <div class="progress-container" id="pWrap">
        <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
    </div>

    <!-- 3. MAIN APPLICATION -->
    <div id="main-view">
        <!-- STEP 1: AUTH -->
        <div id="step1" class="system-card active">
            <span class="label">Authentication</span>
            <div class="input-box"><input type="email" id="email" placeholder="Gmail Address" autocomplete="off"></div>
            <button onclick="sendOTP()" id="gBtn" class="primary-btn">Request Access</button>
            <div id="otpBox" class="hidden mt-10">
                <div class="input-box">
                    <input type="text" id="emailOtp" placeholder="6-Digit OTP" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <p id="eErr" class="error-hint">Authorization Failed: Invalid OTP</p>
                </div>
                <button onclick="verifyOTP()" id="cBtn" class="primary-btn">Verify Identity</button>
            </div>
        </div>

        <!-- STEP 2: PROFILE -->
        <div id="step2" class="system-card">
            <span class="label">Identity Mapping</span>
            <div class="input-box"><input type="text" id="name" placeholder="Actual Name"></div>
            <div class="input-box"><input type="text" id="nick" placeholder="FF Nickname"></div>
            <div class="input-box"><input type="text" id="uid" placeholder="FF UID"></div>
            <div class="input-box">
                <select id="exp">
                    <option value="" disabled selected>Combat Experience</option>
                    <option value="Rookie">Rookie (0-1 Yr)</option>
                    <option value="Veteran">Veteran (2-3 Yrs)</option>
                    <option value="Elite">Elite (4+ Yrs)</option>
                </select>
            </div>
            <button onclick="move(3)" class="primary-btn">Commit Profile</button>
        </div>

        <!-- STEP 3: SECURITY -->
        <div id="step3" class="system-card">
            <span class="label">Secure Uplink</span>
            <div class="input-box"><input type="text" id="tgUser" placeholder="Telegram @Username"></div>
            <button onclick="window.open('https://t.me/CMAccessBot')" class="primary-btn tg-btn mb-8">Generate Key</button>
            <div class="input-box">
                <input type="text" id="tgCode" placeholder="4-Digit Security Key" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                <p id="tErr" class="error-hint">Security Error: Key Rejected</p>
            </div>
            <button onclick="verifyTg()" id="tBtn" class="primary-btn tg-btn">Authorize Link</button>
        </div>

        <!-- STEP 4: FINAL -->
        <div id="step4" class="system-card text-center">
            <svg class="w-8 mx-auto mb-8 opacity-20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="label">Protocol Finalized</span>
            <div class="border border-[#111] p-10 mb-8 cursor-pointer bg-[#020202]" onclick="copyId()">
                <div id="idDisplay" class="font-mono text-2xl tracking-[4px]">********</div>
                <p class="text-[8px] text-gray-700 mt-4 tracking-[3px]">CLICK TO COPY CREDENTIALS</p>
            </div>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="primary-btn tg-btn block">Join Arena</a>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzMHjL1PicDlmO5Eo0mg4tGAdouQvHUSk_zTCfm-kvvTjozYFbWjjUPL6ucyqrRD6Lx/exec";

        window.onload = () => {
            setTimeout(() => { document.getElementById('rTitle').classList.add('active'); 
            setTimeout(() => { document.getElementById('rSub').style.opacity = "1"; 
            setTimeout(() => { document.getElementById('eBtn').style.opacity = "1"; }, 800); }, 1000); }, 1500);
        };

        function initArena() {
            document.getElementById('slash').style.display = 'block';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('sHeader').style.opacity = '1';
                document.getElementById('pWrap').style.opacity = '1';
                document.getElementById('step1').classList.add('active');
                document.getElementById('slash').style.display = 'none';
            }, 500);
        }

        function move(s) {
            document.getElementById('pFill').style.width = (s * 25) + "%";
            document.querySelectorAll('.system-card').forEach(x => { x.classList.remove('active'); x.style.display = "none"; });
            setTimeout(() => { 
                const next = document.getElementById('step'+s);
                next.style.display = "block";
                setTimeout(() => next.classList.add('active'), 50);
                if(s === 4) runDecrypt();
            }, 400);
        }

        async function sendOTP() {
            const e = document.getElementById('email').value; if(!e.includes("@")) return;
            document.getElementById('gBtn').innerText = "Processing...";
            fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:e})});
            document.getElementById('otpBox').classList.remove('hidden');
            document.getElementById('gBtn').style.display = "none";
        }

        async function verifyOTP() {
            const o = document.getElementById('emailOtp').value; if(o.length !== 6) return;
            document.getElementById('cBtn').innerText = "Verifying...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:document.getElementById('email').value, otp:o})});
            let res = await r.json();
            if(res.success) move(2); else { document.getElementById('eErr').style.display = 'block'; document.getElementById('cBtn').innerText = "Verify Identity"; }
        }

        async function verifyTg() {
            const u = document.getElementById('tgUser').value;
            const c = document.getElementById('tgCode').value; if(c.length !== 4) return;
            document.getElementById('tBtn').innerText = "Authorizing...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:u, code:c})});
            let res = await r.json();
            if(res.success) move(4); else { document.getElementById('tErr').style.display = 'block'; document.getElementById('tBtn').innerText = "Authorize Link"; }
        }

        function runDecrypt() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const gid = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('idDisplay').innerText = gid.split("").map((l, idx) => idx < i ? gid[idx] : chars[Math.floor(Math.random()*36)]).join("");
                if(i >= gid.length) clearInterval(timer);
                i += 1/4;
            }, 40);
            window.finalId = gid;
        }

        function copyId() { navigator.clipboard.writeText(window.finalId); alert("Credentials Copied."); }

        function finalSubmit() {
            const f = { email: document.getElementById('email').value, name: document.getElementById('name').value, ffNick: document.getElementById('nick').value, ffUid: document.getElementById('uid').value, exp: document.getElementById('exp').value, tgUser: document.getElementById('tgUser').value, gameId: window.finalId };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
