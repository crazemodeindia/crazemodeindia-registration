<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Neural Link</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000; --card: #0A0A0A; --border: rgba(255, 255, 255, 0.08);
            --accent: #FFFFFF; --text-sec: #777777; --tg-blue: #0088cc; --apple-red: #FF3B30;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .splash-logo { width: 100px; margin-bottom: 20px; animation: pulse 2s infinite ease-in-out; }
        .boot-text { font-family: 'Rajdhani', sans-serif; letter-spacing: 4px; font-size: 13px; color: #fff; margin-top: 10px; text-transform: uppercase; }
        .loader-bar { width: 120px; height: 1px; background: #222; margin-top: 20px; position: relative; overflow: hidden; }
        .loader-fill { position: absolute; height: 100%; width: 0%; background: #fff; animation: fill 2.5s forwards cubic-bezier(0.4, 0, 0.2, 1); }

        /* --- MAIN APP --- */
        #app { opacity: 0; transition: opacity 1s ease-in; display: none; padding-bottom: 80px; }
        .brand-header { text-align: center; padding: 60px 0 40px 0; }
        .header-logo { height: 35px; margin-bottom: 10px; }
        .tagline { font-size: 10px; letter-spacing: 5px; color: var(--text-sec); text-transform: uppercase; font-weight: 600; }
        .container { max-width: 400px; margin: 0 auto; padding: 0 24px; }
        .section-label { font-size: 11px; font-weight: 700; color: #333; letter-spacing: 2px; margin: 40px 0 20px 0; display: flex; align-items: center; gap: 15px; }
        .section-label::after { content: ""; flex: 1; height: 1px; background: #111; }
        .field { margin-bottom: 24px; position: relative; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: #888; font-weight: 500; }
        input, select { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 15px; color: white; font-family: 'Inter', sans-serif; font-size: 16px; border-radius: 12px; transition: 0.3s; }
        input:focus, select:focus { border-color: #444; background: #0f0f0f; outline: none; }
        .mobile-box { display: flex; }
        .prefix { background: #111; padding: 15px; border: 1px solid var(--border); border-right: none; border-radius: 12px 0 0 12px; color: var(--text-sec); font-weight: 600; }
        .m-input { border-radius: 0 12px 12px 0; }
        .tg-helper { position: absolute; right: 15px; top: 38px; color: var(--tg-blue); cursor: pointer; opacity: 0.6; }
        .check-wrap { display: flex; gap: 12px; margin-top: 15px; cursor: pointer; align-items: center; }
        .check-wrap input { width: 18px; height: 18px; accent-color: white; }
        .check-wrap span { font-size: 13px; color: #666; }
        .btn-submit { width: 100%; padding: 18px; background: white; color: black; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; margin-top: 40px; cursor: pointer; transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); }
        #progress-line { position: fixed; top: 0; left: 0; width: 0%; height: 2px; background: white; z-index: 10000; }

        /* --- MODAL --- */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); backdrop-filter: blur(20px); z-index: 10001; justify-content: center; align-items: center; }
        .modal-body { width: 90%; max-width: 360px; text-align: center; }
        .modal-body h2 { font-size: 24px; margin-bottom: 5px; }
        .summary { text-align: left; margin: 30px 0; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #111; font-size: 14px; }
        .row span { color: #555; }
        .id-output { background: #111; width: 100%; padding: 22px; border-radius: 16px; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; margin: 20px 0 8px 0; border: 1px solid #222; color: white; cursor: pointer; letter-spacing: 2px; }
        .copy-hint { font-size: 11px; color: var(--apple-red); display: block; margin-bottom: 30px; letter-spacing: 1px; }
        .tg-btn { display: block; background: var(--tg-blue); color: white; text-decoration: none; padding: 18px; border-radius: 14px; font-weight: 700; }

        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes fill { from { width: 0%; } to { width: 100%; } }
        .reveal { opacity: 0; transform: translateY(15px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div id="progress-line"></div>
    <div id="splash">
        <img src="https://raw.githubusercontent.com/crazemodeindia/registration/main/logo.png" class="splash-logo" alt="Logo">
        <div class="boot-text" id="status">System Initializing...</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div id="app">
        <div class="brand-header">
            <img src="https://raw.githubusercontent.com/crazemodeindia/registration/main/logo.png" class="header-logo" alt="Logo">
            <div class="tagline">The Elite Standard</div>
        </div>

        <div class="container">
            <form id="crazeForm">
                <div class="reveal">
                    <div class="section-label">01 CONTACT</div>
                    <div class="field"><label>Email Address</label><input type="email" id="email" required placeholder="operator@craze.com"></div>
                    <div class="field"><label>Mobile Number</label><div class="mobile-box"><div class="prefix">+91</div><input type="text" id="phone" class="m-input" maxlength="10" required placeholder="00000 00000"></div></div>
                </div>

                <div class="reveal">
                    <div class="section-label">02 IDENTITY</div>
                    <div class="field"><label>Legal Name</label><input type="text" id="name" required placeholder="Full Name"></div>
                    <div class="field"><label>In-Game Name</label><input type="text" id="ign" required placeholder="Gaming ID"></div>
                    <div class="field"><label>Game UID</label><input type="text" id="uid" required placeholder="87654321"></div>
                    <div class="field"><label>Skill Tier</label>
                        <select id="exp" required>
                            <option value="" disabled selected>Select Tier</option>
                            <option value="Recruit">Recruit</option><option value="Elite">Elite</option><option value="Heroic">Heroic</option><option value="Legend">Legend</option><option value="Immortal">Immortal</option>
                        </select>
                    </div>
                </div>

                <div class="reveal">
                    <div class="section-label">03 CONNECT</div>
                    <div class="field"><label>Telegram Username</label><input type="text" id="telegram" required placeholder="@username"><div class="tg-helper" onclick="window.open('https://t.me/settings', '_blank')">🔗</div></div>
                    <div class="field"><label>Discord (Optional)</label><input type="text" id="discord" placeholder="User#0000"></div>
                </div>

                <div class="reveal">
                    <label class="check-wrap"><input type="checkbox" required><span>I accept all Tournament Rules & Protocols.</span></label>
                    <label class="check-wrap"><input type="checkbox" required><span>I confirm that I am 18 years or older.</span></label>
                    <button type="submit" class="btn-submit" id="submitBtn">CREATE IDENTITY</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal"><div class="modal-body"><h2>Authorized</h2><p style="color: #444; font-size: 13px; margin-top:5px;">Neural link established successfully.</p><div class="summary" id="sumList"></div><button class="id-output" id="copyID">GENERATING...</button><span class="copy-hint">DO NOT DISCLOSE THIS ID TO ANYONE</span><a href="https://t.me/+ulWO6jBK3uRiNjE1" class="tg-btn">JOIN OPERATORS GROUP</a></div></div>

    <script>
        const form = document.getElementById('crazeForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwp0FzRgCLaPMKZIyAwb2Cby_5b7GotW95wXyUBnhmG7hIkh14kP7X5bX7Cinwiep7g/exec';

        window.addEventListener('load', () => {
            const status = document.getElementById('status');
            setTimeout(() => status.innerText = "Neural Link Established...", 1200);
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    setTimeout(() => { document.getElementById('app').style.opacity = '1'; window.dispatchEvent(new Event('scroll')); }, 50);
                }, 1000);
            }, 2500);
        });

        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(r => { if(r.getBoundingClientRect().top < window.innerHeight - 80) r.classList.add('active'); });
            let scrolled = ( (document.body.scrollTop || document.documentElement.scrollTop) / (document.documentElement.scrollHeight - document.documentElement.clientHeight) ) * 100;
            document.getElementById("progress-line").style.width = scrolled + "%";
        });

        document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

        function generateID() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let p1 = ""; for(let i=0; i<4; i++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
            return `CM-${p1}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            if(document.getElementById('phone').value.length !== 10) return alert("Enter 10-digit number.");
            btn.disabled = true; btn.innerText = "AUTHENTICATING...";
            const id = generateID();
            const fd = new FormData();
            fd.append('email', document.getElementById('email').value);
            fd.append('phone', document.getElementById('phone').value);
            fd.append('name', document.getElementById('name').value);
            fd.append('ign', document.getElementById('ign').value);
            fd.append('uid', document.getElementById('uid').value);
            fd.append('exp', document.getElementById('exp').value);
            fd.append('telegram', document.getElementById('telegram').value);
            fd.append('discord', document.getElementById('discord').value);
            fd.append('Generated_ID', id);

            fetch(scriptURL, { method: 'POST', body: fd})
            .then(res => res.text()).then(msg => { if(msg === "SUCCESS") showSuccess(id); else { alert("Error connecting to server."); btn.disabled = false; btn.innerText = "CREATE IDENTITY"; } })
            .catch(() => { alert("Connection Error."); btn.disabled = false; });
        });

        function showSuccess(id) {
            document.getElementById('modal').style.display = 'flex';
            const copyBtn = document.getElementById('copyID');
            copyBtn.innerText = id;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(id);
                copyBtn.style.color = '#34C759'; copyBtn.innerText = "COPIED";
                setTimeout(() => { copyBtn.innerText = id; copyBtn.style.color = 'white'; }, 2000);
            };
            document.getElementById('sumList').innerHTML = `<div class="row"><span>Identity</span> <b>${document.getElementById('name').value}</b></div><div class="row"><span>Operator</span> <b>${document.getElementById('ign').value}</b></div><div class="row"><span>Game UID</span> <b>${document.getElementById('uid').value}</b></div>`;
        }
    </script>
</body>
</html>
