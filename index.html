<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        .intro-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 1s; }
        .brand-text { font-weight: 200; letter-spacing: 1.5em; font-size: 3rem; animation: reveal 3s forwards; opacity: 0; }
        @keyframes reveal { 0% { letter-spacing: 2em; opacity: 0; filter: blur(10px); } 100% { letter-spacing: 0.8em; opacity: 1; filter: blur(0px); } }
        .form-card { display: none; opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
        .form-card.active { display: block; opacity: 1; transform: translateY(0); }
        input { background: transparent; border-bottom: 1px solid #333; width: 100%; padding: 12px 0; outline: none; transition: 0.3s; font-size: 1.1rem; margin-bottom: 25px; }
        input:focus { border-color: #fff; }
        .btn-black { background: #fff; color: #000; border-radius: 50px; padding: 15px; width: 100%; font-weight: 600; transition: 0.3s; cursor: pointer; }
        .btn-black:hover { transform: scale(1.02); }
        .btn-telegram { background: #229ED9; color: #fff; border-radius: 50px; padding: 15px; width: 100%; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="intro" class="intro-screen"><h1 class="brand-text">CRAZE MODE</h1></div>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm">

            <!-- Section 1: Email -->
            <div id="step1" class="form-card active">
                <h2 class="text-3xl font-light mb-8">Sign in</h2>
                <input type="email" id="email" placeholder="Gmail Address">
                <button onclick="sendOTP()" id="mailBtn" class="btn-black">Verify Gmail</button>
                <div id="otpInput" class="hidden mt-4">
                    <input type="text" id="emailOtp" placeholder="Enter OTP from Gmail">
                    <button onclick="verifyEmail()" class="btn-black">Continue</button>
                </div>
            </div>

            <!-- Section 2: Game Info -->
            <div id="step2" class="form-card">
                <h2 class="text-3xl font-light mb-8">Identity</h2>
                <input type="text" id="name" placeholder="Actual Name">
                <input type="text" id="ffNick" placeholder="Free Fire Nickname">
                <p class="text-[10px] text-gray-500 -mt-4 mb-6 uppercase tracking-widest">This name is used to recognize you</p>
                <input type="text" id="ffUid" placeholder="FF UID">
                <button onclick="toStep3()" class="btn-black">Next</button>
            </div>

            <!-- Section 3: Telegram -->
            <div id="step3" class="form-card">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-light mb-8">Security</h2>
                    <span class="text-gray-500 cursor-help" onclick="alert('1. Open Telegram\n2. Settings > Username\n3. If it says None, create one.')">?</span>
                </div>
                <input type="text" id="tgUser" placeholder="Telegram Username">
                <a href="https://t.me/crazemodeverifybot" target="_blank" class="btn-telegram">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" width="20">
                    Get Code From Bot
                </a>
                <input type="text" id="tgCode" placeholder="Enter Bot Code" class="mt-8">
                <button onclick="verifyTg()" class="btn-telegram">Verify with Telegram</button>
            </div>

            <!-- Section 4: Final -->
            <div id="step4" class="form-card text-center">
                <p class="text-gray-400 text-sm mb-10 leading-relaxed">Keep your Game ID safe. It unlocks faster registrations, exclusive rewards, and priority access.</p>
                <button id="genIdBtn" onclick="generateID()" class="btn-black">Get Game ID</button>
                <div id="idResult" class="hidden">
                    <div id="finalId" class="text-4xl font-mono tracking-tighter mb-2"></div>
                    <p class="text-[10px] text-gray-500 mb-10">KEEP IT PRIVATE</p>
                    <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="btn-telegram">Join Private Group</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxfdHCM3CiEbSK0LXzmxGLeE0DcK6_6wScoWU-IiIWjOi_3Ll7snT8jppC9eNJf15YE/exec";
        let localOtp = "";

        setTimeout(() => { document.getElementById('intro').style.opacity = '0'; setTimeout(() => document.getElementById('intro').remove(), 1000); }, 3500);

        function showStep(s) {
            document.querySelectorAll('.form-card').forEach(c => c.classList.remove('active'));
            document.getElementById('step'+s).classList.add('active');
        }

        async function sendOTP() {
            let email = document.getElementById('email').value;
            if(!email.includes('@gmail.com')) return alert("Only @gmail.com allowed");
            document.getElementById('mailBtn').innerText = "Sending...";
            let r = await fetch(API, {method: 'POST', body: JSON.stringify({action:"sendEmailOTP", email:email})});
            let res = await r.json();
            localOtp = res.otp;
            document.getElementById('mailBtn').classList.add('hidden');
            document.getElementById('otpInput').classList.remove('hidden');
        }

        function verifyEmail() {
            if(document.getElementById('emailOtp').value == localOtp) showStep(2);
            else alert("Invalid OTP");
        }

        function toStep3() {
            if(!document.getElementById('ffUid').value) return alert("UID Required");
            showStep(3);
        }

        async function verifyTg() {
            let user = document.getElementById('tgUser').value;
            let code = document.getElementById('tgCode').value;
            let r = await fetch(API, {method: 'POST', body: JSON.stringify({action:"verifyTelegram", username:user, code:code})});
            let res = await r.json();
            if(res.success) showStep(4);
            else alert("Invalid or Expired Code (6m limit)");
        }

        function generateID() {
            let id = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            document.getElementById('finalId').innerText = id;
            document.getElementById('genIdBtn').classList.add('hidden');
            document.getElementById('idResult').classList.remove('hidden');
        }

        function finalSubmit() {
            let f = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                ffNick: document.getElementById('ffNick').value,
                ffUid: document.getElementById('ffUid').value,
                tgUser: document.getElementById('tgUser').value,
                gameId: document.getElementById('finalId').innerText
            };
            fetch(API, {method: 'POST', mode: 'no-cors', body: JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
