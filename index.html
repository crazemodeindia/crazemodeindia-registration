<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAZE MODE - Premium Registration Engine</title>
  <style>
    /* Google Fonts: Montserrat (Monstera Brand Style) & Rajdhani (High-Tech Condensed Body) */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rajdhani:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none; /* Block native context menus on mobile hold gestures */
      -webkit-tap-highlight-color: transparent; /* Remove laggy mobile blue tap highlights */
    }

    body {
      background-color: #000000;
      /* Glowing backlighting vignette behind the portal viewport */
      background-image: radial-gradient(circle at 50% 30%, #151124 0%, #000000 80%);
      color: #FFFFFF;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 1. INTRO SPLASH SCREEN (HIGH IMPACT GAMING UNIFOLD EFFECT) */
    .splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Monstera Extra Bold Unfolding Animation */
    @keyframes brand-unfold {
      0% { letter-spacing: -4px; filter: blur(12px); opacity: 0; transform: scale(0.95); }
      50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
      100% { letter-spacing: 6px; filter: blur(0); opacity: 1; transform: scale(1); }
    }

    /* Montserrat Extra Bold brand typography */
    .brand-logo-unified {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; /* Extra bold monstera style */
      font-size: 25px;
      letter-spacing: 6px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .splash-logo {
      margin-bottom: 6px;
      animation: brand-unfold 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gaming aesthetic brackets */
    .cyber-bracket {
      color: #00F2FE;
      font-weight: 300;
      text-shadow: 0 0 8px #00F2FE;
    }

    @keyframes sub-fade-in {
      0% { opacity: 0; transform: translateY(6px); letter-spacing: 2px; }
      100% { opacity: 1; transform: translateY(0); letter-spacing: 6px; }
    }

    /* Montserrat thin subtitle typography */
    .splash-sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200; /* Monstera font style thin */
      font-size: 11px;
      letter-spacing: 6px;
      color: #7A7A7A;
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0;
      animation: sub-fade-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    /* Mobile-Friendly Proportional Viewport */
    .viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh; /* Responsive height fit for mobile screens */
      max-height: 820px; /* Locked maximum scale for desktops */
      background-color: #0A0A0A;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .header-left .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #7A7A7A; /* Higher contrast gray label */
    }

    .header-right {
      text-align: right;
    }

    .logo-brand {
      font-size: 16px;
    }

    .logo-sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 8px;
      letter-spacing: 0.5px;
      color: #444444;
      margin-top: 3px;
    }

    /* Thin Horizontal Divider under Header */
    .header-divider {
      width: 100%;
      height: 1px;
      background-color: #161616;
      margin-bottom: 30px; /* Increased margin for top-anchored progress bar spacing */
    }

    /* STATUS TRACKER BAR */
    .status-section {
      width: 100%;
      margin-bottom: 30px;
      position: relative;
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #7A7A7A;
      margin-bottom: 6px;
    }

    .status-bar {
      width: 100%;
      height: 2px;
      background-color: #16161a;
      position: relative;
    }

    /* Subtle passive circuit node terminals placed at precise step coordinates [2] */
    .status-node {
      position: absolute;
      top: -1px;
      width: 4px;
      height: 4px;
      background-color: #16161a;
      border: 1px solid #22222a;
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    /* Active progress fill with Matte White electric glow and energy wave [2] */
    .status-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #FFFFFF; /* Matte white fill */
      position: relative;
      transition: width 0.3s ease;
      background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      background-size: 80px 100%;
      animation: status-energy-flow 1.5s linear infinite;
    }

    /* Sharp vertical circuit capsule energy-tip connector (No round glow) [2] */
    .status-bar-fill::after {
      content: '';
      position: absolute;
      right: -1.5px; /* Line up exactly with flat edge */
      top: -4px; /* Extends slightly above and below the 2px bar */
      width: 3px;
      height: 10px; /* Sharp vertical circuit connector capsule */
      background-color: #FFFFFF;
      box-shadow: 0 0 10px #FFFFFF,
                  0 0 20px rgba(255, 255, 255, 0.5);
      z-index: 5;
    }

    /* Travelling percentage text floating elegantly above the active tip [2] */
    .status-percentage-label {
      position: absolute;
      right: 0;
      top: -22px; /* Float directly above the bar */
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      transform: translateX(50%); /* Centered over the lead capsule */
      letter-spacing: 1px;
      white-space: nowrap;
      transition: right 0.3s ease;
    }

    /* High-end completed gaming status bar transition [2] */
    .status-bar-fill.completed {
      background: linear-gradient(90deg, #00F2FE 0%, #4FACFE 50%, #00F2FE 100%) !important;
      background-size: 200% auto !important;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.6) !important;
      animation: status-glow 2.5s linear infinite !important;
    }

    .status-bar-fill.completed::after {
      background-color: #00F2FE !important;
      box-shadow: 0 0 10px #00F2FE,
                  0 0 20px rgba(0, 242, 254, 0.8),
                  0 0 35px rgba(0, 242, 254, 0.4) !important;
    }

    @keyframes status-energy-flow {
      0% { background-position: -80px 0; }
      100% { background-position: 150px 0; }
    }

    @keyframes status-glow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* CARDS CONTAINER */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 460px; /* Sized up from 380px now that bottom panel is removed */
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    .cards-container::-webkit-scrollbar {
      display: none;
    }

    /* Parent border container simulating flawless corner cuts [2] */
    .card {
      width: 100%;
      height: 52px;
      background-color: #161616; /* Represents the passive border color */
      padding: 1px; /* 1px border width boundary */
      position: relative;
      flex-shrink: 0 !important; /* Strict lock preventing card compression on multi-stacks */
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); /* Asymmetrical tech corner cut [2] */
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Inner layer containing card contents */
    .card-inner {
      width: 100%;
      height: 100%;
      background-color: #000000;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      clip-path: polygon(7.5px 0, 100% 0, 100% calc(100% - 7.5px), calc(100% - 7.5px) 100%, 0 100%, 0 7.5px);
    }

    /* Tactile micro-scale feedback active state */
    .card:active {
      transform: scale(0.98);
    }

    /* Active input styling for text entry integration */
    .card.active-input-state {
      background-color: #555555;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
    }

    /* Highlight card on active input focus */
    .card:focus-within {
      background-color: #555555 !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
    }

    /* Card Glow shine animation */
    .card-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 80px;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .card.shine-sweep .card-inner::before {
      animation: sweep 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sweep {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    /* Active verification border glow */
    .card.mild-shine {
      animation: border-glow-pulsing 2s infinite alternate;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.04);
    }

    @keyframes border-glow-pulsing {
      0% { background-color: #161616; }
      50% { background-color: #444444; }
      100% { background-color: #777777; }
    }

    /* Card States (Outer border simulations) */
    .card.success-gmail {
      background-color: #61A843 !important; /* Turns green */
    }

    .card.success-telegram {
      background-color: #0088cc !important; /* Turns blue */
    }

    .card.success-profile {
      background-color: #FFFFFF !important;
    }

    /* High-frequency micro-vibration error */
    .card.error-state {
      background-color: #ff3d00 !important;
      animation: micro-vibrate 0.15s linear infinite;
    }

    @keyframes micro-vibrate {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-0.5px, 0.5px); }
      20% { transform: translate(0.5px, -0.5px); }
      30% { transform: translate(-0.5px, -0.5px); }
      40% { transform: translate(0.5px, 0.5px); }
      50% { transform: translate(-0.5px, 0.5px); }
      60% { transform: translate(0.5px, -0.5px); }
      70% { transform: translate(-0.5px, -0.5px); }
      80% { transform: translate(0.5px, 0.5px); }
      90% { transform: translate(-0.5px, -0.5px); }
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    /* Direct Passthrough to block overlay click capture blocks */
    .card.active-input-state .card-content {
      pointer-events: none !important;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      color: #7A7A7A; 
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .card-value {
      font-size: 15px; 
      font-weight: 600;
      color: #EAEAEA; 
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Embedded text elements styled inline directly inside active card */
    .card-input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      width: 100%;
      margin-top: 1px;
      padding: 0;
    }

    .card-input::placeholder {
      color: #3A3A3A;
    }

    .card.success-gmail .card-value,
    .card.success-telegram .card-value,
    .card.success-profile .card-value {
      color: #FFFFFF;
    }

    /* Checkbox representation */
    .checkbox-icon {
      width: 14px;
      height: 14px;
      border: 1px solid #161616;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card.success-gmail .checkbox-icon {
      border-color: #61A843;
      background-color: #61A843;
    }

    .card.success-telegram .checkbox-icon {
      border-color: #0088cc;
      background-color: #0088cc;
    }

    .card.success-profile .checkbox-icon {
      border-color: #FFFFFF;
      background-color: #FFFFFF;
    }

    .checkmark {
      width: 6px;
      height: 4px;
      border-left: 2px solid #000000;
      border-bottom: 2px solid #000000;
      transform: rotate(-45deg);
      display: none;
      margin-top: -1px;
    }

    .card.success-gmail .checkmark,
    .card.success-telegram .checkmark,
    .card.success-profile .checkmark {
      display: block;
    }

    /* Verification Status Spinner */
    .verify-animation-box {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
    }

    .card.verifying .verify-animation-box {
      display: block;
    }
    
    .card.verifying .checkbox-icon {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* COMPACT CODE OTP DISPLAY BOXES */
    .code-boxes {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .code-box-display {
      width: 18px; /* Optimized, compact width */
      height: 24px; /* Reduced vertical footprint for better vertical balance */
      border: 1px solid #2B2B2B;
      color: #FFFFFF;
      text-align: center;
      font-size: 13px; /* Scaled down for high integration */
      line-height: 24px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      overflow: hidden;
      position: relative;
    }

    .code-box-display.active {
      border-color: #FFFFFF;
    }

    .hidden-code-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.01; /* Set to 0.01 to ensure mobile browsers paint focus successfully */
      cursor: text;
      border: none;
      outline: none;
      z-index: 999 !important; /* Elevated to absolute top to guarantee clean focus captures */
      pointer-events: auto !important;
    }

    /* Falling numbers cascading error effect */
    .code-box-display span {
      display: inline-block;
      width: 100%;
      height: 100%;
      transition: none;
    }

    .code-box-display.falling span {
      animation: fall-off 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes fall-off {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(50px) rotate(45deg); opacity: 0; }
    }

    /* Staggered cascading delay */
    .code-box-display.falling:nth-child(1) span { animation-delay: 0.0s; }
    .code-box-display.falling:nth-child(2) span { animation-delay: 0.08s; }
    .code-box-display.falling:nth-child(3) span { animation-delay: 0.16s; }
    .code-box-display.falling:nth-child(4) span { animation-delay: 0.24s; }
    .code-box-display.falling:nth-child(5) span { animation-delay: 0.32s; }
    .code-box-display.falling:nth-child(6) span { animation-delay: 0.40s; }

    /* INLINE CARD DROPDOWN */
    .card.dropdown-active {
      height: auto;
      min-height: 160px;
    }

    .card.dropdown-active .card-inner {
      height: 100%;
      min-height: 158px;
      align-items: flex-start;
      flex-direction: column;
      cursor: pointer;
    }

    .dropdown-list-inline {
      width: 100%;
      margin-top: 10px;
      border-top: 1px dashed #161616;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px; 
    }

    .dropdown-option-inline {
      font-size: 13px; 
      font-weight: 600;
      color: #666666;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s, transform 0.05s ease;
    }

    .dropdown-option-inline:active {
      transform: scale(0.97);
    }

    .dropdown-option-inline:hover {
      color: #FFFFFF;
    }

    .dropdown-option-inline.selected {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* STATIONARY BOTTOM ZONE (Clean action area) */
    .bottom-container {
      position: absolute;
      bottom: 40px; /* Anchored slightly from bottom edge */
      left: 32px;
      right: 32px;
      height: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    /* NEXT / VERIFY ACTION BUTTON - Dual-container clip path border mapping */
    .action-button {
      width: 100%;
      height: 52px;
      background-color: #FFFFFF; /* Acts as solid fill or outer border boundary */
      padding: 1px;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); /* Cyber cut [2] */
      transition: background-color 0.15s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-button:active {
      transform: scale(0.97);
    }

    .action-button-inner {
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Montserrat', sans-serif; /* High impact brand header font style */
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      clip-path: polygon(9.5px 0, 100% 0, 100% calc(100% - 9.5px), calc(100% - 9.5px) 100%, 0 100%, 0 9.5px);
      transition: background-color 0.15s, color 0.15s;
    }

    .action-button:hover .action-button-inner {
      background-color: #000000;
      color: #FFFFFF;
    }

    .action-button:active .action-button-inner {
      background-color: #111111;
      color: #FFFFFF;
    }

    .telegram-icon {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Vector Clipboard Copy Icon styling */
    .copy-icon {
      width: 13px;
      height: 13px;
      fill: #666666;
      cursor: pointer;
      margin-left: 8px;
      display: inline-block;
      vertical-align: middle;
      transition: fill 0.15s;
    }

    .copy-icon:hover {
      fill: #FFFFFF;
    }

    /* Back Link */
    .back-link {
      align-self: flex-start;
      background: none;
      border: none;
      color: #444444;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 4px;
      transition: color 0.15s, transform 0.05s ease;
    }

    .back-link:active {
      transform: scale(0.97);
    }

    .back-link:hover {
      color: #FFFFFF;
    }

    /* Game ID Display */
    .id-display {
      font-size: 18px;
      letter-spacing: 4px;
      color: #FFFFFF;
      font-weight: bold;
      font-family: 'Rajdhani', sans-serif;
    }

    /* ==========================================================================
       9. GAMER PASS CONFIRMATION CARD (Futuristic Asymmetrical Diagonal Cut) [2]
       ========================================================================== */
    .confirmation-card-wrapper {
      width: 100%;
      background-color: #1E1E1E; /* Outer solid border container */
      padding: 1px; /* 1px border width wrapper */
      clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px); /* Perfect asymmetrical corner cuts [2] */
      transition: background-color 0.2s ease;
    }

    .confirmation-card {
      width: 100%;
      background-color: #000000;
      /* Subtly textured coordinate dot-grid background for raw gaming schematic feel */
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 8px 8px;
      padding: 23px; /* Offset padding spacing for premium layout consistency */
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      clip-path: polygon(23.5px 0, 100% 0, 100% calc(100% - 23.5px), calc(100% - 23.5px) 100%, 0 100%, 0 23.5px);
    }

    /* Floating dashed inner blueprint line matching the exact outer asymmetrical cut [2] */
    .confirmation-card::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 2;
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); /* Internal matched cut [2] */
    }

    /* Slow vertical cyber scanning bar */
    .confirmation-card-scanner {
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.04), transparent);
      pointer-events: none;
      z-index: 3;
      animation: vertical-scan 5s linear infinite;
    }

    @keyframes vertical-scan {
      0% { top: -40px; }
      100% { top: 100%; }
    }

    /* Premium but highly minimal card glow sweep */
    .confirmation-card-sweep-layer {
      position: absolute;
      top: 0;
      left: -150%;
      width: 120px;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.08), /* Extremely subtle gloss */
        transparent
      );
      transform: skewX(-20deg);
      pointer-events: none;
      z-index: 5;
    }

    .confirmation-card-sweep-layer.run-sweep {
      animation: sweep 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .confirmation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #161616;
      padding-bottom: 8px;
    }

    .confirmation-title {
      font-size: 14px;
      color: #FFFFFF;
    }

    .confirmation-badge {
      font-size: 8px;
      border: 1px solid #FFFFFF;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    function fallbackCopyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');

    function callBackend(payload) {
      return fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("Network connection error. Server returned code " + response.status);
        }
        return response.text(); 
      })
      .then(text => {
        try {
          return JSON.parse(text);
        } catch (err) {
          console.error("Non-JSON response:", text);
          throw new Error("Backend connection error. Check configuration.");
        }
      });

    // Custom Web Audio API Synthesizer (Generates structural mechanical alarm buzz)
    function playErrorBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.22);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.22);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.22);
        osc2.stop(audioCtx.currentTime + 0.22);
      } catch (err) {
        console.log("AudioContext blocked or unsupported.");
      }
    }

              box.querySelector("span").textContent = "";

            innerHTML = `
              <div class="card-content" style="display:flex; flex-direction:row; align-items:center; gap:8px;">
                <svg class="telegram-icon" viewBox="0 0 24 24" style="width:14px; height:14px; fill:#555;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <div class="card-value" style="color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;">ACTIVATE YOUR IDENTITY PASS</div>
              </div>
            `;
          } else if (c.isRevealBar) {
            innerHTML = `
              <div class="card-content">
                <div class="card-label">${c.label}</div>
                <div class="card-value" id="idRevealDisplay" style="color: #fff; font-size:13px; font-weight:700;">DECRYPTING_SIGNATURE...</div>
              </div>
            `;
          } else {
            const val = state[c.valKey] || c.placeholder;
            innerHTML = `
              <div class="card-content">
                <div class="card-label">${c.label}</div>
                <div class="card-value">${val}</div>
              </div>
              <div class="checkbox-icon">
                <span class="checkmark"></span>
              </div>
            `;
          }

          // Injected with standard 1px chamfered wrapper border matching parent coordinates
          cardDiv.innerHTML = `<div class="card-inner">${innerHTML}</div>`;
          topCardsContainer.appendChild(cardDiv);

          // Force focus on click anywhere inside active input wrappers for high-performance touch feedback
          if (c.editable || c.isCode) {
            cardDiv.addEventListener("click", (e) => {
              if (e.target.classList.contains("hidden-code-input") || e.target.classList.contains("card-input")) {
                return;
              }
              const input = cardDiv.querySelector(".card-input, .hidden-code-input");
              if (input) input.focus();
            });
          }
        });

        // Initialize keyboard focus captures dynamically with a short layout paint delay
        setTimeout(() => {
          bindInlineInputs(step);
        }, 100);
      }

      backButton.style.display = (currentStep > 0 && !step.isFinalPass) ? "block" : "none";
    }

    // Handles target binding and real-time validation directly inside the card containers
    function bindInlineInputs(step) {
      const textInput = document.querySelector(".card-input");
      if (textInput) {
        textInput.focus();
        const length = textInput.value.length;
        textInput.setSelectionRange(length, length);

        textInput.addEventListener("input", (e) => {
          let val = e.target.value;

          if (step.id === "EMAIL_INPUT") {
            if (val.endsWith("@")) {
              val = val + "gmail.com";
              e.target.value = val;
              e.target.setSelectionRange(val.length, val.length); 
            }
            state.email = val;
          } else if (step.id === "NAME_INPUT") {
            state.username = val;
          } else if (step.id === "FF_NICK_INPUT") {
            state.ffNickname = val;
          } else if (step.id === "FF_UID_INPUT") {
            state.ffUid = val;
          } else if (step.id === "TELEGRAM_INPUT") {
            if (val && !val.startsWith("@")) val = "@" + val;
            e.target.value = val;
            state.telegramUser = val;
          }
        });
      }

      const hiddenCodeCapture = document.getElementById("hiddenCodeCapture");
      if (hiddenCodeCapture) {
        hiddenCodeCapture.focus();

        const handleCodeInput = (e) => {
          let val = e.target.value;
          val = val.replace(/[^0-9]/g, '');
          if (val.length > 6) val = val.substring(0, 6);
          e.target.value = val;
          syncVerificationBoxes(val);

          // Highly responsive auto-submit trigger for mobile keyboards on 6th digit entry
          if (val.length === 6) {
            setTimeout(() => {
              actionButton.click();
            }, 120);
          }
        };

        hiddenCodeCapture.addEventListener("input", handleCodeInput);
        hiddenCodeCapture.addEventListener("keyup", handleCodeInput);
        hiddenCodeCapture.addEventListener("change", handleCodeInput);
      }
    }

    function setExperience(level) {
      state.experienceLevel = level;
      triggerCardShineSweep("exp");
      
      setTimeout(() => {
        currentStep++;
        renderStep();
      }, 350);
    }

    // Dynamic typewriter message effect builder
    function runTypewriterMessage(element, text, speed = 40, callback) {
      element.innerHTML = "";
      let i = 0;
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        } else if (callback) {
          callback();
        }
      }
      type();
    }

    // Core validation controller connected to Google Sheets Script Editor Backend
    actionButton.onclick = () => {
      const step = steps[currentStep];

      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
          console.log("AudioContext not supported");
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (step.id === "EMAIL_INPUT") {
        const gmailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (!gmailPattern.test(state.email)) {
          triggerCardError("email", "INVALID EMAIL (MUST BE xxxx@gmail.com)");
          return;
        }

        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "SENDING...";

        // Live API integration checking email uniqueness and dispatching actual verification code [1]
        callBackend({ action: "sendEmailOTP", email: state.email })
        .then(res => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "GET CODE";

          if (res.success) {
            triggerCardShineSweep("email");
            
            // If Mail quota is exhausted, auto-retrieve & display code in developer console / UI
            if (res.debugCode) {
              console.log("DEMO MODE FALLBACK EMAIL OTP:", res.debugCode);
              triggerToast("DEBUG RECOVERY CODE: " + res.debugCode, true);
            }
            
            currentStep++;
            renderStep();
            triggerToast("CODE SENT", true); 
          } else {
            // Gmail reuse error handled by logging to UI
            triggerCardError("email", res.message || "REGISTRATION PROCESS FAILED");
          }
        })
        .catch(err => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "GET CODE";
          triggerCardError("email", "CONNECTION ERROR");
        });

      } else if (step.id === "EMAIL_VERIFY") {
        const codeCapture = document.getElementById("hiddenCodeCapture");
        const inputVal = codeCapture ? codeCapture.value : "";
        
        if (!inputVal.trim() || inputVal.length !== 6) {
          triggerCardError("code", "INVALID CODE. MUST BE 6 DIGITS");
          return;
        }

        const card = document.getElementById("card-code");
        card.classList.add("verifying");
        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "VERIFYING...";

        // Live validation call checking OTP validity [1]
        callBackend({ action: "verifyEmailOTP", email: state.email, code: inputVal })
        .then(res => {
          if (res.success) {
            state.emailVerified = true;
            
            // Highlight player email border green on correct code verification
            const emailCard = document.getElementById("card-email");
            if (emailCard) {
              emailCard.className = "card success-gmail";
              triggerCardShineSweep("email");
            }
            
            // Stagger transition slightly so user can admire the green validation micro-interaction
            setTimeout(() => {
              card.classList.remove("verifying");
              actionButton.style.pointerEvents = "auto";
              actionButtonInner.textContent = "VERIFY";
              
              currentStep++;
              renderStep();
              triggerToast("GMAIL VERIFIED", true);
            }, 800);
          } else {
            card.classList.remove("verifying");
            actionButton.style.pointerEvents = "auto";
            actionButtonInner.textContent = "VERIFY";
            triggerCardError("code", res.message || "INVALID CODE. MUST BE 6 DIGITS");
          }
        })
        .catch(err => {
          card.classList.remove("verifying");
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "VERIFY";
          triggerCardError("code", "CONNECTION ERROR");
        });

      } else if (step.id === "NAME_INPUT") {
        if (!state.username.trim()) {
          triggerCardError("name", "USER NAME CANNOT BE EMPTY");
          return;
        }
        triggerCardShineSweep("name");
        currentStep++;
        renderStep();

      } else if (step.id === "FF_NICK_INPUT") {
        if (!state.ffNickname.trim()) {
          triggerCardError("ff_nick", "NICKNAME CANNOT BE EMPTY");
          return;
        }
        triggerCardShineSweep("ff_nick");
        currentStep++;
        renderStep();

      } else if (step.id === "FF_UID_INPUT") {
        if (!state.ffUid.trim()) {
          triggerCardError("ff_uid", "UID CANNOT BE EMPTY");
          return;
        }
        triggerCardShineSweep("ff_uid");
        currentStep++;
        renderStep();

      } else if (step.id === "TELEGRAM_INPUT") {
        const tgPattern = /^@[a-zA-Z0-9_]{5,32}$/;
        if (!tgPattern.test(state.telegramUser)) {
          triggerCardError("tg", "INVALID TG USERNAME");
          return;
        }

        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "GENERATING...";

        // Live Telegram OTP verification session initialization [1]
        callBackend({ action: "requestTelegramOTP", telegramUser: state.telegramUser })
        .then(res => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "GET CODE";

          if (res.success) {
            activeSessionToken = res.sessionToken;
            triggerCardShineSweep("tg");
            currentStep++;
            renderStep();
            triggerToast("CODE SENT", true); 
            setTimeout(() => {
              window.open(res.botLink, "_blank"); // Route participant to Telegram Bot to trigger OTP text
            }, 800);
          } else {
            triggerCardError("tg", res.message || "TELEGRAM INITIATION FAILED");
          }
        })
        .catch(err => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "GET CODE";
          triggerCardError("tg", "CONNECTION ERROR");
        });

      } else if (step.id === "TELEGRAM_VERIFY") {
        const codeCapture = document.getElementById("hiddenCodeCapture");
        const inputVal = codeCapture ? codeCapture.value : "";
        
        if (!inputVal.trim() || inputVal.length !== 6) {
          triggerCardError("tg_code", "INVALID CODE. MUST BE 6 DIGITS");
          return;
        }

        const card = document.getElementById("card-tg_code");
        card.classList.add("verifying");
        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "VERIFYING...";

        // Live verification call checking code matches Telegram Bot session (Supports 123456 as fallback) [1]
        callBackend({ action: "verifyTelegramOTP", sessionToken: activeSessionToken, code: inputVal })
        .then(res => {
          if (res.success) {
            state.telegramVerified = true;
            
            // Highlight Telegram username card border blue on correct code verification
            const tgCard = document.getElementById("card-tg");
            if (tgCard) {
              tgCard.className = "card success-telegram";
              triggerCardShineSweep("tg");
            }

            // Stagger transition slightly so user can admire the blue validation feedback
            setTimeout(() => {
              card.classList.remove("verifying");
              actionButton.style.pointerEvents = "auto";
              actionButtonInner.textContent = "VERIFY";
              
              currentStep++;
              renderStep();
              triggerToast("TELEGRAM VERIFIED", true);
            }, 800);
          } else {
            card.classList.remove("verifying");
            actionButton.style.pointerEvents = "auto";
            actionButtonInner.textContent = "VERIFY";
            triggerCardError("tg_code", res.message || "INVALID CODE. MUST BE 6 DIGITS");
          }
        })
        .catch(err => {
          card.classList.remove("verifying");
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "VERIFY";
          triggerCardError("tg_code", "CONNECTION ERROR");
        });

      } else if (step.id === "UNLOCK_PROMPT") {
        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "REGISTERING...";

        // Live API call committing verified player demographics to permanent Sheet rows [1]
        callBackend({
          action: "finalizeRegistration",
          email: state.email,
          username: state.username,
          ffNickname: state.ffNickname,
          ffUid: state.ffUid,
          experienceLevel: state.experienceLevel,
          telegramUser: state.telegramUser
        })
        .then(res => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "ACTIVATE ID";

          if (res.success) {
            state.gameId = res.gameId; // Stores highly unique generated game ID returned by Google Sheets
            currentStep++;
            renderStep();
            
            const display = document.getElementById("idRevealDisplay");
            scrambleReveal(display, state.gameId);
          } else {
            triggerCardError("lock-identity", res.message || "REGISTRATION PROCESS FAILED");
          }
        })
        .catch(err => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "ACTIVATE ID";
          triggerCardError("lock-identity", "CONNECTION ERROR");
        });

      } else if (step.id === "FINAL_PASS") {
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]); 
        }

        actionButton.style.pointerEvents = "none";
        actionButtonInner.textContent = "CONNECTING...";

        // Writes Checkbox "☑" inside final checklist column of Google Sheets matching generated ID row [1]
        callBackend({ action: "finalizeReview", gameId: state.gameId })
        .then(res => {
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "ENTER ARENA";
          
          triggerToast("REDIRECTING...", true);
          setTimeout(() => {
            window.location.href = "https://t.me/+Ah8ZbN2eKKAzZWJl"; 
          }, 400);
        })
        .catch(err => {
          // Bypasses graceful fail to prevent bottlenecks on final routing stage
          actionButton.style.pointerEvents = "auto";
          actionButtonInner.textContent = "ENTER ARENA";
          window.location.href = "https://t.me/+Ah8ZbN2eKKAzZWJl"; 
        });
      }
    };

    backButton.onclick = () => {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    };

    // Scramble Transition settling on format: CM-123-ABC on top card
    function scrambleReveal(element, targetString) {
      const bank = "0123456789";
      const charBank = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let frame = 0;
      const totalFrames = 20;

      const interval = setInterval(() => {
        let displayStr = "";
        for (let i = 0; i < targetString.length; i++) {
          if (targetString[i] === '-') {
            displayStr += '-';
          } else if (frame > i * 2.5) {
            displayStr += targetString[i];
          } else {
            if (i >= 3 && i <= 5) {
              displayStr += bank[Math.floor(Math.random() * bank.length)];
            } else {
              displayStr += charBank[Math.floor(Math.random() * charBank.length)];
            }
          }
        }
        element.style.fontWeight = "700";
        element.style.letterSpacing = "6px"; 
        element.textContent = displayStr;
        frame++;

        if (frame > totalFrames) {
          clearInterval(interval);
          element.textContent = targetString;
          
          setTimeout(() => {
            const msgDiv = document.createElement("div");
            msgDiv.className = "typing-text-message";
            msgDiv.id = "congratsText";
            topCardsContainer.appendChild(msgDiv);

            const congratsMsg = "Congratulations! Your CRAZE MODE ID is active.";
            
            runTypewriterMessage(msgDiv, congratsMsg, 40, () => {
              actionButton.style.visibility = "visible";
              actionButtonInner.textContent = "VIEW PASS";
              
              actionButton.onclick = () => {
                currentStep = 10; 
                renderStep();
              };
            });
          }, 800);
        }
      }, 55);
    }

    // Orchestrates the typewriter pass text reveal sequentially
    function triggerSequentialPassReveal() {
      const passCard = document.getElementById("finalPassCard");
      const brand = document.getElementById("finalPassBrand");
      const badge = document.getElementById("finalPassBadge");
      
      const lblGamer = document.getElementById("lblPassGamer");
      const valGamer = document.getElementById("passGamerName");
      
      const lblNick = document.getElementById("lblPassNick");
      const valNick = document.getElementById("passFFNick");
      
      const lblId = document.getElementById("lblPassId");
      const valId = document.getElementById("passCrazeId");

      const motto = document.getElementById("mottoText");
      const sweepLayer = document.getElementById("finalPassSweep");

      lblGamer.style.visibility = "hidden";
      lblNick.style.visibility = "hidden";
      lblId.style.visibility = "hidden";
      
      setTimeout(() => {
        runTypewriterMessage(brand, "CRAZE MODE", 35, () => {
          badge.style.visibility = "visible";
          badge.style.opacity = "0";
          badge.style.transition = "opacity 0.4s ease";
          void badge.offsetWidth;
          badge.style.opacity = "1";
          
          setTimeout(() => {
            lblGamer.style.visibility = "visible";
            runTypewriterMessage(valGamer, state.username, 35, () => {
              
              setTimeout(() => {
                lblNick.style.visibility = "visible";
                runTypewriterMessage(valNick, state.ffNickname, 35, () => {
                  
                  setTimeout(() => {
                    lblId.style.visibility = "visible";
                    valId.innerHTML = `${state.gameId} ${copySVG}`;
                    runTypewriterMessage(valId, state.gameId, 35, () => {
                      valId.innerHTML = `${state.gameId} ${copySVG}`;
                      sweepLayer.classList.add("run-sweep");
                      
                      setTimeout(() => {
                        motto.classList.add("visible");
                        actionButton.style.visibility = "visible";
                        actionButtonInner.textContent = "ENTER ARENA";
                        
                        actionButton.onclick = () => {
                          if (navigator.vibrate) {
                            navigator.vibrate([100, 50, 100]); 
                          }
                          triggerToast("REDIRECTING...", true);
                          setTimeout(() => {
                            window.location.href = "https://t.me/+Ah8ZbN2eKKAzZWJl"; 
                          }, 400);
                        };
                      }, 400);
                    });
                  }, 250);
                });
              }, 250);
            });
          }, 350);
        });
      }, 600);
    }
  </script>
