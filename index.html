<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | The Skill Standard</title>

    <!-- Google Fonts: Rajdhani for Tech-Logo, Inter for Google-UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --card: #080808;
            --border: rgba(255, 255, 255, 0.06);
            --accent: #FFFFFF;
            --text-sec: #666666;
            --tg-blue: #0088cc;
            --apple-red: #FF3B30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- CINEMATIC SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-text {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 12px; /* Premium spacing */
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-indent: 12px; /* Centers text despite letter spacing */
            animation: textGlow 2s infinite alternate;
        }

        .splash-sub {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--text-sec);
            text-transform: uppercase;
            font-weight: 500;
        }

        .loader-wrap {
            width: 100px;
            height: 1px;
            background: #111;
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }

        .loader-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: #fff;
            animation: fill 2.2s forwards cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* --- MAIN APPLICATION --- */
        #app {
            opacity: 0;
            transition: opacity 1.2s ease-in;
            display: none;
            padding-bottom: 80px;
        }

        .brand-header {
            text-align: center;
            padding: 80px 0 50px 0;
        }

        .main-logo {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 10px;
            text-indent: 8px;
        }

        .tagline {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--text-sec);
            text-transform: uppercase;
            font-weight: 600;
        }

        .container { max-width: 400px; margin: 0 auto; padding: 0 24px; }

        /* Premium Minimalist Input Groups */
        .section-label {
            font-size: 10px;
            font-weight: 700;
            color: #333;
            letter-spacing: 2px;
            margin: 40px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after { content: ""; flex: 1; height: 1px; background: #0f0f0f; }

        .field { margin-bottom: 28px; position: relative; }
        label { display: block; font-size: 13px; margin-bottom: 10px; color: #888; font-weight: 500; }

        input, select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            border-radius: 12px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            border-color: #333;
            background: #0d0d0d;
            outline: none;
        }

        .mobile-box { display: flex; }
        .prefix {
            background: #0d0d0d;
            padding: 16px;
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 12px 0 0 12px;
            color: #444;
            font-weight: 600;
        }
        .m-input { border-radius: 0 12px 12px 0; }

        .tg-helper {
            position: absolute;
            right: 15px;
            top: 41px;
            color: var(--tg-blue);
            cursor: pointer;
            opacity: 0.5;
            font-size: 18px;
        }

        .check-wrap { display: flex; gap: 12px; margin-top: 18px; cursor: pointer; align-items: center; }
        .check-wrap input { width: 18px; height: 18px; accent-color: white; border-radius: 4px; }
        .check-wrap span { font-size: 13px; color: #555; }

        .btn-submit {
            width: 100%;
            padding: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 45px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        #progress-line { position: fixed; top: 0; left: 0; width: 0%; height: 2px; background: white; z-index: 10000; }

        /* --- MODAL --- */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.98); backdrop-filter: blur(30px); z-index: 10001; justify-content: center; align-items: center; }
        .modal-body { width: 90%; max-width: 360px; text-align: center; }
        .modal-body h2 { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .summary { text-align: left; margin: 30px 0; }
        .row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #0f0f0f; font-size: 14px; }
        .row span { color: #444; }

        .id-output { background: #080808; width: 100%; padding: 24px; border-radius: 16px; font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; margin: 20px 0 8px 0; border: 1px solid #111; color: white; cursor: pointer; letter-spacing: 3px; }
        .copy-hint { font-size: 10px; color: var(--apple-red); display: block; margin-bottom: 35px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        
        .tg-btn { display: block; background: var(--tg-blue); color: white; text-decoration: none; padding: 20px; border-radius: 14px; font-weight: 700; transition: 0.2s; }

        /* Animations */
        @keyframes textGlow { from { opacity: 0.6; } to { opacity: 1; } }
        @keyframes fill { from { width: 0%; } to { width: 100%; } }
        .reveal { opacity: 0; transform: translateY(15px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div id="progress-line"></div>

    <!-- PRE-LOADER -->
    <div id="splash">
        <div class="splash-text">CRAZE MODE</div>
        <div class="splash-sub">Initializing Neural Link</div>
        <div class="loader-wrap"><div class="loader-fill"></div></div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <div class="brand-header">
            <div class="main-logo">CRAZE MODE</div>
            <div class="tagline">The Elite Standard</div>
        </div>

        <div class="container">
            <form id="crazeForm">
                <div class="reveal">
                    <div class="section-label">01 CONTACT</div>
                    <div class="field"><label>Email Address</label><input type="email" id="email" required placeholder="operator@craze.com"></div>
                    <div class="field"><label>Mobile Number</label><div class="mobile-box"><div class="prefix">+91</div><input type="text" id="phone" class="m-input" maxlength="10" required placeholder="00000 00000"></div></div>
                </div>

                <div class="reveal">
                    <div class="section-label">02 PLAYER PROFILE</div>
                    <div class="field"><label>Full Name</label><input type="text" id="name" required placeholder="Identity"></div>
                    <div class="field"><label>In-Game Name</label><input type="text" id="ign" required placeholder="Gaming ID"></div>
                    <div class="field"><label>Game UID</label><input type="text" id="uid" required placeholder="8-12 Digits"></div>
                    <div class="field"><label>Skill Tier</label>
                        <select id="exp" required>
                            <option value="" disabled selected>Select Tier</option>
                            <option value="Recruit">Recruit</option><option value="Veteran">Veteran</option><option value="Heroic">Heroic</option><option value="Legend">Legend</option><option value="Immortal">Immortal</option>
                        </select>
                    </div>
                </div>

                <div class="reveal">
                    <div class="section-label">03 CONNECTIVITY</div>
                    <div class="field"><label>Telegram Username</label><input type="text" id="telegram" required placeholder="@username"><div class="tg-helper" onclick="window.open('https://t.me/settings', '_blank')">🔗</div></div>
                    <div class="field"><label>Discord (Optional)</label><input type="text" id="discord" placeholder="User#0000"></div>
                </div>

                <div class="reveal">
                    <label class="check-wrap"><input type="checkbox" required><span>Accepting tournament rules & data link.</span></label>
                    <label class="check-wrap"><input type="checkbox" required><span>Verified 18+ years of age.</span></label>
                    <button type="submit" class="btn-submit" id="submitBtn">CREATE IDENTITY</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SUCCESS MODAL -->
    <div id="modal">
        <div class="modal-body">
            <h2>Authorized</h2>
            <p style="color: #333; font-size: 13px; margin-top:5px;">System synchronization complete.</p>
            <div class="summary" id="sumList"></div>
            <button class="id-output" id="copyID">GENERATING...</button>
            <span class="copy-hint">PROPRIETARY ID - DO NOT SHARE</span>
            <a href="https://t.me/+ulWO6jBK3uRiNjE1" class="tg-btn">JOIN GROUP</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('crazeForm');
        // REPLACE THIS WITH YOUR UPDATED TEST-MODE APPS SCRIPT URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwp0FzRgCLaPMKZIyAwb2Cby_5b7GotW95wXyUBnhmG7hIkh14kP7X5bX7Cinwiep7g/exec';

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    setTimeout(() => { document.getElementById('app').style.opacity = '1'; window.dispatchEvent(new Event('scroll')); }, 50);
                }, 1200);
            }, 2500);
        });

        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(r => { if(r.getBoundingClientRect().top < window.innerHeight - 80) r.classList.add('active'); });
            let scrolled = ( (document.body.scrollTop || document.documentElement.scrollTop) / (document.documentElement.scrollHeight - document.documentElement.clientHeight) ) * 100;
            document.getElementById("progress-line").style.width = scrolled + "%";
        });

        document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

        function generateID() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let p1 = ""; for(let i=0; i<4; i++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
            return `CM-${p1}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            if(document.getElementById('phone').value.length !== 10) return alert("Enter 10-digit number.");
            btn.disabled = true; btn.innerText = "AUTHENTICATING...";
            
            const id = generateID();
            const fd = new FormData();
            fd.append('email', document.getElementById('email').value);
            fd.append('phone', document.getElementById('phone').value);
            fd.append('name', document.getElementById('name').value);
            fd.append('ign', document.getElementById('ign').value);
            fd.append('uid', document.getElementById('uid').value);
            fd.append('exp', document.getElementById('exp').value);
            fd.append('telegram', document.getElementById('telegram').value);
            fd.append('discord', document.getElementById('discord').value);
            fd.append('Generated_ID', id);

            fetch(scriptURL, { method: 'POST', body: fd})
            .then(res => res.text()).then(msg => { 
                if(msg === "SUCCESS") showSuccess(id); 
                else { alert("SYNC ERROR"); btn.disabled = false; btn.innerText = "CREATE IDENTITY"; } 
            }).catch(() => { alert("CONNECTION ERROR"); btn.disabled = false; });
        });

        function showSuccess(id) {
            document.getElementById('modal').style.display = 'flex';
            const copyBtn = document.getElementById('copyID');
            copyBtn.innerText = id;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(id);
                copyBtn.style.color = '#34C759'; copyBtn.innerText = "COPIED";
                setTimeout(() => { copyBtn.innerText = id; copyBtn.style.color = 'white'; }, 2000);
            };
            document.getElementById('sumList').innerHTML = `<div class="row"><span>Identity</span> <b>${document.getElementById('name').value}</b></div><div class="row"><span>Operator</span> <b>${document.getElementById('ign').value}</b></div><div class="row"><span>Game UID</span> <b>${document.getElementById('uid').value}</b></div>`;
        }
    </script>
</body>
</html>
