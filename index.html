<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --brand: 'VT323', monospace; --body: 'Inter', sans-serif; }
        body { background: #000; color: #fff; font-family: var(--body); margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .header { padding: 50px 0 20px; text-align: center; width: 100%; background: #000; z-index: 100; position: fixed; top: 0; }
        .brand-title { font-family: var(--brand); font-size: 3.5rem; letter-spacing: 4px; line-height: 1; }
        .brand-subtext { font-size: 10px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-top: 8px; }

        .form-area { width: 90%; max-width: 380px; margin-top: 180px; padding-bottom: 60px; }
        .step { display: none; opacity: 0; transform: translateY(15px); transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        .step.active { display: block; opacity: 1; transform: translateY(0); }

        .group { margin-bottom: 2.2rem; }
        input { 
            background: transparent; border: none; border-bottom: 2px solid #222; 
            width: 100%; padding: 14px 0; color: #fff; font-size: 1.2rem; outline: none; transition: 0.3s;
        }
        input:focus { border-bottom-color: #fff; }
        input::-webkit-inner-spin-button { display: none; }

        .btn-p { 
            background: #fff; color: #000; padding: 18px; width: 100%; border-radius: 12px; 
            font-weight: 600; cursor: pointer; transition: 0.2s; border: none;
        }
        .btn-p:active { transform: scale(0.96); }
        .btn-tg { background: #229ED9; color: #fff; }
        .btn-loading { background: #333 !important; color: #666 !important; pointer-events: none; }
        
        .error-txt { color: #ff4d4d; font-size: 11px; margin-top: 8px; display: none; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="brand-title">CRAZE MODE</h1>
        <p class="brand-subtext">Where Skill Takes the Spotlight</p>
    </div>

    <div class="form-area">
        <!-- STEP 1: GMAIL -->
        <div id="step1" class="step active">
            <h2 class="text-2xl font-light mb-10">Sign in</h2>
            <div class="group"><input type="email" id="email" placeholder="Gmail Address"></div>
            <button onclick="sendEmailCode()" id="eBtn" class="btn-p">Verify Gmail</button>
            <div id="otpBox" class="hidden mt-10">
                <div class="group">
                    <input type="number" id="emailOtp" placeholder="6-digit Code" oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6)">
                    <p id="eError" class="error-txt">Incorrect Verification Code</p>
                </div>
                <button onclick="verifyEmailCode()" id="cBtn" class="btn-p">Continue</button>
            </div>
        </div>

        <!-- STEP 2: DETAILS -->
        <div id="step2" class="step">
            <h2 class="text-2xl font-light mb-10">Identity</h2>
            <div class="group"><input type="text" id="name" placeholder="Actual Name"></div>
            <div class="group">
                <input type="text" id="ffNick" placeholder="Free Fire Nickname">
                <p class="text-[10px] text-gray-600 mt-2 tracking-widest uppercase">Used to recognize you in-game</p>
            </div>
            <div class="group"><input type="text" id="ffUid" placeholder="FF UID"></div>
            <button onclick="move(3)" class="btn-p">Next Section</button>
        </div>

        <!-- STEP 3: TELEGRAM -->
        <div id="step3" class="step">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-light">Security</h2>
                <span class="text-gray-500 border border-gray-500 rounded-full w-5 h-5 flex items-center justify-center text-[10px] cursor-pointer" onclick="alert('Open Telegram > Settings > Username')">?</span>
            </div>
            <div class="group"><input type="text" id="tgUser" placeholder="Telegram Username (e.g. @user)"></div>
            <a href="https://t.me/crazemodeverifybot" target="_blank" class="btn-p btn-tg block text-center mb-6">Get Code</a>
            <div class="group">
                <input type="number" id="tgCode" placeholder="Enter Code" oninput="if(this.value.length > 4) this.value = this.value.slice(0, 4)">
                <p id="tgError" class="error-txt">Code invalid or expired (6m limit)</p>
            </div>
            <button onclick="verifyTgCode()" id="tBtn" class="btn-p btn-tg">Verify Telegram</button>
        </div>

        <!-- STEP 4: FINAL -->
        <div id="step4" class="step text-center">
            <p class="text-gray-400 text-sm mb-10 px-4 leading-relaxed">Keep your Game ID safe. It unlocks faster registrations and exclusive rewards.</p>
            <button id="genBtn" onclick="genID()" class="btn-p">Get Game ID</button>
            <div id="final" class="hidden">
                <div id="gid" class="text-4xl font-mono tracking-tighter mb-2"></div>
                <p class="text-[10px] text-gray-600 mb-10 tracking-[0.3em] uppercase">Private ID</p>
                <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="submit()" class="btn-p btn-tg block text-center">Join Private Group</a>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxfdHCM3CiEbSK0LXzmxGLeE0DcK6_6wScoWU-IiIWjOi_3Ll7snT8jppC9eNJf15YE/exec";

        function move(s) {
            document.querySelectorAll('.step').forEach(x => x.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.step').forEach(x => x.style.display = 'none');
                document.getElementById('step'+s).style.display = 'block';
                setTimeout(() => document.getElementById('step'+s).classList.add('active'), 50);
            }, 300);
        }

        async function sendEmailCode() {
            let email = document.getElementById('email').value;
            if(!email.includes("@gmail.com")) return alert("Use Gmail");
            document.getElementById('eBtn').innerText = "Sending...";
            await fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:email})});
            document.getElementById('eBtn').classList.add('hidden');
            document.getElementById('otpBox').classList.remove('hidden');
        }

        async function verifyEmailCode() {
            let email = document.getElementById('email').value;
            let otp = document.getElementById('emailOtp').value;
            document.getElementById('cBtn').innerText = "Verifying...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:email, otp:otp})});
            let res = await r.json();
            if(res.success) move(2);
            else { document.getElementById('eError').style.display = 'block'; document.getElementById('cBtn').innerText = "Continue"; }
        }

        async function verifyTgCode() {
            let user = document.getElementById('tgUser').value;
            let code = document.getElementById('tgCode').value;
            document.getElementById('tBtn').innerText = "Verifying...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:user, code:code})});
            let res = await r.json();
            if(res.success) move(4);
            else { document.getElementById('tgError').style.display = 'block'; document.getElementById('tBtn').innerText = "Verify Telegram"; }
        }

        function genID() {
            let id = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            document.getElementById('gid').innerText = id;
            document.getElementById('genBtn').classList.add('hidden');
            document.getElementById('final').classList.remove('hidden');
        }

        function submit() {
            let f = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                ffNick: document.getElementById('ffNick').value,
                ffUid: document.getElementById('ffUid').value,
                tgUser: document.getElementById('tgUser').value,
                gameId: document.getElementById('gid').innerText
            };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
