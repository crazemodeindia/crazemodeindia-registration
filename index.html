<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRAZE MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --brand: 'Rajdhani', sans-serif; --system: 'Inter', sans-serif; }
        body { background: #000; color: #fff; font-family: var(--system); margin: 0; overflow: hidden; height: 100vh; -webkit-font-smoothing: antialiased; }

        /* INTRO LAYER */
        #intro { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* FAST FLICKER TEXT */
        .welcome-flicker { font-family: var(--system); font-size: 0.75rem; letter-spacing: 0.6rem; color: #a3a3a3; text-transform: uppercase; margin-bottom: 1.2rem; animation: fastFlicker 0.4s 4 alternate; opacity: 0; }
        @keyframes fastFlicker { 
            0% { opacity: 0; text-shadow: 0 0 0px #fff; } 
            100% { opacity: 1; text-shadow: 0 0 10px #fff; } 
        }

        .brand-main { font-family: var(--brand); font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 700; letter-spacing: 324%; opacity: 0; transition: 2s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; margin: 1.5rem 0; }
        .brand-main.active { opacity: 1; letter-spacing: 0.5rem; }

        /* MILITARY PIXEL GLOW SUBTEXT */
        .brand-sub { font-family: monospace; font-size: 0.7rem; color: #d4d4d4; opacity: 0; transition: 1s; max-width: 220px; line-height: 1.4; text-align: center; letter-spacing: 2px; position: relative; }
        .brand-sub.active { opacity: 1; animation: pixelGlow 2s infinite; }
        @keyframes pixelGlow {
            0%, 100% { text-shadow: 1px 1px 2px rgba(168,85,247,0.4), -1px -1px 2px rgba(255,255,255,0.1); }
            50% { text-shadow: 2px 0px 0px rgba(168,85,247,0.8), -2px 0px 0px rgba(255,255,255,0.3); }
        }

        /* REFINED BUTTONS */
        .btn-arena { margin-top: 5rem; padding: 0.7rem 2.2rem; border: 1px solid #1a1a1a; background: transparent; color: #fff; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.3rem; text-transform: uppercase; opacity: 0; transition: 0.5s; cursor: pointer; border-radius: 2px; }
        .btn-arena:hover { background: #fff; color: #000; border-color: #fff; }

        /* TRANSITION OVERLAY */
        #warp { position: fixed; inset: 0; background: #000; z-index: 950; opacity: 0; pointer-events: none; transition: 0.8s cubic-bezier(0.7, 0, 0.3, 1); transform: scale(1.2); filter: blur(50px); }
        .warp-on { opacity: 1; transform: scale(1); filter: blur(0px); }

        /* ARCHITECTURAL UI */
        .header-ui { position: fixed; top: 10vh; width: 100%; text-align: center; z-index: 500; opacity: 0; transition: 1.5s; }
        .header-title { font-family: var(--brand); font-size: 1.4rem; letter-spacing: 0.5rem; font-weight: 700; }
        
        .progress-line { position: fixed; top: 20vh; width: 40%; left: 30%; height: 1px; background: #111; z-index: 500; opacity: 0; transition: 1s; }
        .progress-fill { height: 100%; width: 25%; background: #fff; box-shadow: 0 0 10px #fff; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        /* SYSTEM CARD */
        #main-view { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .card { width: 90%; max-width: 360px; padding: 4rem 2.5rem; background: #000; border: 1px solid #0a0a0a; border-radius: 4px; display: none; opacity: 0; transform: translateY(10px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .card.active { display: block; opacity: 1; transform: translateY(0); }

        /* TYPOGRAPHY */
        .label { font-size: 9px; font-weight: 500; color: #444; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 3.5rem; text-align: center; }
        .input-box { margin-bottom: 3.5rem; }
        input, select { background: transparent; border: none; border-bottom: 1px solid #111; width: 100%; padding: 0.6rem 0; color: #fff; font-size: 1.1rem; outline: none; transition: 0.3s; border-radius: 0; }
        input:focus { border-bottom-color: #fff; }
        
        .primary-btn { background: #fff; color: #000; width: auto; min-width: 130px; margin: 0 auto; display: block; padding: 0.7rem 1.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; font-size: 0.75rem; transition: 0.2s; }
        .tg-btn { background: #229ED9; color: #fff; }
    </style>
</head>
<body>

    <div id="warp"></div>

    <!-- INTRO -->
    <div id="intro">
        <p class="welcome-flicker" id="wFlicker">Welcome to</p>
        <h1 class="brand-main" id="bTitle">CRAZE MODE</h1>
        <p class="brand-sub" id="bSub">Where Skill Takes the Spotlight</p>
        <button class="btn-arena" id="eBtn" onclick="warpToArena()">Enter Arena</button>
    </div>

    <!-- UI LAYER -->
    <div class="header-ui" id="hUI">
        <h1 class="header-title">CRAZE MODE</h1>
    </div>
    <div class="progress-line" id="pLine"><div class="progress-fill" id="pFill"></div></div>

    <!-- APP -->
    <div id="main-view">
        <div id="step1" class="card active">
            <span class="label">Authentication</span>
            <div class="input-box"><input type="email" id="email" placeholder="Gmail Address" autocomplete="off"></div>
            <button onclick="sendOTP()" id="gBtn" class="primary-btn">Request Access</button>
            <div id="otpBox" class="hidden mt-10">
                <div class="input-box">
                    <input type="text" id="emailOtp" placeholder="6-Digit OTP" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
                <button onclick="verifyOTP()" id="cBtn" class="primary-btn">Verify</button>
            </div>
        </div>

        <div id="step2" class="card">
            <span class="label">Identity Sync</span>
            <div class="input-box"><input type="text" id="name" placeholder="Actual Name"></div>
            <div class="input-box"><input type="text" id="nick" placeholder="FF Nickname"></div>
            <div class="input-box"><input type="text" id="uid" placeholder="FF UID"></div>
            <div class="input-box">
                <select id="exp">
                    <option value="" disabled selected>Experience Level</option>
                    <option value="Rookie">Rookie</option>
                    <option value="Veteran">Veteran</option>
                    <option value="Elite">Elite</option>
                </select>
            </div>
            <button onclick="move(3)" class="primary-btn">Proceed</button>
        </div>

        <div id="step3" class="card">
            <span class="label">Security Link</span>
            <div class="input-box"><input type="text" id="tgUser" placeholder="Telegram @Username"></div>
            <button onclick="window.open('https://t.me/CMAccessBot')" class="primary-btn tg-btn mb-8">Get Code</button>
            <div class="input-box">
                <input type="text" id="tgCode" placeholder="4-Digit Code" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
            <button onclick="verifyTg()" id="tBtn" class="primary-btn tg-btn">Authorize</button>
        </div>

        <div id="step4" class="card text-center">
            <span class="label">Allocation Finalized</span>
            <div class="border border-[#0a0a0a] p-10 mb-8 cursor-pointer" onclick="copyId()">
                <div id="idDisplay" class="font-mono text-xl tracking-[4px]">********</div>
            </div>
            <p class="text-[8px] text-gray-700 mb-12 uppercase tracking-[3px]">Keep it private</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="primary-btn tg-btn block">Join Private Arena</a>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzMHjL1PicDlmO5Eo0mg4tGAdouQvHUSk_zTCfm-kvvTjozYFbWjjUPL6ucyqrRD6Lx/exec";

        window.onload = () => {
            const flicker = document.getElementById('wFlicker');
            flicker.style.opacity = "1";
            setTimeout(() => { 
                flicker.style.animation = "none";
                document.getElementById('bTitle').classList.add('active'); 
                setTimeout(() => { 
                    document.getElementById('bSub').classList.add('active'); 
                    setTimeout(() => { document.getElementById('eBtn').style.opacity = "1"; }, 1000);
                }, 1000);
            }, 1600);
        };

        function warpToArena() {
            const warp = document.getElementById('warp');
            warp.classList.add('warp-on');
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('hUI').style.opacity = '1';
                document.getElementById('pLine').style.opacity = '1';
                document.getElementById('step1').classList.add('active');
                warp.classList.remove('warp-on');
            }, 600);
        }

        function move(s) {
            document.getElementById('pFill').style.width = (s * 25) + "%";
            document.querySelectorAll('.card').forEach(x => { x.classList.remove('active'); x.style.display = "none"; });
            setTimeout(() => { 
                const next = document.getElementById('step'+s);
                next.style.display = "block";
                setTimeout(() => next.classList.add('active'), 50);
                if(s === 4) runDecrypt();
            }, 400);
        }

        async function sendOTP() {
            const e = document.getElementById('email').value; if(!e.includes("@")) return;
            document.getElementById('gBtn').innerText = "Initiating...";
            fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:e})});
            document.getElementById('otpBox').classList.remove('hidden');
            document.getElementById('gBtn').style.display = "none";
        }

        async function verifyOTP() {
            const o = document.getElementById('emailOtp').value; if(o.length !== 6) return;
            document.getElementById('cBtn').innerText = "Verifying...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:document.getElementById('email').value, otp:o})});
            let res = await r.json();
            if(res.success) move(2); else document.getElementById('cBtn').innerText = "Retry";
        }

        async function verifyTg() {
            const u = document.getElementById('tgUser').value;
            const c = document.getElementById('tgCode').value; if(c.length !== 4) return;
            document.getElementById('tBtn').innerText = "Authorizing...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:u, code:c})});
            let res = await r.json();
            if(res.success) move(4); else document.getElementById('tBtn').innerText = "Retry";
        }

        function runDecrypt() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const gid = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('idDisplay').innerText = gid.split("").map((l, idx) => idx < i ? gid[idx] : chars[Math.floor(Math.random()*36)]).join("");
                if(i >= gid.length) clearInterval(timer);
                i += 1/4;
            }, 40);
            window.finalId = gid;
        }

        function copyId() { navigator.clipboard.writeText(window.finalId); alert("Credentials Copied."); }

        function finalSubmit() {
            const f = { email: document.getElementById('email').value, name: document.getElementById('name').value, ffNick: document.getElementById('nick').value, ffUid: document.getElementById('uid').value, exp: document.getElementById('exp').value, tgUser: document.getElementById('tgUser').value, gameId: window.finalId };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
