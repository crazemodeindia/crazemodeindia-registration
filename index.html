<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Tournament Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --accent: #ffffff;
            --dim: #666666;
            --success: #00ff88;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
        }

        .step-info {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 { font-weight: 700; font-size: 28px; letter-spacing: -1px; margin-bottom: 30px; }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field { margin-bottom: 25px; }
        label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 8px; }
        
        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
            color: white;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: white; }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        
        button {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter';
        }

        .primary-btn { background: white; color: black; }
        .primary-btn:hover { background: #e0e0e0; }
        .secondary-btn { background: transparent; color: var(--dim); border: 1px solid var(--border); }
        .secondary-btn:hover { color: white; border-color: white; }

        /* Dialog Overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: #0a0a0a;
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .id-card {
            font-family: 'JetBrains Mono', monospace;
            background: #111;
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            font-size: 20px;
            color: var(--success);
            border: 1px dashed #333;
        }

        .telegram-link {
            display: block;
            background: #0088cc;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 15px;
        }
        
        .loader {
            border: 3px solid #111;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div id="step-counter" class="step-info">Authorization 1 / 4</div>
    <h1>CRAZE MODE</h1>

    <form id="crazeForm">
        <!-- Hidden field for generated ID -->
        <input type="hidden" name="Game_ID" id="hidden_id">

        <!-- STEP 1 -->
        <div class="step active" id="s1">
            <div class="field"><label>Email Address</label><input type="email" name="Email" required placeholder="player@gmail.com"></div>
            <div class="field"><label>Mobile Number</label><input type="tel" name="Mobile" required placeholder="00000 00000"></div>
            <div class="btn-group"><button type="button" class="primary-btn" onclick="move(1, 2)">Next Step</button></div>
        </div>

        <!-- STEP 2 -->
        <div class="step" id="s2">
            <div class="field"><label>Actual Name</label><input type="text" name="Full_Name" required placeholder="Name"></div>
            <div class="field"><label>In-Game Name</label><input type="text" name="IGN" required placeholder="Slayer_7"></div>
            <div class="field"><label>Player UID</label><input type="text" name="UID" required placeholder="8726152"></div>
            <div class="btn-group">
                <button type="button" class="secondary-btn" onclick="move(2, 1)">Back</button>
                <button type="button" class="primary-btn" onclick="move(2, 3)">Next</button>
            </div>
        </div>

        <!-- STEP 3 -->
        <div class="step" id="s3">
            <div class="field"><label>Experience</label><input type="text" name="Exp" placeholder="e.g. 2 yrs"></div>
            <div class="field"><label>Telegram @Username</label><input type="text" name="Telegram" required placeholder="@user"></div>
            <div class="btn-group">
                <button type="button" class="secondary-btn" onclick="move(3, 2)">Back</button>
                <button type="button" class="primary-btn" onclick="move(3, 4)">Finalize</button>
            </div>
        </div>

        <!-- STEP 4 -->
        <div class="step" id="s4">
            <p style="color: var(--dim); font-size: 13px; line-height: 1.6;">By clicking below, you confirm you are 18+ and agree to the tournament regulations.</p>
            <div class="btn-group">
                <button type="button" class="secondary-btn" onclick="move(4, 3)">Back</button>
                <button type="submit" class="primary-btn" id="submitBtn">Get Game ID</button>
            </div>
        </div>
    </form>
</div>

<!-- SUCCESS DIALOGUE -->
<div id="overlay">
    <div class="modal" id="modal-content">
        <div id="loading-view">
            <div class="loader"></div>
            <h3>Generating ID</h3>
            <p style="color: #666; font-size: 12px; margin-top: 10px;">Syncing with Google Sheets...</p>
        </div>

        <div id="success-view" style="display: none;">
            <h2 style="color: var(--success);">SUCCESS</h2>
            <p style="font-size: 13px; color: #888; margin-top: 10px;">Your tournament entry is confirmed.</p>
            <div class="id-card" id="display_id">CM-8EC9-4202</div>
            <p style="font-size: 12px;">Final Step: Join the group to play.</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" class="telegram-link">JOIN TELEGRAM GROUP</a>
        </div>
    </div>
</div>

<script>
    const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbw8PShIc7M9dc1eahMGCuOn4WU68hbPWGCznJCmKIZrfkUbrXoNjA7vemLaHpSkouUW/exec';

    // 1. GENERATE ID (CM-XXXX-XXXX)
    function generateID() {
        const hex = () => Math.floor(Math.random()*16777215).toString(16).toUpperCase().substring(0,4);
        return `CM-${hex()}-${hex()}`;
    }

    // 2. STEP NAVIGATION
    function move(from, to) {
        const currentInputs = document.querySelectorAll(`#s${from} input[required]`);
        let valid = true;
        currentInputs.forEach(i => { if(!i.value) { valid = false; i.style.borderColor = 'red'; } else { i.style.borderColor = ''; } });
        
        if(!valid && to > from) return;

        document.getElementById(`s${from}`).classList.remove('active');
        document.getElementById(`s${to}`).classList.add('active');
        document.getElementById('step-counter').innerText = `Authorization ${to} / 4`;
    }

    // 3. FORM SUBMISSION
    const form = document.getElementById('crazeForm');
    
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // Disable button to prevent double clicks
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "Processing...";

        // Generate ID immediately
        const finalID = generateID();
        document.getElementById('hidden_id').value = finalID;
        document.getElementById('display_id').innerText = finalID;

        // Show Loading Overlay
        document.getElementById('overlay').style.display = 'flex';

        // Background Submit to Google Sheets
        fetch(GOOGLE_URL, { 
            method: 'POST', 
            body: new FormData(form),
            mode: 'no-cors' // This prevents the "stuck" CORS error
        })
        .then(() => {
            // Show success after short delay for effect
            setTimeout(showSuccess, 1000);
        })
        .catch(() => {
            // Even if network fails, show the ID so user isn't stuck
            setTimeout(showSuccess, 1000);
        });
    });

    function showSuccess() {
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        gsap.from('#success-view', { opacity: 0, y: 20, duration: 0.5 });
    }
</script>

</body>
</html>
