<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Secure Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --retro: 'VT323', monospace; --clean: 'Inter', sans-serif; }
        body { background: #000; color: #fff; font-family: var(--clean); margin: 0; overflow-x: hidden; }
        
        .brand-header { padding: 40px 20px; text-align: center; position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 50; }
        .brand-title { font-family: var(--retro); font-size: 2.8rem; letter-spacing: 4px; line-height: 1; }
        .brand-subtext { font-size: 10px; letter-spacing: 2px; color: #666; text-transform: uppercase; margin-top: 5px; }

        .form-container { margin-top: 160px; padding: 20px; width: 100%; max-width: 400px; }
        .step { display: none; transform: translateY(10px); opacity: 0; transition: 0.4s ease; }
        .step.active { display: block; transform: translateY(0); opacity: 1; }

        .input-group { margin-bottom: 1.5rem; position: relative; }
        input { 
            background: transparent; border: none; border-bottom: 2px solid #222; 
            width: 100%; padding: 12px 0; color: #fff; font-size: 1.2rem; 
            outline: none; transition: 0.3s; border-radius: 0;
        }
        input:focus { border-color: #fff; }
        input::placeholder { color: #444; font-size: 1rem; }

        .error-msg { color: #ff4d4d; font-size: 11px; margin-top: 5px; opacity: 0; transition: 0.3s; }
        .error-msg.visible { opacity: 1; }

        .btn-premium { 
            background: #fff; color: #000; padding: 16px; width: 100%; 
            border-radius: 8px; font-weight: 600; cursor: pointer; border: none;
            margin-top: 10px; transition: 0.2s;
        }
        .btn-premium:active { transform: scale(0.98); background: #eee; }
        .btn-tg { background: #229ED9; color: #fff; }

        /* Animation for logo */
        .glow { animation: textGlow 3s infinite alternate; }
        @keyframes textGlow { from { text-shadow: 0 0 5px rgba(255,255,255,0.1); } to { text-shadow: 0 0 15px rgba(255,255,255,0.4); } }
    </style>
</head>
<body class="flex flex-col items-center">

    <div class="brand-header">
        <h1 class="brand-title glow">CRAZE MODE</h1>
        <p class="brand-subtext">Where Skill Takes the Spotlight</p>
    </div>

    <div class="form-container">
        <!-- STEP 1: EMAIL -->
        <div id="step1" class="step active">
            <h2 class="text-2xl font-light mb-8">Sign in</h2>
            <div class="input-group">
                <input type="email" id="email" placeholder="Gmail Address">
            </div>
            <button onclick="handleEmail()" id="eBtn" class="btn-premium">Verify Gmail</button>
            
            <div id="otpBox" class="hidden mt-6">
                <div class="input-group">
                    <input type="number" id="emailOtp" placeholder="6-digit OTP" oninput="limitLength(this, 6)">
                    <p id="eError" class="error-msg">Invalid Code</p>
                </div>
                <button onclick="confirmEmail()" class="btn-premium">Continue</button>
            </div>
        </div>

        <!-- STEP 2: IDENTITY -->
        <div id="step2" class="step">
            <h2 class="text-2xl font-light mb-8">Identity</h2>
            <div class="input-group"><input type="text" id="name" placeholder="Actual Name"></div>
            <div class="input-group">
                <input type="text" id="ffNick" placeholder="Free Fire Nickname">
                <p class="text-[10px] text-gray-600 mt-2">Recognized ID for tournament lobby</p>
            </div>
            <div class="input-group"><input type="text" id="ffUid" placeholder="FF UID"></div>
            <button onclick="moveStep(3)" class="btn-premium">Next</button>
        </div>

        <!-- STEP 3: TELEGRAM -->
        <div id="step3" class="step">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-light">Security</h2>
                <span class="text-gray-600 border border-gray-600 rounded-full w-5 h-5 flex items-center justify-center text-[10px]" onclick="alert('1. Open Telegram\n2. Settings > Username\n3. Create one if empty')">?</span>
            </div>
            <div class="input-group"><input type="text" id="tgUser" placeholder="Telegram Username"></div>
            <a href="https://t.me/crazemodeverifybot" target="_blank" class="btn-premium btn-tg block text-center mb-6">Get Code</a>
            <div class="input-group">
                <input type="number" id="tgCode" placeholder="Enter Code" oninput="limitLength(this, 4)">
                <p id="tgError" class="error-msg">Invalid Code</p>
            </div>
            <button onclick="verifyTg()" class="btn-premium btn-tg">Verify Telegram</button>
        </div>

        <!-- STEP 4: FINAL -->
        <div id="step4" class="step text-center">
            <p class="text-gray-400 text-sm mb-10 px-4">Keep your Game ID safe. It unlocks faster registrations and member benefits.</p>
            <button id="genBtn" onclick="generateID()" class="btn-premium">Get Game ID</button>
            <div id="finalBox" class="hidden">
                <div id="displayId" class="text-4xl font-mono tracking-tighter mb-2"></div>
                <p class="text-[10px] text-gray-600 mb-10">KEEP IT PRIVATE</p>
                <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="btn-premium btn-tg block text-center">Join Private Group</a>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxfdHCM3CiEbSK0LXzmxGLeE0DcK6_6wScoWU-IiIWjOi_3Ll7snT8jppC9eNJf15YE/exec";
        
        function limitLength(el, max) {
            if(el.value.length > max) el.value = el.value.slice(0, max);
        }

        function moveStep(s) {
            document.querySelectorAll('.step').forEach(x => x.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.step').forEach(x => x.style.display = 'none');
                document.getElementById('step'+s).style.display = 'block';
                setTimeout(() => document.getElementById('step'+s).classList.add('active'), 50);
            }, 300);
        }

        async function handleEmail() {
            let email = document.getElementById('email').value;
            if(!email.includes("@gmail.com")) return alert("Gmail only");
            document.getElementById('eBtn').innerText = "Sending Code...";
            await fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:email})});
            document.getElementById('eBtn').classList.add('hidden');
            document.getElementById('otpBox').classList.remove('hidden');
        }

        async function verifyTg() {
            let user = document.getElementById('tgUser').value;
            let code = document.getElementById('tgCode').value;
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:user, code:code})});
            let res = await r.json();
            if(res.success) moveStep(4);
            else document.getElementById('tgError').classList.add('visible');
        }

        function generateID() {
            let gid = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            document.getElementById('displayId').innerText = gid;
            document.getElementById('genBtn').classList.add('hidden');
            document.getElementById('finalBox').classList.remove('hidden');
        }

        function finalSubmit() {
            let f = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                ffNick: document.getElementById('ffNick').value,
                ffUid: document.getElementById('ffUid').value,
                tgUser: document.getElementById('tgUser').value,
                gameId: document.getElementById('displayId').innerText
            };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
