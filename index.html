<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Registration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --tg-blue: #0088cc;
            --success: #00ff88;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. ANTIGRAVITY INTRO */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: 20px;
            text-transform: uppercase;
            opacity: 0;
            color: white;
        }

        /* 2. FORM LAYOUT */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            display: none;
            opacity: 0;
        }

        .step { display: none; }
        .step.active { display: block; }

        h2 { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }

        .input-group { margin-bottom: 35px; position: relative; }
        label { display: block; font-size: 11px; color: #444; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;}

        .input-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            transition: 0.4s;
        }
        .input-wrapper:focus-within { border-color: white; }

        input, select {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 18px;
            outline: none;
        }

        /* 3. TELEGRAM CUSTOMS */
        .tg-header { display: flex; justify-content: space-between; align-items: center; }
        .get-btn { color: var(--tg-blue); font-size: 11px; text-decoration: none; font-weight: 700; border: 1px solid var(--tg-blue); padding: 4px 10px; border-radius: 4px; }
        
        .verify-box { margin-top: 20px; }
        .verify-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: #333; font-size: 12px; transition: 0.3s; }
        .verify-line.valid { color: var(--success); }
        .tick { display: none; font-weight: bold; }
        .valid .tick { display: inline; }

        /* 4. BUTTONS */
        .nav-btn {
            width: 100%;
            padding: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 2px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }
        .nav-btn:disabled { background: #111; color: #333; cursor: not-allowed; }

        /* 5. SUCCESS SHUFFLER */
        #shuffler-screen {
            display: none;
            text-align: center;
            width: 100%;
        }
        .shuffle-text {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            height: 50px;
        }
        .share-warning { color: #444; font-size: 12px; margin-top: 50px; text-decoration: underline; cursor: pointer; opacity: 0; }
        .tg-join-link {
            display: inline-block;
            margin-top: 20px;
            background: var(--tg-blue);
            color: white;
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
        }
    </style>
</head>
<body>

    <!-- ANTIGRAVITY INTRO -->
    <div id="intro-screen">
        <div class="brand-text">CRAZE MODE</div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        <form id="crazeForm">
            <input type="hidden" name="Game_ID" id="hidden_id">

            <!-- STEP 1: EMAIL (GOOGLE STYLE) -->
            <div class="step active" id="s1">
                <h2>Account Authentication</h2>
                <div class="input-group">
                    <label>Gmail / Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" name="Email" id="emailInp" placeholder="Enter your email" required>
                    </div>
                </div>
                <button type="button" class="nav-btn" id="btn1" onclick="go(1, 2)">Continue</button>
            </div>

            <!-- STEP 2: MOBILE -->
            <div class="step" id="s2">
                <h2>Security Link</h2>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <div class="input-wrapper">
                        <span style="color:#555; padding-right:10px; font-size:18px;">+91</span>
                        <input type="tel" name="Mobile" id="phoneInp" placeholder="00000 00000" maxlength="10">
                    </div>
                </div>
                <button type="button" class="nav-btn" id="btn2" disabled onclick="go(2, 3)">Confirm Identity</button>
            </div>

            <!-- STEP 3: GAME PROFILE -->
            <div class="step" id="s3">
                <h2>Game Identity</h2>
                <div class="input-group">
                    <label>In-Game Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="IGN" placeholder="Enter in-game username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Player UID</label>
                    <div class="input-wrapper">
                        <input type="text" name="UID" placeholder="Enter UID" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Skill Experience</label>
                    <div class="input-wrapper">
                        <select name="Experience">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Elite">Elite Pro</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="nav-btn" onclick="go(3, 4)">Next Section</button>
            </div>

            <!-- STEP 4: TELEGRAM VALIDATION -->
            <div class="step" id="s4">
                <div class="tg-header">
                    <h2>Community Verification</h2>
                    <a href="https://t.me/crazemodeverifybot" target="_blank" class="get-btn">GET</a>
                </div>
                <div class="input-group" style="margin-top:20px;">
                    <label>Telegram @Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="Telegram" id="tgInp" placeholder="@username">
                    </div>
                </div>
                <div class="verify-box">
                    <div class="verify-line" id="v1"><span>○</span> Format Validated <span class="tick">✓</span></div>
                    <div class="verify-line" id="v2"><span>○</span> Server Existence Check <span class="tick">✓</span></div>
                    <div class="verify-line" id="v3"><span>○</span> Ownership Confirmed <span class="tick">✓</span></div>
                </div>
                <button type="submit" class="nav-btn" id="submitBtn" disabled>Get Game ID</button>
            </div>
        </form>

        <!-- STEP 5: SHUFFLER -->
        <div id="shuffler-screen">
            <div class="shuffle-text" id="shuffledResult"></div>
            <p class="share-warning" id="warning">DON'T SHARE THIS WITH ANYONE</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" class="tg-join-link" id="tgLink">JOIN TELEGRAM GROUP</a>
        </div>
    </div>

    <script>
        // 1. ANTIGRAVITY INTRO
        window.addEventListener('DOMContentLoaded', () => {
            gsap.timeline()
                .to(".brand-text", { opacity: 1, duration: 1.2, letterSpacing: "10px", ease: "power3.out" })
                .to(".brand-text", { y: -80, opacity: 0, duration: 0.8, ease: "power3.in", delay: 0.5 })
                .set("#intro-screen", { display: "none" })
                .to(".app-container", { display: "block", opacity: 1, duration: 0.6 });
        });

        // 2. NAVIGATION & MOBILE LOGIC
        function go(f, t) {
            gsap.to(`#s${f}`, { opacity: 0, x: -20, duration: 0.3, onComplete: () => {
                document.getElementById(`s${f}`).classList.remove('active');
                document.getElementById(`s${t}`).classList.add('active');
                gsap.fromTo(`#s${t}`, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 });
            }});
        }

        document.getElementById('phoneInp').addEventListener('input', function() {
            document.getElementById('btn2').disabled = (this.value.length !== 10);
        });

        // 3. TELEGRAM VERIFICATION (Visual simulation)
        document.getElementById('tgInp').addEventListener('input', function() {
            const val = this.value;
            const btn = document.getElementById('submitBtn');
            if(val.startsWith('@') && val.length > 4) {
                setTimeout(() => document.getElementById('v1').classList.add('valid'), 400);
                setTimeout(() => document.getElementById('v2').classList.add('valid'), 1000);
                setTimeout(() => { 
                    document.getElementById('v3').classList.add('valid');
                    btn.disabled = false;
                }, 1600);
            } else {
                document.querySelectorAll('.verify-line').forEach(l => l.classList.remove('valid'));
                btn.disabled = true;
            }
        });

        // 4. FORM SUBMISSION & SHUFFLER
        const G_SHEET_URL = 'https://script.google.com/macros/s/AKfycbw8PShIc7M9dc1eahMGCuOn4WU68hbPWGCznJCmKIZrfkUbrXoNjA7vemLaHpSkouUW/exec';

        document.getElementById('crazeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const finalID = generateGameID();
            document.getElementById('hidden_id').value = finalID;

            // Submit to sheets in background
            fetch(G_SHEET_URL, { method: 'POST', body: new FormData(this), mode: 'no-cors' });

            // Switch to Shuffler
            gsap.to("#crazeForm", { opacity: 0, duration: 0.4, onComplete: () => {
                document.getElementById('crazeForm').style.display = 'none';
                document.getElementById('shuffler-screen').style.display = 'block';
                runShuffler(finalID);
            }});
        });

        function generateGameID() {
            const charset = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const pick = (n) => Array.from({length:n}, () => charset[Math.floor(Math.random()*charset.length)]).join('');
            return `CM-${pick(4)}-${pick(4)}`;
        }

        function runShuffler(target) {
            const el = document.getElementById('shuffledResult');
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let count = 0;
            
            const timer = setInterval(() => {
                el.innerText = target.split('').map((char, i) => {
                    if(char === '-') return '-';
                    if(count > i * 8) return target[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');

                if(count++ >= 60) {
                    clearInterval(timer);
                    el.innerText = target;
                    // Fade in links
                    gsap.to("#warning", { opacity: 1, duration: 1 });
                    gsap.to("#tgLink", { opacity: 1, y: 0, duration: 0.8, delay: 0.5 });
                }
            }, 100);
        }
    </script>
</body>
</html>
