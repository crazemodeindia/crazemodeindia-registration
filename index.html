<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZE MODE | Premium Registration</title>

    <!-- Social Meta Tags -->
    <meta property="og:title" content="CRAZE MODE | Join the Elite">
    <meta property="og:description" content="Register for premium skill-based tournaments.">
    <meta property="og:image" content="https://crazemodeindia.github.io/registration/preview.jpg">

    <!-- Premium Google Fonts (Inter for that Apple/Google look) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --card: #0A0A0A;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-secondary: #888888;
            --accent: #FFFFFF;
            --error: #FF3B30; /* Apple Error Red */
            --tg-blue: #007AFF; /* Apple Blue */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Logo styling: Keeping the Soul, but making it modern */
        .brand-header { text-align: center; margin-bottom: 50px; }
        .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 500;
        }

        /* Form styling */
        .form-section { margin-bottom: 32px; }
        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .input-wrap { margin-bottom: 20px; position: relative; }
        
        .input-wrap label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #E5E5E5;
        }

        input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            background: #111111;
        }

        /* Mobile Prefix */
        .mobile-field { display: flex; align-items: center; }
        .prefix {
            background: #111;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: var(--text-secondary);
            font-size: 16px;
        }
        .mobile-input { border-radius: 0 8px 8px 0; }

        /* Custom Checkboxes */
        .check-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .check-container input { width: 18px; height: 18px; accent-color: white; cursor: pointer; }

        /* Main CTA */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { transform: scale(0.99); opacity: 0.9; }
        .btn-primary:disabled { background: #333; color: #777; }

        /* Success Overlay: The "Apple" Summary Dialog */
        #successOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            width: 90%;
            max-width: 360px;
            background: #000;
            border: 1px solid var(--border);
            padding: 40px 24px;
            border-radius: 24px;
            text-align: center;
        }

        .modal h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .modal p { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #111;
            font-size: 14px;
        }
        .summary-item span { color: var(--text-secondary); }

        .id-badge {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: white;
            margin: 24px 0;
            letter-spacing: 1px;
            border: 1px solid #222;
        }

        .btn-final {
            display: block;
            background: var(--tg-blue);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="brand-header">
            <div class="logo">CRAZE MODE</div>
            <div class="tagline">The Skill Standard</div>
        </div>

        <form id="crazeForm">
            <div class="section-label">01. CONTACT INTEL</div>
            
            <div class="input-wrap">
                <label>Email Address</label>
                <input type="email" name="email" id="email" required placeholder="name@company.com">
            </div>

            <div class="input-wrap">
                <label>Mobile Number</label>
                <div class="mobile-field">
                    <div class="prefix">+91</div>
                    <input type="text" name="phone" id="phone" class="mobile-input" maxlength="10" required placeholder="00000 00000">
                </div>
            </div>

            <div class="section-label">02. PLAYER PROFILE</div>

            <div class="input-wrap">
                <label>Actual Name</label>
                <input type="text" name="name" id="name" required placeholder="John Doe">
            </div>

            <div class="input-wrap">
                <label>In-Game Name</label>
                <input type="text" name="ign" id="ign" required placeholder="Username">
            </div>

            <div class="input-wrap">
                <label>Player UID</label>
                <input type="text" name="uid" id="uid" required placeholder="Unique ID">
            </div>

            <div class="input-wrap">
                <label>Skill Tier / Rank</label>
                <input type="text" name="exp" id="exp" required placeholder="e.g. Master">
            </div>

            <div class="section-label">03. CONNECTIVITY</div>

            <div class="input-wrap">
                <label>Telegram Username</label>
                <input type="text" name="telegram" id="telegram" required placeholder="@username">
            </div>

            <div class="input-wrap">
                <label>Discord (Optional)</label>
                <input type="text" name="discord" id="discord" placeholder="User#0000">
            </div>

            <label class="check-container">
                <input type="checkbox" required> I agree to the terms of service
            </label>
            <label class="check-container">
                <input type="checkbox" required> I am 18+ years of age
            </label>

            <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        </form>
    </div>

    <!-- SUCCESS OVERLAY -->
    <div id="successOverlay">
        <div class="modal">
            <h2>Welcome</h2>
            <p>Your combat identity has been synchronized.</p>
            
            <div id="summary"></div>

            <div class="id-badge" id="generatedID">GENERATING...</div>

            <a href="https://t.me/+ulWO6jBK3uRiNjE1" class="btn-final">Join Group</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('crazeForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwp0FzRgCLaPMKZIyAwb2Cby_5b7GotW95wXyUBnhmG7hIkh14kP7X5bX7Cinwiep7g/exec';

        // 10-digit only mobile logic
        document.getElementById('phone').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Generate Premium ID: CM-XXXX-0000
        function generateID() {
            const pool = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let part1 = "";
            for(let i=0; i<4; i++) part1 += pool[Math.floor(Math.random()*pool.length)];
            let part2 = Math.floor(1000 + Math.random() * 9000);
            return `CM-${part1}-${part2}`;
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const phone = document.getElementById('phone').value;

            if (phone.length !== 10) {
                alert("Please enter a valid 10-digit number.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            const newID = generateID();
            const formData = new FormData(form);
            formData.append('Generated_ID', newID);

            fetch(scriptURL, { method: 'POST', body: formData})
                .then(res => res.text())
                .then(msg => {
                    if (msg === "SUCCESS") {
                        showSuccess(newID);
                    } else {
                        alert(msg); // Shows "DUPLICATE_EMAIL" or "DUPLICATE_PHONE"
                        btn.disabled = false;
                        btn.innerText = "Create Account";
                    }
                })
                .catch(() => {
                    alert("Connection error. Try again.");
                    btn.disabled = false;
                    btn.innerText = "Create Account";
                });
        });

        function showSuccess(id) {
            document.getElementById('successOverlay').style.display = 'flex';
            document.getElementById('generatedID').innerText = id;
            
            const list = `
                <div class="summary-item"><span>Identity</span> <b>${document.getElementById('name').value}</b></div>
                <div class="summary-item"><span>Operator</span> <b>${document.getElementById('ign').value}</b></div>
                <div class="summary-item"><span>Contact</span> <b>+91 ${document.getElementById('phone').value}</b></div>
            `;
            document.getElementById('summary').innerHTML = list;
        }
    </script>
</body>
</html>
