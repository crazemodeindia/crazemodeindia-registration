<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craze Mode Registration</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF; /* Apple Blue */
            --success: #34C759; /* Apple Green */
            --warning: #FACC15; /* Google Amber */
            --bg: #F5F5F7;      /* Apple Light Gray */
            --card: #FFFFFF;
            --text: #1D1D1F;
            --secondary-text: #86868B;
        }

        * { box-sizing: border-box; font-family: 'Lexend', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        .logo {
            text-align: center;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -1px;
            margin-bottom: 30px;
            color: var(--text);
        }

        .step-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .step {
            height: 4px;
            flex: 1;
            background: #E5E5E7;
            border-radius: 10px;
        }

        .step.active { background: var(--primary); }

        h2 { font-size: 22px; margin-bottom: 8px; font-weight: 600; }
        p.subtitle { font-size: 14px; color: var(--secondary-text); margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--secondary-text); text-transform: uppercase; }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #D2D2D7;
            font-size: 16px;
            background: #FBFBFD;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(0,122,255,0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: var(--text);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { background: #D2D2D7; cursor: not-allowed; }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            font-size: 14px;
            margin-top: 5px;
        }

        .verification-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .pending { background: #FFF9E6; color: #D97706; }
        .verified { background: #E6F9ED; color: #15803D; }

        #form-status {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        /* Shake animation for errors */
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            25% {transform: translateX(-5px);}
            75% {transform: translateX(5px);}
        }
        .error-input { border-color: #FF3B30 !important; animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">CRAZE MODE</div>
    
    <div class="step-indicator">
        <div class="step active" id="s1"></div>
        <div class="step" id="s2"></div>
        <div class="step" id="s3"></div>
    </div>

    <!-- Step 1: Basic Info -->
    <div id="step1">
        <h2>Identity</h2>
        <p class="subtitle">Enter your official game details.</p>
        
        <div class="input-group">
            <label>Game ID (Identity)</label>
            <input type="text" id="gameID" placeholder="Ex: CM-AAAA-1234" oninput="validateGameID(this)">
        </div>
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="John Doe">
        </div>

        <div class="input-group">
            <label>In-Game Name (IGN)</label>
            <input type="text" id="ign" placeholder="ProPlayer_01">
        </div>

        <button class="btn" onclick="nextStep(2)">Continue</button>
    </div>

    <!-- Step 2: Verification -->
    <div id="step2" style="display:none;">
        <h2>Verification</h2>
        <p class="subtitle">Secure your entry via Telegram & Email.</p>

        <div class="input-group">
            <label>Telegram Username</label>
            <input type="text" id="telegram" placeholder="@username">
            <button class="btn btn-secondary" onclick="verifyTelegram()">Verify via Bot</button>
            <div id="tg-status" class="verification-badge pending">Not Verified</div>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="name@example.com">
            <button class="btn btn-secondary" onclick="sendEmailOTP()">Send OTP</button>
            <div id="email-status" class="verification-badge pending">Waiting for OTP</div>
        </div>

        <button class="btn" id="finalBtn" disabled onclick="submitForm()">Finalize Registration</button>
    </div>

    <div id="form-status"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6twgHGXuuXHq2Ceva4tg7V411w65JVdPgI7aYSlD6dYitYUrxTJKtLfz1JGIOgdZj/exec";
    
    let isTgVerified = false;
    let isEmailVerified = false;
    let serverEmailCode = null;

    function validateGameID(input) {
        const pattern = /^CM-[A-Z]{4}-\d{4}$/;
        if(pattern.test(input.value.toUpperCase())) {
            input.classList.remove('error-input');
            input.style.borderColor = "var(--success)";
        } else {
            input.style.borderColor = "var(--primary)";
        }
    }

    function nextStep(step) {
        if(step === 2) {
            const gid = document.getElementById('gameID').value.toUpperCase();
            if(!/^CM-[A-Z]{4}-\d{4}$/.test(gid)) {
                document.getElementById('gameID').classList.add('error-input');
                return;
            }
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('s2').classList.add('active');
        }
    }

    async function verifyTelegram() {
        const username = document.getElementById('telegram').value;
        const code = prompt("Enter the 6-digit code received from @CrazeModeBot");
        if(!code) return;

        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'verifyTelegram', username: username, userCode: code })
        });
        const res = await resp.json();
        
        if(res.status === 'success') {
            isTgVerified = true;
            document.getElementById('tg-status').innerText = "Verified ☑️";
            document.getElementById('tg-status').className = "verification-badge verified";
            checkReady();
        } else {
            alert("Invalid or Expired Code");
        }
    }

    async function sendEmailOTP() {
        const email = document.getElementById('email').value;
        if(!email.includes('@')) return alert("Invalid Email");

        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'sendEmail', email: email })
        });
        const res = await resp.json();

        if(res.status === 'sent') {
            const userOtp = prompt("OTP sent to your email. Enter here:");
            if(userOtp == res.code) {
                isEmailVerified = true;
                document.getElementById('email-status').innerText = "Verified ☑️";
                document.getElementById('email-status').className = "verification-badge verified";
                checkReady();
            }
        }
    }

    function checkReady() {
        if(isTgVerified && isEmailVerified) {
            document.getElementById('finalBtn').disabled = false;
            document.getElementById('s3').classList.add('active');
        }
    }

    async function submitForm() {
        const btn = document.getElementById('finalBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const payload = {
            action: 'save',
            gameID: document.getElementById('gameID').value.toUpperCase(),
            name: document.getElementById('name').value,
            ign: document.getElementById('ign').value,
            telegram: document.getElementById('telegram').value,
            email: document.getElementById('email').value,
            uid: "UID-" + Math.floor(Math.random()*1000000) // Example placeholder
        };

        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const res = await resp.json();

        if(res.status === 'saved') {
            document.querySelector('.container').innerHTML = `
                <div style="text-align:center; padding: 40px 0;">
                    <div style="font-size: 60px;">☑️</div>
                    <h2 style="margin-top:20px;">Registration Complete</h2>
                    <p style="color:var(--secondary-text)">Your entry for the next 24 hours has been secured. Welcome to Craze Mode.</p>
                </div>
            `;
        }
    }
</script>

</body>
</html>
