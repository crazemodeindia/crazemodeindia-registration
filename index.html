<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRAZE MODE | Sovereign Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --raj: 'Rajdhani', sans-serif; --accent: #a855f7; }
        body { background: #000; color: #fff; font-family: var(--raj); margin: 0; overflow: hidden; height: 100vh; }

        /* TELE-STREAK ANIMATION */
        #teleStreak { position: fixed; inset: 0; z-index: 700; display: none; }
        .tg-fly { position: absolute; top: 50%; width: 40px; transform: translateY(-50%); animation: streak 0.8s ease-in forwards; }
        @keyframes streak { 
            0% { left: -10%; opacity: 0; } 
            50% { opacity: 1; } 
            100% { left: 110%; opacity: 0; } 
        }

        /* SWORD SLASH */
        #slash { position: fixed; inset: 0; z-index: 600; background: #000; display: none; }
        .slash-beam { position: absolute; height: 2px; width: 150%; background: #fff; top: 50%; left: -25%; transform: rotate(-45deg); box-shadow: 0 0 20px #fff, 0 0 40px var(--accent); animation: slashMove 0.5s ease-out forwards; }
        @keyframes slashMove { 0% { transform: translateY(100vh) rotate(-45deg); } 100% { transform: translateY(-100vh) rotate(-45deg); } }

        /* INTRO REVEAL */
        #intro { position: fixed; inset: 0; background: #000; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .welcome { font-weight: 300; letter-spacing: 0.8rem; color: #444; font-size: 0.8rem; text-transform: uppercase; border-right: 1px solid #fff; white-space: nowrap; width: 0; animation: typing 1.5s steps(15) forwards; }
        @keyframes typing { from { width: 0; } to { width: 140px; } }
        
        .brand-reveal { font-size: clamp(2rem, 10vw, 4rem); font-weight: 700; letter-spacing: 2rem; opacity: 0; transition: 2s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; margin: 1.5rem 0; }
        .brand-reveal.show { opacity: 1; letter-spacing: 0.5rem; }
        .brand-sub { font-weight: 300; letter-spacing: 0.3rem; color: #222; opacity: 0; transition: 1s; }

        .enter-btn { margin-top: 5rem; padding: 1rem 3.5rem; border: 1px solid #222; background: transparent; color: #fff; font-weight: 700; letter-spacing: 0.3rem; opacity: 0; transition: 0.4s; cursor: pointer; border-radius: 4px; font-size: 0.8rem; }
        .enter-btn:hover { border-color: #fff; background: #fff; color: #000; }
        .enter-btn:active { transform: scale(0.95); }

        /* STICKY HEADER & PROGRESS */
        .sticky-header { position: fixed; top: 12vh; width: 100%; text-align: center; z-index: 100; opacity: 0; transition: 1s; }
        .header-title { font-weight: 700; letter-spacing: 0.6rem; font-size: 1.5rem; text-transform: uppercase; }
        .header-sub { font-size: 8px; color: #333; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        
        .prog-wrap { position: fixed; top: 22vh; width: 70%; left: 15%; z-index: 100; opacity: 0; transition: 1s; }
        .prog-bg { height: 6px; background: #0a0a0a; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; width: 25%; background: linear-gradient(90deg, #fff, var(--accent), #fff); background-size: 200% 100%; animation: pulse 3s infinite linear; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulse { to { background-position: 200% 0; } }

        /* CENTERED PRECISE CARD */
        #app { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .card { width: 90%; max-width: 380px; padding: 4rem 3rem; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border: 1px solid #0a0a0a; border-radius: 8px; display: none; opacity: 0; transform: translateY(30px); transition: 0.6s; }
        .card.active { display: block; opacity: 1; transform: translateY(0); }

        .input-wrap { margin-bottom: 3.5rem; position: relative; }
        input, select { background: transparent; border: none; border-bottom: 1px solid #111; width: 100%; padding: 0.8rem 0; color: #fff; font-size: 1.2rem; outline: none; transition: 0.3s; border-radius: 0; }
        input:focus, select:focus { border-bottom-color: #fff; }
        
        .btn-action { background: #fff; color: #000; width: 100%; padding: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 4px; font-size: 0.9rem; }
        .btn-action:active { transform: scale(0.97); }

        .error-txt { color: #ff3333; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; display: none; }
        .id-box { border: 1px solid #111; padding: 2.5rem; background: #020202; text-align: center; cursor: pointer; border-radius: 4px; }
        .id-text { font-family: monospace; font-size: 1.6rem; letter-spacing: 5px; color: #fff; }
    </style>
</head>
<body>

    <!-- ANIMATIONS -->
    <div id="teleStreak"><img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tg-fly"></div>
    <div id="slash"><div class="slash-beam"></div></div>

    <!-- INTRO -->
    <div id="intro">
        <p class="welcome">Welcome to</p>
        <h1 class="brand-reveal" id="rTitle">CRAZE MODE</h1>
        <p class="brand-sub" id="rSub">Where Skill Takes the Spotlight</p>
        <button class="enter-btn" id="eBtn" onclick="triggerArena()">Enter Arena</button>
    </div>

    <!-- UI -->
    <div class="sticky-header" id="sHeader">
        <h1 class="header-title">CRAZE MODE</h1>
        <p class="header-sub">Registration Phase</p>
    </div>
    <div class="prog-wrap" id="pWrap">
        <div class="prog-bg"><div class="prog-fill" id="pFill"></div></div>
    </div>

    <div id="app">
        <!-- STEP 1: GMAIL -->
        <div id="step1" class="card active">
            <h2 class="text-[10px] tracking-[0.4rem] mb-12 text-gray-700 uppercase font-bold">Authentication</h2>
            <div class="input-wrap"><input type="email" id="email" placeholder="GMAIL ADDRESS"></div>
            <button onclick="sendOTP()" id="gBtn" class="btn-action">Verify</button>
            <div id="otpBox" class="hidden mt-10">
                <div class="input-wrap">
                    <input type="text" id="emailOtp" placeholder="6-DIGIT CODE" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <p id="eErr" class="error-txt">Sync Failed: Invalid Code</p>
                </div>
                <button onclick="verifyOTP()" id="cBtn" class="btn-action">Proceed</button>
            </div>
        </div>

        <!-- STEP 2: PLAYER -->
        <div id="step2" class="card">
            <h2 class="text-[10px] tracking-[0.4rem] mb-12 text-gray-700 uppercase font-bold">Identity</h2>
            <div class="input-wrap"><input type="text" id="name" placeholder="ACTUAL NAME"></div>
            <div class="input-wrap"><input type="text" id="nick" placeholder="FF NICKNAME"></div>
            <div class="input-wrap"><input type="text" id="uid" placeholder="FF UID"></div>
            <div class="input-wrap">
                <select id="exp">
                    <option value="" disabled selected>EXPERIENCE LEVEL</option>
                    <option value="Rookie">ROOKIE (0-1 YR)</option>
                    <option value="Veteran">VETERAN (2-3 YRS)</option>
                    <option value="Elite">ELITE (4+ YRS)</option>
                </select>
            </div>
            <button onclick="move(3)" class="btn-action">Submit Profile</button>
        </div>

        <!-- STEP 3: SECURITY -->
        <div id="step3" class="card">
            <h2 class="text-[10px] tracking-[0.4rem] mb-12 text-gray-700 uppercase font-bold">Security</h2>
            <div class="input-wrap"><input type="text" id="tgUser" placeholder="TELEGRAM USERNAME"></div>
            <button onclick="runTeleStreak()" class="btn-action mb-8" style="background:#229ED9; color:#fff;">Get Code</button>
            <div class="input-wrap">
                <input type="text" id="tgCode" placeholder="4-DIGIT CODE" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                <p id="tErr" class="error-txt">Invalid Security Key</p>
            </div>
            <button onclick="verifyTg()" id="tBtn" class="btn-action">Authorize</button>
        </div>

        <!-- STEP 4: FINAL -->
        <div id="step4" class="card text-center">
            <svg class="w-10 mx-auto mb-6 opacity-50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <h2 class="text-[10px] tracking-[0.3rem] mb-10 text-gray-600 uppercase font-light">Allocation Complete</h2>
            <div class="id-box mb-4" onclick="copyId()"><div id="idDisplay" class="id-text">********</div></div>
            <p class="text-[8px] text-gray-700 mb-12 uppercase tracking-widest">Keep it private</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="btn-action block" style="background:#229ED9; color:#fff;">Join Arena</a>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzMHjL1PicDlmO5Eo0mg4tGAdouQvHUSk_zTCfm-kvvTjozYFbWjjUPL6ucyqrRD6Lx/exec";

        window.onload = () => {
            setTimeout(() => { document.getElementById('rTitle').classList.add('show'); 
            setTimeout(() => { document.getElementById('rSub').style.opacity = "1"; 
            setTimeout(() => { document.getElementById('eBtn').style.opacity = "1"; }, 800); }, 1000); }, 1500);
        };

        function triggerArena() {
            document.getElementById('slash').style.display = 'block';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('sHeader').style.opacity = '1';
                document.getElementById('pWrap').style.opacity = '1';
                document.getElementById('step1').classList.add('active');
                document.getElementById('slash').style.display = 'none';
            }, 500);
        }

        function runTeleStreak() {
            document.getElementById('teleStreak').style.display = 'block';
            setTimeout(() => { window.open('https://t.me/CMAccessBot', '_blank'); document.getElementById('teleStreak').style.display = 'none'; }, 800);
        }

        function move(s) {
            document.getElementById('pFill').style.width = (s * 25) + "%";
            document.querySelectorAll('.card').forEach(x => x.classList.remove('active'));
            setTimeout(() => { document.getElementById('step'+s).classList.add('active'); if(s === 4) startID(); }, 400);
        }

        async function sendOTP() {
            const e = document.getElementById('email').value; if(!e.includes("@")) return;
            document.getElementById('gBtn').innerText = "SYNCING...";
            fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:e})});
            document.getElementById('otpBox').classList.remove('hidden');
            document.getElementById('gBtn').style.display='none';
        }

        async function verifyOTP() {
            const otp = document.getElementById('emailOtp').value; if(otp.length !== 6) return;
            document.getElementById('cBtn').innerText = "VERIFYING...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:document.getElementById('email').value, otp:otp})});
            let res = await r.json();
            if(res.success) move(2); else { document.getElementById('eErr').style.display='block'; document.getElementById('cBtn').innerText = "Proceed"; }
        }

        async function verifyTg() {
            const u = document.getElementById('tgUser').value;
            const c = document.getElementById('tgCode').value; if(c.length !== 4) return;
            document.getElementById('tBtn').innerText = "AUTHENTICATING...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:u, code:c})});
            let res = await r.json();
            if(res.success) move(4); else { document.getElementById('tErr').style.display='block'; document.getElementById('tBtn').innerText = "Authorize"; }
        }

        function startID() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const gameId = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            let i = 0;
            let timer = setInterval(() => {
                document.getElementById('idDisplay').innerText = gameId.split("").map((l, idx) => idx < i ? gameId[idx] : chars[Math.floor(Math.random()*36)]).join("");
                if(i >= gameId.length) clearInterval(timer);
                i += 1/4;
            }, 40);
            window.finalId = gameId;
        }

        function copyId() { navigator.clipboard.writeText(window.finalId); alert("ID COPIED"); }

        function finalSubmit() {
            const f = { email: document.getElementById('email').value, name: document.getElementById('name').value, ffNick: document.getElementById('nick').value, ffUid: document.getElementById('uid').value, exp: document.getElementById('exp').value, tgUser: document.getElementById('tgUser').value, gameId: window.finalId };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
