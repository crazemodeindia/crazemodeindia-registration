<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRAZE MODE | Sovereign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --brand: 'Rajdhani', sans-serif; --system: 'Inter', sans-serif; --glow: rgba(168, 85, 247, 0.4); }
        body { background: #000; color: #fff; font-family: var(--system); margin: 0; overflow: hidden; height: 100vh; -webkit-font-smoothing: antialiased; }

        /* HEARTBEAT LOGO ON TOP */
        .top-brand { position: fixed; top: 8vh; width: 100%; text-align: center; z-index: 500; opacity: 0; transition: 1s; }
        .top-brand h1 { font-family: var(--brand); font-size: 1.6rem; letter-spacing: 0.6rem; font-weight: 700; text-transform: uppercase; animation: pulseGlow 4s infinite ease-in-out; }
        .top-brand p { font-size: 8px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.8; filter: blur(0px); } 50% { opacity: 1; filter: drop-shadow(0 0 10px #fff); } }

        /* INTRO */
        #intro { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .welcome-flicker { font-size: 0.8rem; letter-spacing: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 1rem; opacity: 0; animation: flicker 1s steps(2) 1 forwards; }
        @keyframes flicker { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .brand-reveal { font-family: var(--brand); font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 700; letter-spacing: 1.5rem; opacity: 0; transition: 2s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; margin: 1rem 0; }
        .brand-reveal.active { opacity: 1; letter-spacing: 0.4rem; }
        .brand-sub { font-family: var(--brand); font-size: 0.8rem; font-weight: 300; letter-spacing: 0.2rem; color: #333; opacity: 0; transition: 1s; white-space: nowrap; }

        /* INTERACTIVE BUTTONS - AI ERA */
        .btn-neural { margin-top: 5rem; padding: 0.8rem 2.8rem; background: transparent; color: #fff; border: 1px solid #1a1a1a; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.3rem; text-transform: uppercase; opacity: 0; cursor: pointer; border-radius: 2px; transition: 0.4s; position: relative; overflow: hidden; }
        .btn-neural::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: 0.5s; }
        .btn-neural:hover::before { left: 100%; }
        .btn-neural:hover { border-color: #fff; box-shadow: 0 0 30px var(--glow); background: #fff; color: #000; }

        /* SCANNING INTERACTION */
        #scan { position: fixed; inset: 0; z-index: 900; background: #000; display: none; }
        .scan-line { position: absolute; height: 1px; width: 100%; background: #fff; top: 0; box-shadow: 0 0 20px #fff; animation: scanMove 0.8s ease-in-out forwards; }
        @keyframes scanMove { 0% { top: 0; } 100% { top: 100vh; } }

        /* PROGRESS */
        .prog-line { position: fixed; top: 18vh; width: 30%; left: 35%; height: 1px; background: #0a0a0a; z-index: 500; opacity: 0; transition: 1s; }
        .prog-fill { height: 100%; width: 25%; background: #fff; box-shadow: 0 0 10px #fff; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        /* CARD */
        #main-view { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .card { width: 90%; max-width: 380px; padding: 4.5rem 2.5rem; background: #000; border: 1px solid #0a0a0a; border-radius: 8px; display: none; opacity: 0; transform: translateY(10px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .card.active { display: block; opacity: 1; transform: translateY(0); }

        .label { font-size: 10px; font-weight: 600; color: #333; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 3.5rem; text-align: center; }
        .input-box { margin-bottom: 3.5rem; }
        input, .custom-select { background: transparent; border: none; border-bottom: 1px solid #111; width: 100%; padding: 0.8rem 0; color: #fff; font-size: 1.15rem; outline: none; transition: 0.3s; border-radius: 0; }
        input:focus { border-bottom-color: #fff; }

        /* CUSTOM DROPDOWN */
        .dropdown-container { position: relative; }
        .dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: #080808; border: 1px solid #111; z-index: 10; display: none; max-height: 200px; overflow-y: auto; }
        .dropdown-item { padding: 12px 20px; font-size: 0.9rem; color: #888; cursor: pointer; transition: 0.2s; }
        .dropdown-item:hover { background: #111; color: #fff; }

        .primary-btn { background: #fff; color: #000; width: auto; min-width: 140px; margin: 0 auto; display: block; padding: 0.8rem 2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; font-size: 0.8rem; transition: 0.3s; }
        .primary-btn:active { transform: scale(0.96); opacity: 0.8; }
        .tg-btn { background: #229ED9; color: #fff; }
        .err-msg { color: #ff3333; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div id="scan"><div class="scan-line"></div></div>

    <!-- 1. INTRO LAYER -->
    <div id="intro">
        <p class="welcome-flicker">Welcome to</p>
        <h1 class="brand-reveal" id="rTitle">CRAZE MODE</h1>
        <p class="brand-sub" id="rSub">Where Skill Takes the Spotlight</p>
        <button class="btn-neural" id="eBtn" onclick="initScan()">Enter Arena</button>
    </div>

    <!-- 2. STICKY TOP BRAND -->
    <div class="top-brand" id="tBrand">
        <h1>CRAZE MODE</h1>
        <p>Sovereign Protocol Active</p>
    </div>
    <div class="prog-line" id="pLine"><div class="prog-fill" id="pFill"></div></div>

    <!-- 3. MAIN INTERFACE -->
    <div id="main-view">
        <!-- STEP 1 -->
        <div id="step1" class="card active">
            <span class="label">Authentication</span>
            <div class="input-box"><input type="email" id="email" placeholder="Gmail Address" autocomplete="off"></div>
            <button onclick="sendOTP()" id="gBtn" class="primary-btn">Request</button>
            <div id="otpBox" class="hidden mt-10">
                <div class="input-box">
                    <input type="text" id="emailOtp" placeholder="6-Digit OTP" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <p id="eErr" class="err-msg">Invalid Sync Code</p>
                </div>
                <button onclick="verifyOTP()" id="cBtn" class="primary-btn">Sync</button>
            </div>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="card">
            <span class="label">Identity Mapping</span>
            <div class="input-box"><input type="text" id="name" placeholder="Actual Name"></div>
            <div class="input-box"><input type="text" id="nick" placeholder="Free Fire Nickname"></div>
            <div class="input-box"><input type="text" id="uid" placeholder="FF UID"></div>
            <div class="input-box dropdown-container">
                <div class="custom-select" id="expDisplay" onclick="toggleDrop()" style="cursor:pointer; color:#666;">Experience Level</div>
                <div class="dropdown-list" id="expList">
                    <div class="dropdown-item" onclick="selectExp('Amateur')">Amateur</div>
                    <div class="dropdown-item" onclick="selectExp('Trained')">Trained</div>
                    <div class="dropdown-item" onclick="selectExp('Experienced')">Experienced</div>
                    <div class="dropdown-item" onclick="selectExp('Advanced')">Advanced</div>
                    <div class="dropdown-item" onclick="selectExp('Pro')">Pro</div>
                </div>
            </div>
            <button onclick="move(3)" class="primary-btn">Commit</button>
        </div>

        <!-- STEP 3 -->
        <div id="step3" class="card">
            <span class="label">Secure Link</span>
            <div class="input-box"><input type="text" id="tgUser" placeholder="Telegram @Username"></div>
            <button onclick="window.open('https://t.me/CMAccessBot')" class="primary-btn tg-btn mb-10">Get Code</button>
            <div class="input-box">
                <input type="text" id="tgCode" placeholder="4-Digit Code" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                <p id="tErr" class="err-msg">Authorization Rejected</p>
            </div>
            <button onclick="verifyTg()" id="tBtn" class="primary-btn tg-btn">Link</button>
        </div>

        <!-- STEP 4 -->
        <div id="step4" class="card text-center">
            <svg class="w-8 mx-auto mb-10 opacity-30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="label">System Verified</span>
            <div class="border border-[#111] p-10 mb-8 cursor-pointer bg-[#020202]" onclick="copyId()">
                <div id="idDisplay" class="font-mono text-xl tracking-[4px]">********</div>
            </div>
            <p class="text-[8px] text-gray-700 mb-12 uppercase tracking-[4px]">Keep it private</p>
            <a href="https://t.me/+3xRCpmBV3yA4NGM1" onclick="finalSubmit()" class="primary-btn tg-btn block">Join Arena</a>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzMHjL1PicDlmO5Eo0mg4tGAdouQvHUSk_zTCfm-kvvTjozYFbWjjUPL6ucyqrRD6Lx/exec";

        window.onload = () => {
            setTimeout(() => { document.getElementById('rTitle').classList.add('active'); 
            setTimeout(() => { document.getElementById('rSub').style.opacity = "1"; 
            setTimeout(() => { document.getElementById('eBtn').style.opacity = "1"; }, 800); }, 1200); }, 1000);
        };

        function initScan() {
            document.getElementById('scan').style.display = 'block';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('tBrand').style.opacity = '1';
                document.getElementById('pLine').style.opacity = '1';
                document.getElementById('step1').classList.add('active');
                document.getElementById('scan').style.display = 'none';
            }, 800);
        }

        // Custom Dropdown Logic
        function toggleDrop() { const d = document.getElementById('expList'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        function selectExp(val) { document.getElementById('expDisplay').innerText = val; document.getElementById('expDisplay').style.color = "#fff"; toggleDrop(); window.expValue = val; }

        function move(s) {
            document.getElementById('pFill').style.width = (s * 25) + "%";
            document.querySelectorAll('.card').forEach(x => { x.classList.remove('active'); x.style.display = "none"; });
            setTimeout(() => { 
                const next = document.getElementById('step'+s);
                next.style.display = "block";
                setTimeout(() => next.classList.add('active'), 50);
                if(s === 4) runDecrypt();
            }, 300);
        }

        async function sendOTP() {
            const e = document.getElementById('email').value; if(!e.includes("@")) return;
            document.getElementById('gBtn').innerText = "Processing...";
            const res = await fetch(API, {method:'POST', body:JSON.stringify({action:"sendEmailOTP", email:e})});
            document.getElementById('otpBox').classList.remove('hidden');
            document.getElementById('gBtn').style.display = "none";
        }

        async function verifyOTP() {
            const o = document.getElementById('emailOtp').value; if(o.length !== 6) return;
            document.getElementById('cBtn').innerText = "Verifying...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyEmailOTP", email:document.getElementById('email').value, otp:o})});
            let res = await r.json();
            if(res.success) move(2); else { document.getElementById('eErr').style.display = 'block'; document.getElementById('cBtn').innerText = "Sync"; }
        }

        async function verifyTg() {
            const u = document.getElementById('tgUser').value;
            const c = document.getElementById('tgCode').value; if(c.length !== 4) return;
            document.getElementById('tBtn').innerText = "Authenticating...";
            let r = await fetch(API, {method:'POST', body:JSON.stringify({action:"verifyTelegram", username:u, code:c})});
            let res = await r.json();
            if(res.success) move(4); else { document.getElementById('tErr').style.display = 'block'; document.getElementById('tBtn').innerText = "Link"; }
        }

        function runDecrypt() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const gid = "CM-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000);
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('idDisplay').innerText = gid.split("").map((l, idx) => idx < i ? gid[idx] : chars[Math.floor(Math.random()*36)]).join("");
                if(i >= gid.length) clearInterval(timer);
                i += 1/4;
            }, 40);
            window.finalId = gid;
        }

        function copyId() { navigator.clipboard.writeText(window.finalId); alert("Credentials Copied."); }

        function finalSubmit() {
            const f = { email: document.getElementById('email').value, name: document.getElementById('name').value, ffNick: document.getElementById('nick').value, ffUid: document.getElementById('uid').value, exp: window.expValue, tgUser: document.getElementById('tgUser').value, gameId: window.finalId };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:"submitForm", f:f})});
        }
    </script>
</body>
</html>
